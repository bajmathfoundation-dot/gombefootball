<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Referee Assignment | Gombe Football</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1a2a6c;
      --secondary: #b21f1f;
      --accent: #014421;
      --light: #f8f9fa;
      --dark: #212529;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #f5f7fa, #e4e8f0);
      color: var(--dark);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    header {
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .controls {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .control-group {
      margin-bottom: 10px;
    }
    
    .control-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary);
    }
    
    select {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 1rem;
      background: white;
    }
    
    select:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .zone-display {
      padding: 10px;
      background: #e8f4fd;
      border-radius: 6px;
      border: 2px solid #b3d9ff;
      font-weight: 600;
      color: var(--primary);
      text-align: center;
    }
    
    .matches-container {
      padding: 20px;
    }
    
    .matchday-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 25px;
      overflow: hidden;
    }
    
    .matchday-header {
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .matchday-title {
      font-size: 1.2rem;
      font-weight: 600;
    }
    
    .match-list {
      padding: 15px;
    }
    
    .match-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }
    
    .match-item:last-child {
      border-bottom: none;
    }
    
    .team {
      text-align: center;
      font-weight: 500;
    }
    
    .home-team {
      text-align: right;
      color: var(--primary);
    }
    
    .away-team {
      text-align: left;
      color: var(--secondary);
    }
    
    .vs {
      font-weight: bold;
      color: #666;
      font-size: 0.9rem;
      padding: 0 10px;
    }
    
    .commissioner-assignment {
      margin-top: 15px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    
    .commissioner-field {
      margin-bottom: 15px;
    }
    
    .commissioner-field label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: #555;
    }
    
    .save-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    
    .save-btn:hover {
      background: #013319;
    }
    
    .save-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .loading {
      padding: 40px;
      text-align: center;
      color: #666;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: var(--primary);
      margin: 0 auto 15px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #4CAF50;
      color: white;
      padding: 15px 25px;
      border-radius: 5px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      display: none;
    }
    
    .notification.error {
      background: #f44336;
    }
    
    @media (max-width: 768px) {
      .match-item {
        grid-template-columns: 1fr;
        text-align: center;
      }
      
      .home-team, .away-team {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-whistle"></i> Match Referee Assignment</h1>
    </header>
    
    <div class="controls">
      <div class="control-group">
        <label for="competitionType"><i class="fas fa-trophy"></i> Competition Type</label>
        <select id="competitionType">
          <option value="">-- Select Competition --</option>
          <option value="championship">Championship</option>
          <option value="league">League</option>
        </select>
      </div>
      
      <div class="control-group">
        <label><i class="fas fa-map-marker-alt"></i> Zone</label>
        <div class="zone-display">
          Southern Zone (Fixed Selection)
        </div>
      </div>
      
      <div class="control-group">
        <label for="matchdaySelect"><i class="fas fa-calendar-day"></i> Matchday</label>
        <select id="matchdaySelect" disabled>
          <option value="">-- Select Matchday --</option>
        </select>
      </div>
    </div>
    
    <div class="matches-container" id="matchesContainer">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Select competition type to load matches</p>
      </div>
    </div>
  </div>
  
  <div class="notification" id="notification"></div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
      authDomain: "gombefootball.firebaseapp.com",
      projectId: "gombefootball"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    
    // DOM elements
    const competitionTypeSelect = document.getElementById('competitionType');
    const matchdaySelect = document.getElementById('matchdaySelect');
    const matchesContainer = document.getElementById('matchesContainer');
    const loadingElement = document.getElementById('loading');
    const notification = document.getElementById('notification');
    
    // Current data
    let currentCompetition = null;
    let currentZone = "Southern Zone"; // Hardcoded zone value
    let currentMatchday = null;
    let referees = [];
    let matches = [];
    
    // Load matchdays when competition is selected
    competitionTypeSelect.addEventListener('change', async function() {
      currentCompetition = this.value;
      matchdaySelect.disabled = !currentCompetition;
      
      if (!currentCompetition) {
        matchdaySelect.innerHTML = '<option value="">-- Select Matchday --</option>';
        showLoading("Select competition type to load matches");
        return;
      }
      
      try {
        showLoading("Loading matchdays...");
        
        // Get saved fixtures for Southern Zone
        const docId = `${currentCompetition}_${currentZone}`;
        const doc = await db.collection('saved_fixtures').doc(docId).get();
        
        if (!doc.exists) {
          matchdaySelect.innerHTML = '<option value="">No matchdays found</option>';
          showLoading("No fixtures found for Southern Zone");
          return;
        }
        
        const fixtureData = doc.data();
        const matchdays = fixtureData.matchdays;
        
        matchdaySelect.innerHTML = '<option value="">-- Select Matchday --</option>';
        matchdays.forEach((md, index) => {
          const option = document.createElement('option');
          option.value = index + 1;
          option.textContent = `Matchday ${index + 1} - ${md.date}`;
          matchdaySelect.appendChild(option);
        });
        
        showLoading("Select a matchday to view matches");
      } catch (error) {
        console.error("Error loading matchdays:", error);
        showNotification("Failed to load matchdays", "error");
      }
    });
    
    // Load matches when matchday is selected
    matchdaySelect.addEventListener('change', async function() {
      currentMatchday = this.value;
      
      if (!currentMatchday || !currentCompetition) {
        showLoading("Select competition type and matchday to load matches");
        return;
      }
      
      try {
        showLoading("Loading matches and referees...");
        
        // Load matches for selected matchday
        const docId = `${currentCompetition}_${currentZone}`;
        const doc = await db.collection('saved_fixtures').doc(docId).get();
        const fixtureData = doc.data();
        const matchdayData = fixtureData.matchdays.find(md => md.matchday == currentMatchday);
        
        if (!matchdayData) {
          showLoading("No matches found for selected matchday");
          return;
        }
        
        // Add date to each match
        matches = matchdayData.matches.map(match => ({
          ...match,
          date: matchdayData.date
        }));
        
        // Load referees from Southern Zone
        const refereesSnapshot = await db.collection('MatchReferees')
          .where('zone', '==', currentZone)
          .get();
        
        referees = [];
        refereesSnapshot.forEach(doc => {
          referees.push({
            id: doc.id,
            ...doc.data()
          });
        });
        
        // Display matches with referee assignment options
        displayMatches();
      } catch (error) {
        console.error("Error loading matches:", error);
        showNotification("Failed to load matches", "error");
      }
    });
    
    // Display matches with referee assignment options
    function displayMatches() {
      if (!matches.length) {
        showLoading("No matches found");
        return;
      }
      
      // Filter referees by role
      const mainReferees = referees.filter(r => r.role === 'main');
      const linesmen = referees.filter(r => r.role === 'lineman');
      const netmen = referees.filter(r => r.role === 'netman');
      
      let html = '';
      
      html += `
        <div class="matchday-card">
          <div class="matchday-header">
            <div class="matchday-title">Matchday ${currentMatchday}</div>
          </div>
          <div class="match-list">
      `;
      
      matches.forEach((match, index) => {
        html += `
          <div class="match-item">
            <div class="team home-team">${match.home}</div>
            <div class="vs">vs</div>
            <div class="team away-team">${match.away}</div>
          </div>
          <div class="commissioner-assignment" data-match-index="${index}">
            <!-- Main Referee -->
            <div class="commissioner-field">
              <label>Main Referee *</label>
              <select class="main-referee-select" required>
                <option value="">-- Select Main Referee --</option>
                ${mainReferees.map(ref => 
                  `<option value="${ref.psn}">${ref.psn} - ${ref.name}</option>`
                ).join('')}
              </select>
            </div>
            
            <!-- Linesmen (2 max) -->
            <div class="commissioner-field">
              <label>Linesman 1 (Optional)</label>
              <select class="linesman1-select">
                <option value="">-- Select Linesman --</option>
                ${linesmen.map(ref => 
                  `<option value="${ref.psn}">${ref.psn} - ${ref.name}</option>`
                ).join('')}
              </select>
            </div>
            
            <div class="commissioner-field">
              <label>Linesman 2 (Optional)</label>
              <select class="linesman2-select">
                <option value="">-- Select Linesman --</option>
                ${linesmen.map(ref => 
                  `<option value="${ref.psn}">${ref.psn} - ${ref.name}</option>`
                ).join('')}
              </select>
            </div>
            
            <!-- Netmen (2 max) -->
            <div class="commissioner-field">
              <label>Netman 1 (Optional)</label>
              <select class="netman1-select">
                <option value="">-- Select Netman --</option>
                ${netmen.map(ref => 
                  `<option value="${ref.psn}">${ref.psn} - ${ref.name}</option>`
                ).join('')}
              </select>
            </div>
            
            <div class="commissioner-field">
              <label>Netman 2 (Optional)</label>
              <select class="netman2-select">
                <option value="">-- Select Netman --</option>
                ${netmen.map(ref => 
                  `<option value="${ref.psn}">${ref.psn} - ${ref.name}</option>`
                ).join('')}
              </select>
            </div>
            
            <button class="save-btn" onclick="saveRefereeAssignment(${index})">
              <i class="fas fa-save"></i> Save Assignment
            </button>
          </div>
        `;
      });
      
      html += `</div></div>`;
      matchesContainer.innerHTML = html;
    }
    
    // Save referee assignment for a match
    async function saveRefereeAssignment(matchIndex) {
      const match = matches[matchIndex];
      const assignmentDiv = document.querySelector(`.commissioner-assignment[data-match-index="${matchIndex}"]`);
      const saveBtn = assignmentDiv.querySelector('.save-btn');
      const mainRefereePsn = assignmentDiv.querySelector('.main-referee-select').value;
      const linesman1Psn = assignmentDiv.querySelector('.linesman1-select').value;
      const linesman2Psn = assignmentDiv.querySelector('.linesman2-select').value;
      const netman1Psn = assignmentDiv.querySelector('.netman1-select').value;
      const netman2Psn = assignmentDiv.querySelector('.netman2-select').value;

      if (!mainRefereePsn) {
        showNotification("Main referee is required", "error");
        return;
      }

      try {
        // UI feedback while saving
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

        // Generate season label
        const seasonStartYear = new Date().getFullYear();
        const seasonEndYear = seasonStartYear + 1;
        const seasonLabel = `Season${seasonStartYear}-${seasonEndYear.toString().slice(-2)}`;
        
        // Determine match ID format
        const matchIdPrefix = currentCompetition === 'championship' ? 'CMatch' : 'LMatch';
        const matchId = `${matchIdPrefix}${currentMatchday.toString().padStart(2, '0')}`;
        const currentTimestamp = new Date().toISOString();

        // Create batch for atomic writes
        const batch = db.batch();

        // 1. Update both team records
        const homeTeamRef = db.collection('GombeSeason').doc(match.home)
          .collection(seasonLabel).doc(matchId);
        
        const awayTeamRef = db.collection('GombeSeason').doc(match.away)
          .collection(seasonLabel).doc(matchId);

        // Prepare referee data
        const refereeData = {
          mainReferee: mainRefereePsn,
          refereeAssigned: true,
          refereeAssignedAt: currentTimestamp
        };

        // Add optional referees if selected
        if (linesman1Psn) refereeData.linesman1 = linesman1Psn;
        if (linesman2Psn) refereeData.linesman2 = linesman2Psn;
        if (netman1Psn) refereeData.netman1 = netman1Psn;
        if (netman2Psn) refereeData.netman2 = netman2Psn;

        batch.update(homeTeamRef, refereeData);
        batch.update(awayTeamRef, refereeData);

        // 2. Create/update referee assignment record
        const refereeRef = db.collection('GombeRefereesAssignments').doc(mainRefereePsn);
        const seasonAssignmentsRef = refereeRef.collection(seasonLabel).doc('assignments');

        const assignmentData = {
          matches: firebase.firestore.FieldValue.arrayUnion({
            matchId: matchId,
            matchType: currentCompetition,
            zone: currentZone,
            homeTeam: match.home,
            awayTeam: match.away,
            date: match.date || new Date().toISOString().split('T')[0],
            assignedAt: currentTimestamp,
            linesmen: [linesman1Psn, linesman2Psn].filter(Boolean),
            netmen: [netman1Psn, netman2Psn].filter(Boolean)
          })
        };

        batch.set(refereeRef, { exists: true }, { merge: true });
        batch.set(seasonAssignmentsRef, assignmentData, { merge: true });

        // Commit all changes
        await batch.commit();

        // Success feedback
        saveBtn.innerHTML = '<i class="fas fa-check"></i> Saved!';
        showNotification("Referee assignment saved successfully!", "success");
        
        // Reset button after delay
        setTimeout(() => {
          saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Assignment';
          saveBtn.disabled = false;
        }, 2000);

      } catch (error) {
        console.error("Detailed save error:", {
          message: error.message,
          code: error.code,
          stack: error.stack
        });
        saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Assignment';
        saveBtn.disabled = false;
        showNotification(`Failed to save: ${error.message}`, "error");
      }
    }
    
    function showLoading(message) {
      loadingElement.innerHTML = `
        <div class="spinner"></div>
        <p>${message}</p>
      `;
      matchesContainer.innerHTML = '';
      matchesContainer.appendChild(loadingElement);
    }
    
    function showNotification(message, type) {
      notification.textContent = message;
      notification.className = `notification ${type}`;
      notification.style.display = 'block';
      
      setTimeout(() => {
        notification.style.display = 'none';
      }, 3000);
    }
  </script>
</body>
</html>
