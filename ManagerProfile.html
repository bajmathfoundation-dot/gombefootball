<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Manager Dashboard | Gombe Football</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #1a2a6c;
            --secondary: #3494e6;
            --accent: #fdbb2d;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --card-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        body {
            background: linear-gradient(135deg, #f0f5ff, #e6f0ff);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Header Styles */
        header {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
        }
        
        .header-content {
            position: relative;
            z-index: 1;
        }
        
        .header-content h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header-content p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
        }
        
        .header-actions {
            display: flex;
            gap: 15px;
            position: relative;
            z-index: 1;
        }
        
        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: white;
            color: var(--primary);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }
        
        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }
        
        .card-header {
            background: linear-gradient(to right, var(--secondary), var(--primary));
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-header h2 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-body {
            padding: 25px;
        }
        
        .team-info {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .team-logo {
            width: 120px;
            height: 120px;
            background: var(--light-gray);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--primary);
            overflow: hidden;
        }
        
        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .team-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .team-details h3 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .detail-item {
            display: flex;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        
        .detail-label {
            font-weight: 600;
            min-width: 120px;
            color: var(--gray);
        }
        
        .detail-value {
            color: var(--dark);
            flex-grow: 1;
        }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        /* Player and Coach Cards */
        .player-card, .coach-card {
            display: flex;
            padding: 15px;
            border-radius: 10px;
            background: var(--light);
            margin-bottom: 0;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
        }
        
        .player-card:hover, .coach-card:hover {
            background: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            transform: translateY(-5px);
        }
        
        .player-avatar, .coach-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            margin-right: 15px;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .player-avatar img, .coach-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .player-info, .coach-info {
            flex-grow: 1;
        }
        
        .player-name, .coach-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary);
        }
        
        .player-position, .coach-role {
            font-size: 0.95rem;
            color: var(--gray);
            margin-bottom: 8px;
        }
        
        .player-stats, .coach-details {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--dark);
        }
        
        .stat-value {
            font-weight: 600;
            color: var(--primary);
        }
        
        /* Team Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--secondary);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 1.1rem;
            color: var(--gray);
        }
        
        /* Trophy Link Styles */
        .trophy-btn {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        /* Stat Card Link Styles */
        .stat-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            width: 100%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);
            animation: modalFadeIn 0.3s ease;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-header {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        
        .modal-player-avatar, .modal-coach-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            overflow: hidden;
        }
        
        .modal-player-avatar img, .modal-coach-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .modal-player-info h3, .modal-coach-info h3 {
            margin: 0;
            color: var(--primary);
            font-size: 1.5rem;
        }
        
        .modal-player-info p, .modal-coach-info p {
            margin: 5px 0 0;
            color: var(--gray);
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--gray);
            cursor: pointer;
            padding: 5px;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .player-basic-info, .coach-basic-info {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .player-basic-info div, .coach-basic-info div {
            margin-bottom: 10px;
        }
        
        .modal-stats-grid {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .modal-stat-card {
            background: var(--light);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        
        .modal-stat-icon {
            font-size: 1.5rem;
            color: var(--secondary);
            margin-bottom: 10px;
        }
        
        .modal-stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }
        
        .modal-stat-label {
            font-size: 0.9rem;
            color: var(--gray);
            text-transform: capitalize;
        }
        
        .player-stats-loading, .empty-stats, .error-stats,
        .coach-qualifications-loading {
            text-align: center;
            padding: 20px;
            color: var(--gray);
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
            
            .header-content {
                text-align: center;
            }
            
            .header-actions {
                width: 100%;
                justify-content: center;
            }
            
            .team-info {
                grid-template-columns: 1fr;
                text-align: center;
            }
            
            .team-logo {
                margin: 0 auto;
            }
            
            .modal-header {
                flex-direction: column;
                text-align: center;
            }
            
            .modal-player-avatar, .modal-coach-avatar {
                margin-right: 0;
                margin-bottom: 15px;
            }
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--light-gray);
        }
        
        .empty-state p {
            font-size: 1.1rem;
        }
		.coach-stats-loading, .empty-stats, .error-stats {
    text-align: center;
    padding: 20px;
    color: var(--gray);
}

.coach-stats-container {
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid #eee;
}

.qualification-item {
    background: var(--light);
    padding: 8px 12px;
    border-radius: 5px;
    margin: 5px 0;
    display: inline-block;
}
  /* Add security notification style */
        .security-notification {
            background: #ff5252;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <h1><i class="fas fa-user-shield"></i> Team Manager Dashboard</h1>
                <p id="welcome-message">Loading your team information...</p>
            </div>
            
            <div class="header-actions">
               <div class="header-actions">
                <button class="btn btn-primary" id="transferMarketBtn">
                    <i class="fas fa-exchange-alt"></i> Transfer Market
                </button>
                <button class="btn btn-primary" id="settingsBtn">
                  <i class="fas fa-cog"></i> Settings
                </button>
                <button class="btn btn-secondary" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>
        
        <!-- Team Stats -->
        <div class="stats-grid" id="statsContainer">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-number" id="playerCount">0</div>
                <div class="stat-label">Players</div>
            </div>
            
            <a href="#" class="stat-card trophy-btn" id="trophyLink">
                <div class="stat-icon"><i class="fas fa-trophy"></i></div>
                <div class="stat-number">View</div>
                <div class="stat-label">Trophies</div>
            </a>
            
            <a href="#" class="stat-card stat-card-link" id="teamManagementLink">
                <div class="stat-icon"><i class="fas fa-users-cog"></i></div>
               <div class="stat-number">Manage</div>
                <div class="stat-label">Players</div>
            </a>
            
            <a href="#" class="stat-card stat-card-link" id="CoachManagementLink">
                <div class="stat-icon"><i class="fas fa-calendar-alt"></i></div>
                 <div class="stat-number">Coach</div>
                <div class="stat-label">Management</div>
            </a>
        </div>
        
        <!-- Dashboard Content -->
        <div class="dashboard-grid">
            <!-- Team Information Card -->
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-shield-alt"></i> Team Information</h2>
                </div>
                <div class="card-body" id="teamInfoContainer">
                    <div class="team-info">
                        <div class="team-logo">
                            <i class="fas fa-futbol"></i>
                        </div>
                        <div class="team-details">
                            <h3 id="teamName">Loading...</h3>
                            <div class="detail-item">
                                <div class="detail-label">Team ID:</div>
                                <div class="detail-value" id="teamIdValue">-</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Division:</div>
                                <div class="detail-value" id="teamDivision">-</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Location:</div>
                                <div class="detail-value" id="teamLocation">-</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Manager:</div>
                                <div class="detail-value" id="teamManager">-</div>
                            </div>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Stadium:</div>
                        <div class="detail-value" id="teamStadium">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wallet:</div>
                        <div class="detail-value" id="teamWallet">-</div>
                    </div>
                </div>
            </div>
            
            <!-- Coaching Staff Card -->
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-clipboard-list"></i> Coaching Staff</h2>
                </div>
                <div class="card-body" id="coachesContainer">
                    <div class="empty-state">
                        <i class="fas fa-user-tie"></i>
                        <p>Loading coaching staff...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Players Section -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-users"></i> Team Players</h2>
            </div>
            <div class="card-body">
                <div class="players-grid" id="playersGrid">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading players...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
            authDomain: "gombefootball.firebaseapp.com",
            projectId: "gombefootball"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // DOM Elements
        const welcomeMessage = document.getElementById('welcome-message');
        const teamName = document.getElementById('teamName');
        const teamIdValue = document.getElementById('teamIdValue');
        const teamDivision = document.getElementById('teamDivision');
        const teamLocation = document.getElementById('teamLocation');
        const teamManager = document.getElementById('teamManager');
        const teamStadium = document.getElementById('teamStadium');
        const teamWallet = document.getElementById('teamWallet');
        const playerCount = document.getElementById('playerCount');
        const goalCount = document.getElementById('goalCount');
        const matchCount = document.getElementById('matchCount');
        const playersGrid = document.getElementById('playersGrid');
        const coachesContainer = document.getElementById('coachesContainer');
        const logoutBtn = document.getElementById('logoutBtn');
        const trophyLink = document.getElementById('trophyLink');
        const teamManagementLink = document.getElementById('teamManagementLink');
        const CoachManagementLink = document.getElementById('CoachManagementLink');
        const settingsBtn = document.getElementById('settingsBtn');
		const transferMarketBtn = document.getElementById('transferMarketBtn');
		
        // Get team ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const currentTeamId = urlParams.get('teamId');
        let currentTeamName = '';
        transferMarketBtn.addEventListener('click', () => {
                window.location.href = `transferMarket.html?teamId=${currentTeamId}`;
            });
            
        // Check if team ID exists
        if (!currentTeamId) {
            welcomeMessage.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Team ID not provided! Redirecting to login...';
            setTimeout(() => {
                window.location.href = 'TeamManagerLogin.html';
            }, 3000);
        } else {
            // Set all links immediately with the teamId
            trophyLink.href = `trophyView.html?teamId=${currentTeamId}`;
            teamManagementLink.href = `teamManagement.html?teamId=${currentTeamId}`;
            CoachManagementLink.href = `CoachManagement.html?teamId=${currentTeamId}`;
            if (currentTeamId) {
    settingsBtn.addEventListener('click', () => {
        window.location.href = `TeamSettings.html?teamId=${currentTeamId}`;
    });
} else {
    settingsBtn.addEventListener('click', () => {
        alert('Team ID not available. Please try again.');
    });
}
            // Fetch team data
            function fetchTeamData() {
                welcomeMessage.innerHTML = `<span class="spinner"></span> Loading team information...`;
                
                db.collection("GombeTeams").doc(currentTeamId).get()
                    .then(doc => {
                        if (!doc.exists) {
                            throw new Error("Team not found!");
                        }
                        
                        const teamData = doc.data();
                        // Try multiple possible name fields
                        currentTeamName = teamData.teamName || teamData.name || teamData.team || "";
                        
                        // Display basic team info
                        displayTeamInfo(teamData);
                        
                        // Fetch related data - use team ID as primary reference
                        return Promise.all([
                            fetchPlayers(currentTeamId, currentTeamName),
                            fetchCoaches(currentTeamId, currentTeamName)
                        ]);
                    })
                    .catch(error => {
                        console.error("Error loading team:", error);
                        welcomeMessage.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message || "Error loading team"}`;
                    });
            }
            
            // Display team information
            function displayTeamInfo(teamData) {
                teamName.textContent = teamData.teamName || teamData.name || "N/A";
                teamIdValue.textContent = currentTeamId;
                teamDivision.textContent = teamData.division || teamData.tier || "N/A";
                teamLocation.textContent = teamData.Location || teamData.Location || "N/A";
                teamManager.textContent = teamData.managerName || teamData.manager || "N/A";
                teamStadium.textContent = teamData.Stadium|| teamData.Stadium ||"N/A";
                teamWallet.textContent = teamData.walletName || teamData.wallet || "N/A";
                
                welcomeMessage.textContent = `Welcome, ${teamData.managerName || teamData.manager || "Manager"}!`;
                
                // Update stats 
                playerCount.textContent = teamData.playerCount || "0";
            }
            
            // Enhanced player fetching with multiple query attempts
            function fetchPlayers(teamId, teamName) {
                playersGrid.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading players...</p></div>';

                // First try querying by team ID if available
                const queryByTeamId = db.collection("playerRegistry")
                    .where("teamId", "==", teamId)
                    .get();

                return queryByTeamId.then(querySnapshot => {
                    if (!querySnapshot.empty) {
                        return processPlayers(querySnapshot);
                    }

                    // If no results by ID, try by name if available
                    if (teamName) {
                        return db.collection("playerRegistry")
                            .where("teamName", "==", teamName)
                            .get()
                            .then(nameQuerySnapshot => {
                                if (!nameQuerySnapshot.empty) {
                                    return processPlayers(nameQuerySnapshot);
                                }
                                throw new Error("No players found");
                            });
                    }
                    throw new Error("No team identifier available");
                })
                .catch(error => {
                    console.error("Error fetching players:", error);
                    playersGrid.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><p>No players found</p></div>';
                    playerCount.textContent = "0";
                });
            }

            function processPlayers(querySnapshot) {
                playersGrid.innerHTML = "";
                playerCount.textContent = querySnapshot.size.toString();

                querySnapshot.forEach(doc => {
                    const player = doc.data();
                    createPlayerCard(player, doc.id);
                });
            }
