<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Login | Gombe Football Association</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #1a2a6c, #3494e6);
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      width: 100%;
      max-width: 900px;
      display: flex;
    }
    
    .banner {
      background: linear-gradient(to right, #1a2a6c, #3494e6);
      color: white;
      padding: 40px;
      width: 40%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    .banner::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><circle cx="20" cy="20" r="8" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/><circle cx="80" cy="80" r="12" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/><circle cx="50" cy="50" r="15" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/></svg>');
      background-size: 150px;
      opacity: 0.3;
    }
    
    .banner-content {
      text-align: center;
      position: relative;
      z-index: 1;
    }
    
    .banner i {
      font-size: 4rem;
      margin-bottom: 20px;
      color: #fdbb2d;
    }
    
    .banner h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
    }
    
    .banner p {
      font-size: 1rem;
      opacity: 0.9;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    
    .form-container {
      padding: 40px;
      width: 60%;
    }
    
    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .form-header h2 {
      color: #1a2a6c;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    
    .form-header p {
      color: #666;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #444;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    
    .form-control:focus {
      border-color: #3494e6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(52, 148, 230, 0.2);
    }
    
    .btn {
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(to right, #1a2a6c, #3494e6);
      color: white;
      width: 100%;
    }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }
    
    .btn:active {
      transform: translateY(1px);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .status {
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.5s ease-in;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    
    .status.warning {
      background: #fff3cd;
      color: #856404;
    }
    
    .status.info {
      background: #cce5ff;
      color: #004085;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .password-container {
      position: relative;
    }
    
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 38px;
      cursor: pointer;
      color: #666;
    }
    
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .forgot-password {
      color: #1a2a6c;
      text-decoration: none;
      font-weight: 600;
    }
    
    .forgot-password:hover {
      text-decoration: underline;
    }
    
    .register-link {
      text-align: center;
      margin-top: 20px;
    }
    
    .register-link a {
      color: #1a2a6c;
      text-decoration: none;
      font-weight: 600;
    }
    
    .register-link a:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      
      .banner, .form-container {
        width: 100%;
      }
      
      .banner {
        padding: 30px 20px;
      }
      
      .form-container {
        padding: 30px 20px;
      }
      
      .login-options {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="banner">
      <div class="banner-content">
        <i class="fas fa-futbol"></i>
        <h1>Gombe Football Association</h1>
        <p>Player Login Portal</p>
        <p>Access your player profile to view your stats, contracts, and performance data.</p>
        <p>Stay updated with your football career progression.</p>
      </div>
    </div>
    
    <div class="form-container">
      <div class="form-header">
        <h2>Player Login</h2>
        <p>Enter your credentials to access your profile</p>
      </div>
      
      <div id="status" class="status" style="display: none;"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="your.email@example.com" autocomplete="email" required>
        </div>
        
        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <div class="password-container">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
            <span class="toggle-password" id="togglePassword">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>
        
        <div class="login-options">
          <div class="remember-me">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember me</label>
          </div>
          <a href="ForgotPassword.html" class="forgot-password">Forgot Password?</a>
        </div>
        
        <button type="submit" id="loginBtn" class="btn btn-primary">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>
      
      <div class="register-link">
        <p>Don't have an account? <a href="PlayerAcesss.html">Register here</a></p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
      authDomain: "gombefootball.firebaseapp.com",
      projectId: "gombefootball"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    // DOM Elements
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const rememberMe = document.getElementById('rememberMe');
    const loginBtn = document.getElementById('loginBtn');
    const statusBox = document.getElementById('status');
    
    // Check if there are saved credentials
    window.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem('playerEmail');
      const savedRememberMe = localStorage.getItem('playerRememberMe');
      
      if (savedEmail && savedRememberMe === 'true') {
        emailInput.value = savedEmail;
        rememberMe.checked = true;
      }
    });
    
    // Handle login form submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const shouldRemember = rememberMe.checked;
      
      if (!email || !password) {
        showStatus('⛔ Please enter both email and password', 'error');
        return;
      }
      
      // Validate email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showStatus('📧 Please enter a valid email address', 'error');
        return;
      }
      
      // Show loading state
      showStatus('<i class="fas fa-spinner fa-spin"></i> Signing in...', 'info');
      loginBtn.disabled = true;
      
      try {
        // Attempt to sign in with Firebase Auth first
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Check if email is verified
        if (!user.emailVerified) {
          await auth.signOut();
          showStatus('📧 Please verify your email address before logging in. Check your inbox for the verification link.', 'warning');
          loginBtn.disabled = false;
          return;
        }
        
        // CRITICAL FIX: Verify user exists in playerRegistry collection
        const playersRef = db.collection("playerRegistry");
        const playerQuery = await playersRef.where("userId", "==", user.uid).get();
        
        if (playerQuery.empty) {
          await auth.signOut();
          showStatus('❌ No player account found. Please use the agent portal or register as a player.', 'error');
          loginBtn.disabled = false;
          return;
        }
        
        // Check if player account is active
        const playerDoc = playerQuery.docs[0];
        const playerData = playerDoc.data();
        
        if (playerData.accountStatus === "Inactive" || playerData.accountStatus === "Suspended") {
          await auth.signOut();
          showStatus('🔒 Your account is not active. Please contact administrator.', 'error');
          loginBtn.disabled = false;
          return;
        }
        
        // Update last login time in playerRegistry
        await playersRef.doc(playerDoc.id).update({
          lastLogin: new Date().toISOString(),
          loginAttempts: 0
        });
        
        // Save credentials if "Remember me" is checked
        if (shouldRemember) {
          localStorage.setItem('playerEmail', email);
          localStorage.setItem('playerRememberMe', 'true');
        } else {
          localStorage.removeItem('playerEmail');
          localStorage.removeItem('playerRememberMe');
        }
        
        showStatus('✅ Login successful! Redirecting to your profile...', 'success');
        
        // Redirect to player profile after successful login
        setTimeout(() => {
          window.location.href = "PlayerProfile.html";
        }, 2000);
        
      } catch (error) {
        console.error("Login error:", error);
        
        // Handle specific error cases
        if (error.code === 'auth/user-not-found') {
          showStatus('❌ No account found with this email address', 'error');
        } else if (error.code === 'auth/wrong-password') {
          showStatus('❌ Incorrect password. Please try again.', 'error');
        } else if (error.code === 'auth/too-many-requests') {
          showStatus('🔒 Too many failed login attempts. Please try again later or reset your password.', 'error');
        } else {
          showStatus(`❌ Error: ${error.message}`, 'error');
        }
        
        loginBtn.disabled = false;
      }
    });
    
    // Toggle password visibility
    togglePassword.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });
    
    // Helper function to show status messages
    function showStatus(message, type) {
      if (!message) {
        statusBox.style.display = 'none';
        return;
      }
      
      statusBox.style.display = 'flex';
      statusBox.innerHTML = message;
      statusBox.className = 'status';
      
      if (type) {
        statusBox.classList.add(type);
      }
    }
  </script>
</body>
</html>
