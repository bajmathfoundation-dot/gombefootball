<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gombe Football Teams Directory</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1a2a6c;
      --secondary: #b21f1f;
      --accent: #ffcc00;
      --light: #f8f9fa;
      --dark: #212529;
      --gray: #6c757d;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #f0f2f5, #e6e9ef);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    .header-banner {
      background: linear-gradient(to right, var(--primary), var(--secondary));
      color: white;
      padding: 1.5em 0;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    
    .header-banner::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0 L100,100 L0,100 Z" fill="rgba(255,255,255,0.1)"/></svg>');
      background-size: cover;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }
    
    .logo {
      display: inline-block;
      background: white;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      border: 3px solid var(--accent);
    }
    
    .logo i {
      font-size: 3rem;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header-banner h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
    
    .header-banner p {
      font-size: 1.2rem;
      max-width: 700px;
      margin: 0 auto;
      opacity: 0.9;
    }
    
    .search-container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }
    
    .search-box {
      display: flex;
      align-items: center;
      background: var(--light);
      border-radius: 50px;
      padding: 5px 20px;
    }
    
    .search-box i {
      color: var(--gray);
      font-size: 1.2rem;
    }
    
    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 15px;
      font-size: 1.1rem;
      background: transparent;
    }
    
    .teams-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }
    
    .team-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    
    .team-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }
    
    .team-header {
      background: linear-gradient(to right, var(--primary), var(--secondary));
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .team-header i {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: var(--accent);
    }
    
    .team-header h3 {
      font-size: 1.4rem;
      margin-bottom: 5px;
    }
    
    .team-body {
      padding: 20px;
    }
    
    .team-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    
    .info-label {
      font-weight: 600;
      color: var(--gray);
    }
    
    .info-value {
      color: var(--dark);
      font-weight: 500;
    }
    
    .btn-view {
      display: block;
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-top: 15px;
    }
    
    .btn-view:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(26, 42, 108, 0.3);
    }
    
    footer {
      text-align: center;
      padding: 20px;
      color: var(--dark);
      font-size: 1.1rem;
      margin-top: 30px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--gray);
    }
    
    .loading i {
      font-size: 2rem;
      margin-bottom: 15px;
      color: var(--primary);
    }
    
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
    }
    
    @media (max-width: 768px) {
      .teams-container {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      
      .header-banner h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="header-banner">
    <div class="container">
      <div class="logo">
        <i class="fas fa-futbol"></i>
      </div>
      <h1>Gombe Football Teams Directory</h1>
      <p>Browse all registered teams in Gombe State Football Association</p>
    </div>
  </div>
  
  <div class="container">
    <div class="search-container">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="filterInput" placeholder="Search for a team by name..." oninput="filterTeams()">
      </div>
    </div>
    
    <div class="teams-container" id="teamsContainer">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading teams...</p>
      </div>
    </div>
  </div>
  
  <footer>
    <p> BAJMATH solutions &copy; 2025 Gombe State Football Association | Developed with <i class="fas fa-heart" style="color:var(--secondary)"></i> for Gombe State Football</p>
  </footer>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  
  <script>
    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
      authDomain: "gombefootball.firebaseapp.com",
      databaseURL: "https://gombefootball-default-rtdb.firebaseio.com",
      projectId: "gombefootball",
      storageBucket: "gombefootball.firebasestorage.app",
      messagingSenderId: "120731655706",
      appId: "1:120731655706:web:9c99d6831aca3df563bba3",
      measurementId: "G-8SCVPBSKPG"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allTeams = []; // Will store {id, name, ...} objects

    async function loadTeams() {
      try {
        const teamsContainer = document.getElementById('teamsContainer');
        teamsContainer.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading teams...</p></div>';
        
        const snapshot = await db.collection("GombeTeams").get();
        allTeams = [];
        
        if (snapshot.empty) {
          teamsContainer.innerHTML = '<div class="error">No teams found</div>';
          return;
        }

        teamsContainer.innerHTML = '';
        snapshot.forEach(doc => {
          const teamData = doc.data();
          const team = {
            id: doc.id,
            name: teamData.name || 'Unknown Team',
            lga: teamData.lga || 'Unknown LGA',
            tier: teamData.tier || 'N/A',
            year: teamData.year || 'N/A'
          };
          allTeams.push(team);
          
          const teamCard = document.createElement('div');
          teamCard.className = 'team-card';
          teamCard.innerHTML = `
            <div class="team-header">
              <i class="fas fa-users"></i>
              <h3>${team.name}</h3>
            </div>
            <div class="team-body">
              <div class="team-info">
                <span class="info-label">LGA:</span>
                <span class="info-value">${team.lga}</span>
              </div>
              <div class="team-info">
                <span class="info-label">Tier:</span>
                <span class="info-value">${team.tier}</span>
              </div>
              <div class="team-info">
                <span class="info-label">Founded:</span>
                <span class="info-value">${team.year}</span>
              </div>
              <a href="GombeTeamsProfileFinal.html?teamId=${team.id}" class="btn-view">
                View Team Profile <i class="fas fa-arrow-right"></i>
              </a>
            </div>
          `;
          teamsContainer.appendChild(teamCard);
        });

      } catch (error) {
        console.error("Error loading teams:", error);
        document.getElementById('teamsContainer').innerHTML = 
          '<div class="error">Error loading teams. Please try again later.</div>';
      }
    }

    function filterTeams() {
      const query = document.getElementById('filterInput').value.toLowerCase();
      const teamCards = document.querySelectorAll('.team-card');
      
      if (!query) {
        teamCards.forEach(card => card.style.display = 'block');
        return;
      }
      
      teamCards.forEach(card => {
        const teamName = card.querySelector('h3').textContent.toLowerCase();
        if (teamName.includes(query)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // Load teams when page loads
    document.addEventListener('DOMContentLoaded', loadTeams);
  </script>
</body>
</html>
