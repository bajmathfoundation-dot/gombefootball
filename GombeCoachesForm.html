<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coach Registration | Gombe Football</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #014421;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 1.8em;
    }
    form {
      background: white;
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #014421;
      color: white;
      padding: 12px 18px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #02743a;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>Register a New Coach</header>
  <form id="coachForm">
    <label for="name">Coach Name</label>
    <input type="text" id="name" required />

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" required placeholder="+234..." />

    <label for="teamName">Assign to Team</label>
    <select id="teamName" required>
      <option value="">-- Loading Teams --</option>
    </select>

    <label for="image">Coach Photo (future-ready)</label>
    <input type="file" id="image" accept="image/*" />

    <label for="bio">Short Bio</label>
    <input type="text" id="bio" placeholder="e.g. Former player now tactical expert" />

    <button type="submit">Register Coach</button>
  </form>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
      authDomain: "gombefootball.firebaseapp.com",
      projectId: "gombefootball"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const teamDropdown = document.getElementById("teamName");

    // Load team list
    db.collection("leaguezones").get().then(snapshot => {
      let teams = [];
      snapshot.forEach(doc => {
        const arr = doc.data().teams;
        if (Array.isArray(arr)) teams.push(...arr);
      });
      teams.sort();
      teamDropdown.innerHTML = '<option value="">-- Select Team --</option>';
      teams.forEach(team => {
        const opt = document.createElement("option");
        opt.value = team;
        opt.textContent = team;
        teamDropdown.appendChild(opt);
      });
    });

    document.getElementById("coachForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const teamName = document.getElementById("teamName").value;
      const bio = document.getElementById("bio").value;
      const image = document.getElementById("image").files[0];

      // Prevent duplicate team assignment
      const assigned = await db.collection("GombeCoaches")
        .where("teamName", "==", teamName).get();

      if (!assigned.empty) {
        alert(`⚠️ ${teamName} already has a coach.`);
        return;
      }

      const counterRef = db.collection("counters").doc("coachPSN");

      try {
        await db.runTransaction(async tx => {
          const counterDoc = await tx.get(counterRef);
          const latest = counterDoc.exists ? counterDoc.data().latest || 0 : 0;
          const next = latest + 1;
          const psn = next.toString().padStart(3, "0");  // e.g. "001"
          const teamID = `${psn}_${teamName}`;

          const coachData = {
            name,
            phone,
            teamName,
            teamID,
            assigned: true,
            bio,
            imageUrl: "https://via.placeholder.com/150?text=Coach"
          };

          // 🔧 Future enhancement: upload image and replace imageUrl

          tx.set(db.collection("GombeCoaches").doc(psn), coachData);
          tx.set(counterRef, { latest: next }, { merge: true });

          alert(`✅ Coach ${name} registered with ID: ${psn}`);
          document.getElementById("coachForm").reset();
        });
      } catch (err) {
        console.error("❌ Error registering coach:", err);
        alert("Something went wrong. Please check the console.");
      }
    });
  </script>
</body>
</html>
