<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Settings | Gombe Football</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #1a2a6c;
            --secondary: #3494e6;
            --accent: #fdbb2d;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --card-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        body {
            background: linear-gradient(135deg, #f0f5ff, #e6f0ff);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: var(--primary);
            font-size: 1.2rem;
        }
        
        .user-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .welcome-text {
            color: var(--gray);
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-secondary {
            background-color: var(--secondary);
            color: white;
        }
        
        .btn-danger {
            background-color: var(--danger);
            color: white;
        }
        
        .btn-success {
            background-color: var(--success);
            color: white;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .card-header {
            background: linear-gradient(to right, var(--secondary), var(--primary));
            color: white;
            padding: 20px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-body {
            padding: 25px;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }
        
        .setting-section {
            padding-bottom: 25px;
            border-bottom: 1px solid var(--light-gray);
        }
        
        .setting-section:last-child {
            border-bottom: none;
        }
        
        .section-title {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .avatar-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .avatar-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--light-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 4px solid var(--primary);
            font-size: 3rem;
            color: var(--primary);
        }
        
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .avatar-actions {
            display: flex;
            gap: 15px;
        }
        
        .file-input {
            display: none;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .gallery-item {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }
        
        .gallery-item:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .gallery-item.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--secondary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 148, 230, 0.2);
        }
        
        .password-container {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
            color: var(--gray);
        }
        
        .password-strength {
            height: 5px;
            background: var(--light-gray);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
            position: relative;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .password-strength-text {
            font-size: 0.8rem;
            margin-top: 5px;
            color: var(--gray);
        }
        
        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 20px;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-message.info {
            background: #cce5ff;
            color: #004085;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        
        .spinner {
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .header-bar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .user-actions {
                flex-direction: column;
                width: 100%;
            }
            
            .user-actions .btn {
                width: 100%;
                justify-content: center;
            }
            
            .avatar-actions {
                flex-direction: column;
                width: 100%;
            }
            
            .avatar-actions .btn {
                width: 100%;
                justify-content: center;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
            
            .gallery-item {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with navigation -->
        <div class="header-bar">
            <div class="logo">
                <i class="fas fa-futbol"></i>
                <span>Gombe Football Association</span>
            </div>
            <div class="user-actions">
                <button class="btn btn-secondary" onclick="window.location.href='PlayerProfile.html'">
                    <i class="fas fa-arrow-left"></i> Back to Profile
                </button>
                <button class="btn btn-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
        
        <!-- Status message area -->
        <div id="statusMessage" class="status-message" style="display: none;"></div>
        
        <!-- Settings Content -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-cog"></i> Player Settings
            </div>
            <div class="card-body">
                <div class="settings-grid">
                    <!-- Profile Image Section -->
                    <div class="setting-section">
                        <h3 class="section-title">
                            <i class="fas fa-user-circle"></i> Profile Image
                        </h3>
                        <div class="avatar-upload">
                            <div class="avatar-preview" id="avatarPreview">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="avatar-actions">
                                <button class="btn btn-primary" id="uploadBtn">
                                    <i class="fas fa-upload"></i> Upload Image
                                </button>
                                <input type="file" id="fileInput" class="file-input" accept="image/*">
                                <button class="btn btn-secondary" id="chooseFromGalleryBtn">
                                    <i class="fas fa-images"></i> Choose from Gallery
                                </button>
                            </div>
                        </div>
                        
                        <!-- Image Gallery -->
                        <div id="imageGallery" style="display: none; margin-top: 30px;">
                            <h4 style="margin-bottom: 15px;">Select from available images:</h4>
                            <div class="gallery-grid" id="galleryGrid">
                                <!-- Gallery items will be populated by JavaScript -->
                            </div>
                            <div class="action-buttons">
                                <button class="btn btn-primary" id="confirmImageBtn" disabled>
                                    <i class="fas fa-check"></i> Confirm Selection
                                </button>
                                <button class="btn btn-secondary" id="cancelGalleryBtn">
                                    <i class="fas fa-times"></i> Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Change Password Section -->
                    <div class="setting-section">
                        <h3 class="section-title">
                            <i class="fas fa-lock"></i> Change Password
                        </h3>
                        <form id="passwordForm">
                            <div class="form-group">
                                <label for="currentPassword">
                                    <i class="fas fa-key"></i> Current Password
                                </label>
                                <div class="password-container">
                                    <input type="password" id="currentPassword" class="form-control" 
                                           placeholder="Enter your current password" required>
                                    <span class="toggle-password" id="toggleCurrentPassword">
                                        <i class="fas fa-eye"></i>
                                    </span>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="newPassword">
                                    <i class="fas fa-lock"></i> New Password
                                </label>
                                <div class="password-container">
                                    <input type="password" id="newPassword" class="form-control" 
                                           placeholder="Enter your new password" required>
                                    <span class="toggle-password" id="toggleNewPassword">
                                        <i class="fas fa-eye"></i>
                                    </span>
                                </div>
                                <div class="password-strength">
                                    <div class="password-strength-bar" id="passwordStrengthBar"></div>
                                </div>
                                <div class="password-strength-text" id="passwordStrengthText">
                                    Password strength
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="confirmPassword">
                                    <i class="fas fa-lock"></i> Confirm New Password
                                </label>
                                <div class="password-container">
                                    <input type="password" id="confirmPassword" class="form-control" 
                                           placeholder="Confirm your new password" required>
                                    <span class="toggle-password" id="toggleConfirmPassword">
                                        <i class="fas fa-eye"></i>
                                    </span>
                                </div>
                                <div id="passwordMatchText" class="password-strength-text"></div>
                            </div>
                            
                            <div class="action-buttons">
                                <button type="submit" class="btn btn-success" id="changePasswordBtn">
                                    <i class="fas fa-save"></i> Change Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-storage-compat.js"></script>
    
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
            authDomain: "gombefootball.firebaseapp.com",
            projectId: "gombefootball",
            storageBucket: "gombefootball.appspot.com"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();
        
        // DOM Elements
        const logoutBtn = document.getElementById('logoutBtn');
        const statusMessage = document.getElementById('statusMessage');
        const avatarPreview = document.getElementById('avatarPreview');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const chooseFromGalleryBtn = document.getElementById('chooseFromGalleryBtn');
        const imageGallery = document.getElementById('imageGallery');
        const galleryGrid = document.getElementById('galleryGrid');
        const confirmImageBtn = document.getElementById('confirmImageBtn');
        const cancelGalleryBtn = document.getElementById('cancelGalleryBtn');
        const passwordForm = document.getElementById('passwordForm');
        const currentPasswordInput = document.getElementById('currentPassword');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const toggleCurrentPassword = document.getElementById('toggleCurrentPassword');
        const toggleNewPassword = document.getElementById('toggleNewPassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const passwordStrengthBar = document.getElementById('passwordStrengthBar');
        const passwordStrengthText = document.getElementById('passwordStrengthText');
        const passwordMatchText = document.getElementById('passwordMatchText');
        const changePasswordBtn = document.getElementById('changePasswordBtn');
        
        let currentPlayerId = null;
        let currentPlayerData = null;
        let selectedImageUrl = null;
        
        // Check authentication state
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // User is signed in
                await findPlayerByUserId(user.uid);
            } else {
                // No user is signed in, redirect to login
                showStatus('You need to be logged in to access this page. Redirecting to login...', 'error');
                setTimeout(() => {
                    window.location.href = 'PlayerLogin.html';
                }, 2000);
            }
        });
        
        // Find player document by user ID
        async function findPlayerByUserId(userId) {
            showStatus('Loading your player profile...', 'info');
            
            try {
                // Query playerRegistry for the user's ID
                const playersRef = db.collection("playerRegistry");
                const querySnapshot = await playersRef.where("userId", "==", userId).get();
                
                if (querySnapshot.empty) {
                    showStatus('No player profile found for your account. Please contact administrator.', 'error');
                    return;
                }
                
                // Get the first matching document (should only be one)
                const playerDoc = querySnapshot.docs[0];
                currentPlayerId = playerDoc.id;
                currentPlayerData = playerDoc.data();
                
                // Load player data
                loadPlayerData();
                
                // Set up event listeners
                setupEventListeners();
                
                // Clear status message
                hideStatus();
                
            } catch (error) {
                console.error("Error finding player:", error);
                showStatus(`Error loading profile: ${error.message}`, 'error');
            }
        }
        
        function loadPlayerData() {
            // Set current profile image if available
            if (currentPlayerData.imageUrl) {
                avatarPreview.innerHTML = `<img src="${currentPlayerData.imageUrl}" alt="Profile Image">`;
            }
        }
        
        function setupEventListeners() {
            // Logout button
            logoutBtn.addEventListener('click', async () => {
                try {
                    await auth.signOut();
                    showStatus('Logging out...', 'info');
                    setTimeout(() => {
                        window.location.href = 'PlayerLogin.html';
                    }, 1000);
                } catch (error) {
                    console.error("Error signing out:", error);
                    showStatus(`Error signing out: ${error.message}`, 'error');
                }
            });
            
            // Upload image button
            uploadBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            // File input change
            fileInput.addEventListener('change', handleImageUpload);
            
            // Choose from gallery button
            chooseFromGalleryBtn.addEventListener('click', showImageGallery);
            
            // Confirm image selection
            confirmImageBtn.addEventListener('click', confirmImageSelection);
            
            // Cancel gallery view
            cancelGalleryBtn.addEventListener('click', () => {
                imageGallery.style.display = 'none';
            });
            
            // Password form submission
            passwordForm.addEventListener('submit', handlePasswordChange);
            
            // Toggle password visibility
            toggleCurrentPassword.addEventListener('click', () => {
                togglePasswordVisibility(currentPasswordInput, toggleCurrentPassword);
            });
            
            toggleNewPassword.addEventListener('click', () => {
                togglePasswordVisibility(newPasswordInput, toggleNewPassword);
            });
            
            toggleConfirmPassword.addEventListener('click', () => {
                togglePasswordVisibility(confirmPasswordInput, toggleConfirmPassword);
            });
            
            // Password strength indicator
            newPasswordInput.addEventListener('input', checkPasswordStrength);
            
            // Confirm password match
            confirmPasswordInput.addEventListener('input', checkPasswordMatch);
        }
        
        function togglePasswordVisibility(input, toggle) {
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            toggle.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        }
        
        async function showImageGallery() {
            showStatus('Loading image gallery...', 'info');
            
            try {
                // In a real application, you would fetch these from a storage location
                // For this example, we'll use a set of placeholder football images
                const sampleImages = [
                    'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=150&h=150&fit=crop&crop=face',
                    'https://images.unsplash.com/photo-1550599112-0c21a831f6b9?w=150&h=150&fit=crop&crop=face',
                    'https://images.unsplash.com/photo-1560272564-c83b66b1ad12?w=150&h=150&fit=crop&crop=face',
                    'https://images.unsplash.com/photo-1616628188845-6c087a0c322c?w=150&h=150&fit=crop&crop=face',
                    'https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=150&h=150&fit=crop&crop=face',
                    'https://images.unsplash.com/photo-1629909613654-28e377c37b09?w=150&h=150&fit=crop&crop=face'
                ];
                
                galleryGrid.innerHTML = '';
                
                sampleImages.forEach((imgUrl, index) => {
                    const galleryItem = document.createElement('div');
                    galleryItem.className = 'gallery-item';
                    galleryItem.dataset.imgUrl = imgUrl;
                    galleryItem.innerHTML = `<img src="${imgUrl}" alt="Gallery image ${index + 1}">`;
                    
                    galleryItem.addEventListener('click', () => {
                        // Remove selected class from all items
                        document.querySelectorAll('.gallery-item').forEach(item => {
                            item.classList.remove('selected');
                        });
                        
                        // Add selected class to clicked item
                        galleryItem.classList.add('selected');
                        selectedImageUrl = imgUrl;
                        confirmImageBtn.disabled = false;
                    });
                    
                    galleryGrid.appendChild(galleryItem);
                });
                
                imageGallery.style.display = 'block';
                hideStatus();
                
            } catch (error) {
                console.error("Error loading gallery:", error);
                showStatus(`Error loading image gallery: ${error.message}`, 'error');
            }
        }
        
        async function confirmImageSelection() {
            if (!selectedImageUrl) {
                showStatus('Please select an image from the gallery', 'error');
                return;
            }
            
            showStatus('Updating your profile image...', 'info');
            
            try {
                // Update the player document with the new image URL
                await db.collection("playerRegistry").doc(currentPlayerId).update({
                    imageUrl: selectedImageUrl,
                    lastUpdated: new Date().toISOString()
                });
                
                // Update the preview
                avatarPreview.innerHTML = `<img src="${selectedImageUrl}" alt="Profile Image">`;
                
                // Hide the gallery
                imageGallery.style.display = 'none';
                selectedImageUrl = null;
                confirmImageBtn.disabled = true;
                
                showStatus('Profile image updated successfully!', 'success');
                
            } catch (error) {
                console.error("Error updating profile image:", error);
                showStatus(`Error updating profile image: ${error.message}`, 'error');
            }
        }
        
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Check if the file is an image
            if (!file.type.match('image.*')) {
                showStatus('Please select an image file', 'error');
                return;
            }
            
            // Check file size (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showStatus('Image must be less than 5MB', 'error');
                return;
            }
            
            showStatus('Uploading your image...', 'info');
            
            try {
                // Create a reference to the storage location
                const storageRef = storage.ref();
                const imageRef = storageRef.child(`player_images/${currentPlayerId}/${file.name}`);
                
                // Upload the file
                const snapshot = await imageRef.put(file);
                
                // Get the download URL
                const downloadURL = await snapshot.ref.getDownloadURL();
                
                // Update the player document with the new image URL
                await db.collection("playerRegistry").doc(currentPlayerId).update({
                    imageUrl: downloadURL,
                    lastUpdated: new Date().toISOString()
                });
                
                // Update the preview
                avatarPreview.innerHTML = `<img src="${downloadURL}" alt="Profile Image">`;
                
                showStatus('Profile image updated successfully!', 'success');
                
            } catch (error) {
                console.error("Error uploading image:", error);
                showStatus(`Error uploading image: ${error.message}`, 'error');
            }
        }
        
        async function handlePasswordChange(event) {
            event.preventDefault();
            
            const currentPassword = currentPasswordInput.value;
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            // Validate form
            if (!currentPassword || !newPassword || !confirmPassword) {
                showStatus('Please fill in all password fields', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showStatus('New passwords do not match', 'error');
                return;
            }
            
            if (newPassword.length < 8) {
                showStatus('New password must be at least 8 characters long', 'error');
                return;
            }
            
            showStatus('Changing your password...', 'info');
            changePasswordBtn.disabled = true;
            
            try {
                const user = auth.currentUser;
                const email = user.email;
                
                // Reauthenticate user
                const credential = firebase.auth.EmailAuthProvider.credential(email, currentPassword);
                await user.reauthenticateWithCredential(credential);
                
                // Update password
                await user.updatePassword(newPassword);
                
                // Clear form
                passwordForm.reset();
                passwordStrengthBar.style.width = '0%';
                passwordStrengthText.textContent = 'Password strength';
                passwordMatchText.textContent = '';
                
                showStatus('Password changed successfully!', 'success');
                
            } catch (error) {
                console.error("Error changing password:", error);
                
                if (error.code === 'auth/wrong-password') {
                    showStatus('Current password is incorrect', 'error');
                } else if (error.code === 'auth/weak-password') {
                    showStatus('New password is too weak', 'error');
                } else {
                    showStatus(`Error changing password: ${error.message}`, 'error');
                }
            } finally {
                changePasswordBtn.disabled = false;
            }
        }
        
        function checkPasswordStrength() {
            const password = newPasswordInput.value;
            let strength = 0;
            let message = '';
            let color = '';
            
            if (password.length === 0) {
                strength = 0;
                message = 'Password strength';
                color = '#e74c3c';
            } else if (password.length < 8) {
                strength = 25;
                message = 'Too short';
                color = '#e74c3c';
            } else {
                // Check for character variety
                if (/[a-z]/.test(password)) strength += 20;
                if (/[A-Z]/.test(password)) strength += 20;
                if (/[0-9]/.test(password)) strength += 20;
                if (/[^a-zA-Z0-9]/.test(password)) strength += 20;
                
                // Additional checks
                if (password.length > 12) strength += 10;
                
                // Determine message and color based on strength
                if (strength < 50) {
                    message = 'Weak';
                    color = '#e74c3c';
                } else if (strength < 80) {
                    message = 'Medium';
                    color = '#f39c12';
                } else {
                    message = 'Strong';
                    color = '#27ae60';
                }
            }
            
            // Update the strength bar and text
            passwordStrengthBar.style.width = strength + '%';
            passwordStrengthBar.style.backgroundColor = color;
            passwordStrengthText.textContent = message;
            passwordStrengthText.style.color = color;
        }
        
        function checkPasswordMatch() {
            const password = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (confirmPassword.length === 0) {
                passwordMatchText.textContent = '';
            } else if (password === confirmPassword) {
                passwordMatchText.textContent = 'Passwords match';
                passwordMatchText.style.color = '#27ae60';
            } else {
                passwordMatchText.textContent = 'Passwords do not match';
                passwordMatchText.style.color = '#e74c3c';
            }
        }
        
        // Helper functions for status messages
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            statusMessage.style.display = 'flex';
        }
        
        function hideStatus() {
            statusMessage.style.display = 'none';
        }
    </script>
</body>
</html>
