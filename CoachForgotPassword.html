<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Gombe Football</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #1a2a6c;
            --secondary: #3494e6;
            --accent: #fdbb2d;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .password-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            position: relative;
        }
        
        .password-header {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .password-header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
        }
        
        .password-header-content {
            position: relative;
            z-index: 1;
        }
        
        .password-header h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .password-header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 350px;
            margin: 0 auto;
        }
        
        .password-body {
            padding: 40px 30px;
        }
        
        .password-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .form-group {
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-control {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            background: var(--light);
        }
        
        .form-control:focus {
            border-color: var(--secondary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(52, 148, 230, 0.15);
        }
        
        .btn {
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--secondary);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .status {
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.5s ease-in;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid var(--success);
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid var(--danger);
        }
        
        .status.info {
            background: #cce5ff;
            color: #004085;
            border-left: 4px solid var(--secondary);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--accent);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        
        .option-link {
            color: var(--secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .option-link:hover {
            color: var(--primary);
            transform: translateX(5px);
        }
        
        @media (max-width: 480px) {
            .password-container {
                border-radius: 15px;
            }
            
            .password-header {
                padding: 30px 20px;
            }
            
            .password-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="password-container">
        <div class="password-header">
            <div class="password-header-content">
                <div class="logo-container">
                    <div class="logo">
                        <i class="fas fa-futbol"></i>
                    </div>
                </div>
                <h1><i class="fas fa-key"></i> Reset Password</h1>
                <p>Enter your email to receive a password reset link</p>
            </div>
        </div>
        
        <div class="password-body">
            <div id="status" class="status"></div>
            
            <form class="password-form" id="resetForm">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your.email@example.com" autocomplete="email" required>
                </div>
                
                <button type="submit" class="btn btn-primary" id="resetBtn">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>
            </form>
            
            <div class="options-container">
                <a href="CoachLogin.html" class="option-link">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
                <a href="CoachAccess.html" class="option-link">
                    <i class="fas fa-user-plus"></i> Register as a Coach
                </a>
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
            authDomain: "gombefootball.firebaseapp.com",
            projectId: "gombefootball"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // DOM Elements
        const resetForm = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const resetBtn = document.getElementById('resetBtn');
        const statusBox = document.getElementById('status');
        
        // Handle password reset
        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            if (!email) {
                showStatus('⛔ Please enter your email address', 'error');
                return;
            }
            
            // Show loading state
            showStatus('<i class="fas fa-spinner fa-spin"></i> Sending reset link...', 'info');
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            
            try {
                // Send password reset email
                await auth.sendPasswordResetEmail(email);
                
                // Success message
                showStatus('✅ Password reset link sent! Check your email.', 'success');
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
                
                // Clear the email field
                emailInput.value = '';
                
            } catch (error) {
                console.error("Password reset error:", error);
                
                let errorMessage = "Error sending reset link";
                if (error.code === "auth/user-not-found") {
                    errorMessage = "No account found with this email";
                } else if (error.code === "auth/invalid-email") {
                    errorMessage = "Invalid email address";
                } else if (error.code === "auth/too-many-requests") {
                    errorMessage = "Too many attempts. Please try again later.";
                } else {
                    errorMessage = error.message;
                }
                
                showStatus(`❌ ${errorMessage}`, 'error');
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
            }
        });
        
        // Helper function to show status messages
        function showStatus(message, type) {
            if (!message) {
                statusBox.style.display = 'none';
                return;
            }
            
            statusBox.style.display = 'flex';
            statusBox.innerHTML = message;
            statusBox.className = 'status';
            
            if (type) {
                statusBox.classList.add(type);
            }
        }
        
        // Auto-focus email field
        emailInput.focus();
    </script>
</body>
</html>
