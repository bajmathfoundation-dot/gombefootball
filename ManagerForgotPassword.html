<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Gombe Football</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #1a2a6c;
            --secondary: #3494e6;
            --accent: #fdbb2d;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            position: relative;
        }
        
        .header {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
        }
        
        .header-content {
            position: relative;
            z-index: 1;
        }
        
        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 350px;
            margin: 0 auto;
        }
        
        .body {
            padding: 40px 30px;
        }
        
        .form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .form-group {
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-control {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            background: var(--light);
        }
        
        .form-control:focus {
            border-color: var(--secondary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(52, 148, 230, 0.15);
        }
        
        .btn {
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--secondary);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .status {
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.5s ease-in;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid var(--success);
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid var(--danger);
        }
        
        .status.info {
            background: #cce5ff;
            color: #004085;
            border-left: 4px solid var(--secondary);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--accent);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        
        .option-link {
            color: var(--secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .option-link:hover {
            color: var(--primary);
            transform: translateX(5px);
        }

        /* Security notice */
        .security-notice {
            font-size: 0.8rem;
            color: var(--gray);
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid var(--secondary);
        }
        
        @media (max-width: 480px) {
            .container {
                border-radius: 15px;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo-container">
                    <div class="logo">
                        <i class="fas fa-futbol"></i>
                    </div>
                </div>
                <h1><i class="fas fa-key"></i> Reset Password</h1>
                <p>Enter your email to receive a password reset link</p>
            </div>
        </div>
        
        <div class="body">
            <div id="status" class="status"></div>
            
            <form class="form" id="resetForm">
                <input type="hidden" id="csrfToken" name="csrfToken">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your.email@example.com" autocomplete="email" required maxlength="100">
                </div>
                
                <button type="submit" class="btn btn-primary" id="resetBtn">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>
            </form>

            <div class="security-notice">
                <i class="fas fa-shield-alt"></i> For your security, password reset links expire after 1 hour and can only be used once.
            </div>
            
            <div class="options-container">
                <a href="Managerlogin.html" class="option-link">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-check-compat.js"></script>
    
    <script>
        // Security configuration
        const SECURITY_CONFIG = {
            CSRF_TOKEN_LENGTH: 32,
            CSRF_TOKEN_EXPIRY: 30 * 60 * 1000, // 30 minutes
            RECAPTCHA_ENTERPRISE_SITE_KEY: 'your-recaptcha-enterprise-site-key-here',
            MAX_EMAIL_LENGTH: 100,
            REQUEST_DELAY: 2000, // 2 seconds between requests
            MAX_ATTEMPTS: 5,
            ATTEMPT_WINDOW: 15 * 60 * 1000 // 15 minutes
        };

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
            authDomain: "gombefootball.firebaseapp.com",
            projectId: "gombefootball"
        };
        
        // Initialize Firebase with App Check
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const appCheck = firebase.appCheck();
        appCheck.activate(SECURITY_CONFIG.RECAPTCHA_ENTERPRISE_SITE_KEY, {
            isTokenAutoRefreshEnabled: true
        });
        
        // Security state management
        let securityState = {
            csrfTokens: new Map(),
            currentToken: null,
            lastRequestTime: 0,
            attemptCount: 0,
            attemptWindowStart: Date.now()
        };

        // DOM Elements
        const resetForm = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const resetBtn = document.getElementById('resetBtn');
        const statusBox = document.getElementById('status');

        // Initialize security features
        initializeSecurity();

        // Security initialization
        function initializeSecurity() {
            generateCSRFToken();
            setupSecurityEventListeners();
        }

        // Generate and store CSRF token
        function generateCSRFToken() {
            const token = generateRandomString(SECURITY_CONFIG.CSRF_TOKEN_LENGTH);
            const expiry = Date.now() + SECURITY_CONFIG.CSRF_TOKEN_EXPIRY;
            
            securityState.csrfTokens.set(token, expiry);
            securityState.currentToken = token;
            
            document.getElementById('csrfToken').value = token;
            
            // Clean up expired tokens
            cleanupExpiredTokens();
        }

        // Validate CSRF token
        function validateCSRFToken(token) {
            if (!token) return false;
            
            const expiry = securityState.csrfTokens.get(token);
            if (!expiry || expiry < Date.now()) {
                securityState.csrfTokens.delete(token);
                return false;
            }
            
            return true;
        }

        // Generate random string for tokens
        function generateRandomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            const crypto = window.crypto || window.msCrypto;
            const values = new Uint32Array(length);
            
            crypto.getRandomValues(values);
            for (let i = 0; i < length; i++) {
                result += chars[values[i] % chars.length];
            }
            return result;
        }

        // Clean up expired CSRF tokens
        function cleanupExpiredTokens() {
            const now = Date.now();
            for (const [token, expiry] of securityState.csrfTokens.entries()) {
                if (expiry < now) {
                    securityState.csrfTokens.delete(token);
                }
            }
        }

        // Setup security event listeners
        function setupSecurityEventListeners() {
            // Clear sensitive data when form is submitted
            resetForm.addEventListener('submit', function() {
                setTimeout(() => {
                    emailInput.value = '';
                }, 3000);
            });
            
            // Clear sensitive data when page is unloaded
            window.addEventListener('beforeunload', clearSensitiveData);
        }

        // Clear sensitive data from memory
        function clearSensitiveData() {
            emailInput.value = '';
        }

        // Input sanitization function
        function sanitizeInput(input) {
            if (typeof input !== 'string') return '';
            
            return input
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#x27;')
                .replace(/\//g, '&#x2F;')
                .substring(0, SECURITY_CONFIG.MAX_EMAIL_LENGTH);
        }

        // Rate limiting check
        function checkRateLimit() {
            const now = Date.now();
            
            // Reset attempt count if window has expired
            if (now - securityState.attemptWindowStart > SECURITY_CONFIG.ATTEMPT_WINDOW) {
                securityState.attemptCount = 0;
                securityState.attemptWindowStart = now;
            }
            
            // Check if maximum attempts reached
            if (securityState.attemptCount >= SECURITY_CONFIG.MAX_ATTEMPTS) {
                const timeLeft = Math.ceil((SECURITY_CONFIG.ATTEMPT_WINDOW - (now - securityState.attemptWindowStart)) / 60000);
                throw new Error(`Too many attempts. Please try again in ${timeLeft} minutes.`);
            }
            
            // Check request timing
            const timeSinceLastRequest = now - securityState.lastRequestTime;
            if (timeSinceLastRequest < SECURITY_CONFIG.REQUEST_DELAY) {
                throw new Error("Please wait a moment before trying again.");
            }
            
            securityState.attemptCount++;
            securityState.lastRequestTime = now;
            
            return true;
        }
        
        // Handle password reset
        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validate CSRF token
            const formToken = document.getElementById('csrfToken').value;
            if (!validateCSRFToken(formToken)) {
                showStatus('Security token expired. Please refresh the page and try again.', 'error');
                return;
            }
            
            const email = sanitizeInput(emailInput.value.trim());
            
            if (!email) {
                showStatus('Please enter your email address', 'error');
                return;
            }
            
            if (!validateEmail(email)) {
                showStatus('Please enter a valid email address', 'error');
                return;
            }
            
            try {
                // Check rate limiting
                checkRateLimit();
                
                // Show loading state
                showStatus('Sending reset link...', 'info');
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
                
                await auth.sendPasswordResetEmail(email);
                showStatus('Password reset link sent! Check your email inbox.', 'success');
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<i class="fas fa-check"></i> Link Sent';
                
                // Generate new CSRF token after successful operation
                generateCSRFToken();
                
            } catch (error) {
                console.error("Password reset error:", error);
                
                let errorMessage = "Failed to send reset link. Please try again.";
                if (error.code === "auth/user-not-found") {
                    errorMessage = "If this email is registered, you will receive a reset link.";
                    // Don't reveal whether email exists
                } else if (error.code === "auth/too-many-requests") {
                    errorMessage = "Too many attempts. Please try again later.";
                } else if (error.message.includes("too many attempts")) {
                    errorMessage = error.message;
                } else {
                    // Generic error message to prevent information disclosure
                    errorMessage = "Unable to process your request. Please try again later.";
                }
                
                showStatus(errorMessage, 'error');
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
            }
        });
        
        // Helper function to validate email
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
        
        // Helper function to show status messages
        function showStatus(message, type) {
            if (!message) {
                statusBox.style.display = 'none';
                return;
            }
            
            statusBox.style.display = 'flex';
            statusBox.innerHTML = sanitizeHTML(message);
            statusBox.className = 'status';
            
            if (type) {
                statusBox.classList.add(type);
            }
        }

        // Output sanitization for HTML content
        function sanitizeHTML(content) {
            const temp = document.createElement('div');
            temp.textContent = content;
            return temp.innerHTML;
        }
        
        // Auto-focus email field
        emailInput.focus();

        // Add timeout for security
        setTimeout(() => {
            if (resetBtn.disabled) {
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
                showStatus('Session refreshed. Please try again if needed.', 'info');
                setTimeout(() => {
                    statusBox.style.display = 'none';
                }, 3000);
            }
        }, 30000); // 30 second timeout
    </script>
</body>
</html>
