<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gombe · Admin · Code Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,system-ui,sans-serif; }
        body {
            background: linear-gradient(145deg, #edf3ed 0%, #dce8dc 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }
        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(6px);
            border-radius: 48px;
            padding: 2rem 2.2rem 2.5rem;
            box-shadow: 0 25px 50px rgba(0,30,10,0.2);
            border:1px solid rgba(255,255,255,0.4);
        }
        h1 {
            font-weight:700; font-size:2.2rem; color:#014421;
            display:flex; align-items:center; gap:14px;
            border-bottom:3px solid #ffd700; padding-bottom:16px; margin-bottom:28px;
        }
        h1 i { color:#ffd700; }
        .subhead {
            display:flex; flex-wrap:wrap; gap:12px 20px;
            background:#e9f3e9; padding:1.2rem 1.8rem; border-radius:60px;
            margin-bottom:28px; align-items:center; border:1px solid #bcd0bc;
        }
        .subhead .badge-count {
            background:#014421; color:white; padding:4px 20px; border-radius:40px;
            font-weight:600; font-size:0.9rem;
        }
        .controls {
            display:flex; flex-wrap:wrap; gap:16px;
            background:white; padding:1.2rem 1.8rem; border-radius:40px;
            margin-bottom:24px; border:1px solid #cfe0cf; align-items:center;
        }
        .controls select {
            background:#f5faf5; border:1px solid #b8d0b8; border-radius:60px;
            padding:10px 20px; font-size:0.95rem; outline:none; flex:1 1 250px;
        }
        .controls select:focus {
            border-color:#014421; box-shadow:0 0 0 3px rgba(1,68,33,0.2);
        }
        .btn-primary {
            background:#014421; border:none; border-radius:60px;
            padding:10px 28px; font-weight:700; color:white;
            cursor:pointer; transition:0.15s; display:inline-flex; align-items:center; gap:8px;
        }
        .btn-primary:hover { background:#00351a; }
        .btn-secondary {
            background:#ffd700; border:2px solid #014421; border-radius:60px;
            padding:10px 28px; font-weight:700; color:#014421;
            cursor:pointer; transition:0.15s; display:inline-flex; align-items:center; gap:8px;
        }
        .btn-secondary:hover { background:#f0c800; }
        .btn-danger {
            background:#b91c1c; border:none; border-radius:60px;
            padding:10px 28px; font-weight:700; color:white;
            cursor:pointer; transition:0.15s; display:inline-flex; align-items:center; gap:8px;
        }
        .btn-danger:hover { background:#991b1b; }
        .competition-grid {
            display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap:20px; margin-top:10px;
        }
        .comp-card {
            background:white; border-radius:28px; padding:1.2rem 1.5rem 1.5rem;
            border:1px solid #cadeca; box-shadow:0 4px 12px rgba(0,20,0,0.04);
            transition:0.2s;
        }
        .comp-card:hover { box-shadow:0 6px 20px rgba(0,20,0,0.08); }
        .comp-card h4 {
            color:#014421; font-size:1.1rem; margin-bottom:4px;
        }
        .comp-card .meta {
            font-size:0.8rem; color:#2d5a2d; margin:4px 0 8px;
        }
        .comp-card .meta span {
            background:#ecf6ec; padding:2px 12px; border-radius:30px; display:inline-block; margin:2px 4px 2px 0;
        }
        .comp-card .code-display {
            background:#ecf6ec; border-radius:40px; padding:8px 16px;
            font-family:monospace; font-size:1.2rem; font-weight:700;
            color:#014421; margin:8px 0; display:inline-block;
            border:1px dashed #b8d4b8;
        }
        .comp-card .code-display.expired {
            background:#fee2e2; color:#991b1b; border-color:#991b1b;
        }
        .comp-card .actions {
            display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;
        }
        .comp-card .actions button {
            border:none; border-radius:40px; padding:6px 16px;
            font-weight:600; cursor:pointer; transition:0.15s;
            font-size:0.85rem;
        }
        .team-tag {
            background:#e9f3e9; padding:2px 12px; border-radius:30px;
            font-size:0.8rem; border:1px solid #d0e5d0; display:inline-block; margin:2px 4px 2px 0;
        }
        .empty-note {
            color:#3f663f; opacity:0.6; font-style:italic;
            padding:30px 0; text-align:center; grid-column:1/-1;
        }
        .toast {
            position:fixed; bottom:30px; right:30px;
            background:#014421; color:white; padding:16px 28px;
            border-radius:60px; box-shadow:0 10px 30px rgba(0,0,0,0.2);
            font-weight:600; z-index:999; border-left:5px solid #ffd700;
            transform:translateY(100px); opacity:0; transition:0.4s ease;
        }
        .toast.show { transform:translateY(0); opacity:1; }
        .toast.error { background:#a13030; border-left-color:#ff6b6b; }
        @media (max-width:600px) {
            .wrapper { padding:1.2rem; }
            .competition-grid { grid-template-columns:1fr; }
            .controls { flex-direction:column; align-items:stretch; }
        }
        .status-msg {
            font-size:0.85rem; margin-top:6px; padding:6px 12px; border-radius:30px;
            display:inline-block;
        }
        .status-msg.active { background:#d1fae5; color:#065f46; }
        .status-msg.expired { background:#fee2e2; color:#991b1b; }
    </style>
</head>
<body>
<div class="wrapper">
    <h1><i class="fas fa-user-cog"></i> Admin · Competition Codes</h1>
    <div class="subhead">
        <span><i class="fas fa-database"></i> Verified Competitions</span>
        <span class="badge-count" id="compCountBadge">0 competitions</span>
        <span style="margin-left:auto; font-size:0.9rem; opacity:0.7;"><i class="fas fa-sync-alt fa-fw"></i> live</span>
    </div>

    <div class="controls">
        <select id="competitionSelect" onchange="loadCompetitionDetails()">
            <option value="">Select a verified competition...</option>
        </select>
        <button class="btn-primary" onclick="generateCode()"><i class="fas fa-key"></i> Generate Code</button>
        <button class="btn-danger" onclick="retireCode()"><i class="fas fa-ban"></i> Retire Code</button>
        <button class="btn-secondary" onclick="loadVerifiedCompetitions()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div id="adminContainer" class="competition-grid">
        <div class="empty-note">Select a competition to generate or view its access code.</div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
    // ---------- FIREBASE ----------
    const firebaseConfig = {
        apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
        authDomain: "gombefootball.firebaseapp.com",
        databaseURL: "https://gombefootball-default-rtdb.firebaseio.com",
        projectId: "gombefootball",
        storageBucket: "gombefootball.firebasestorage.app",
        messagingSenderId: "120731655706",
        appId: "1:120731655706:web:9c99d6831aca3df563bba3",
        measurementId: "G-8SCVPBSKPG"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ---------- GLOBAL ----------
    let verifiedCompetitions = [];
    let selectedCompId = null;

    // ---------- TOAST ----------
    function showToast(msg, isError = false) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast show' + (isError ? ' error' : '');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 4000);
    }

    // ---------- LOAD VERIFIED COMPETITIONS ----------
    async function loadVerifiedCompetitions() {
        try {
            const snapshot = await db.collection('OtherCompetitions')
                .where('verificationStatus', '==', 'verified')
                .get();

            verifiedCompetitions = [];
            const select = document.getElementById('competitionSelect');
            select.innerHTML = '<option value="">Select a verified competition...</option>';

            snapshot.forEach(doc => {
                const data = doc.data();
                const comp = { id: doc.id, ...data };
                verifiedCompetitions.push(comp);

                const option = document.createElement('option');
                option.value = doc.id;
                let label = data.competitionName || doc.id;
                if (data.seasonYear) label += ` (${data.seasonYear})`;
                if (data.accessCode) label += ` 🔑`;
                else label += ` ⚠️ no code`;
                option.textContent = label;
                select.appendChild(option);
            });

            document.getElementById('compCountBadge').textContent = verifiedCompetitions.length + ' competitions';

            if (verifiedCompetitions.length === 0) {
                document.getElementById('adminContainer').innerHTML =
                    '<div class="empty-note">No verified competitions found. Please verify competitions first.</div>';
            } else {
                select.value = verifiedCompetitions[0].id;
                loadCompetitionDetails();
            }

        } catch (e) {
            console.error('Error loading verified competitions:', e);
            showToast('Error loading: ' + e.message, true);
        }
    }

    // ---------- LOAD COMPETITION DETAILS ----------
    function loadCompetitionDetails() {
        const select = document.getElementById('competitionSelect');
        const compId = select.value;
        if (!compId) {
            document.getElementById('adminContainer').innerHTML =
                '<div class="empty-note">Select a competition to view details.</div>';
            return;
        }

        const comp = verifiedCompetitions.find(c => c.id === compId);
        if (!comp) return;

        selectedCompId = compId;
        const container = document.getElementById('adminContainer');

        let teamsHtml = '';
        if (comp.teams && Array.isArray(comp.teams)) {
            comp.teams.slice(0, 10).forEach(t => {
                teamsHtml += `<span class="team-tag">${t.name || t.id}</span>`;
            });
            if (comp.teams.length > 10) {
                teamsHtml += `<span style="opacity:0.6;font-size:0.8rem;">+${comp.teams.length - 10} more</span>`;
            }
        }

        const hasCode = comp.accessCode && comp.accessCode.length > 0;
        const codeDisplay = hasCode ?
            `<div class="code-display"><i class="fas fa-key"></i> ${comp.accessCode}</div>` :
            `<div style="color:#92400e;font-size:0.9rem;"><i class="fas fa-exclamation-triangle"></i> No code generated yet</div>`;

        const statusMsg = hasCode ?
            `<span class="status-msg active"><i class="fas fa-check-circle"></i> Active</span>` :
            `<span class="status-msg expired"><i class="fas fa-times-circle"></i> Expired / No code</span>`;

        container.innerHTML = `
            <div class="comp-card">
                <h4>${comp.competitionName || comp.id}</h4>
                <div class="meta">
                    <span><i class="fas fa-calendar"></i> ${comp.seasonYear || 'N/A'}</span>
                    <span><i class="fas fa-list-ul"></i> ${comp.format || 'N/A'}</span>
                    <span><i class="fas fa-phone"></i> ${comp.organizerPhone || 'N/A'}</span>
                    <span><i class="fas fa-users"></i> ${comp.teams ? comp.teams.length : 0} teams</span>
                </div>
                <div style="margin:8px 0;">
                    <strong>Teams:</strong>
                    <div style="display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;">${teamsHtml || 'No teams listed'}</div>
                </div>
                <div style="margin:12px 0;">
                    <strong>Access Code:</strong><br/>
                    ${codeDisplay}
                    <div style="margin-top:6px;">${statusMsg}</div>
                </div>
                <div class="actions">
                    <button class="btn-primary" onclick="generateCode()" style="padding:8px 20px;font-size:0.9rem;">
                        <i class="fas fa-sync-alt"></i> Generate New
                    </button>
                    <button class="btn-secondary" onclick="copyCode()" style="padding:8px 20px;font-size:0.9rem;">
                        <i class="fas fa-copy"></i> Copy Code
                    </button>
                    <button class="btn-danger" onclick="retireCode()" style="padding:8px 20px;font-size:0.9rem;">
                        <i class="fas fa-ban"></i> Retire Code
                    </button>
                </div>
                <div style="margin-top:12px;font-size:0.8rem;color:#4a6a4a;border-top:1px solid #ecf3ec;padding-top:10px;">
                    <i class="fas fa-info-circle"></i> Retiring a code will delete it and notify the organizer to pay for the next season.
                </div>
            </div>
        `;
    }

    // ---------- GENERATE CODE ----------
    async function generateCode() {
        const compId = selectedCompId;
        if (!compId) {
            showToast('Please select a competition first.', true);
            return;
        }

        try {
            const comp = verifiedCompetitions.find(c => c.id === compId);
            if (!comp) {
                showToast('Competition not found.', true);
                return;
            }

            const year = comp.seasonYear || '2026';
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            const code = `COMP-${year}-${random}`;

            // Update OtherCompetitions
            await db.collection('OtherCompetitions').doc(compId).update({
                accessCode: code,
                codeGeneratedAt: firebase.firestore.FieldValue.serverTimestamp(),
                codeActive: true
            });

            // Update CompetitionsRecords if exists
            try {
                const snapshot = await db.collection('CompetitionsRecords')
                    .where('name', '==', comp.competitionName)
                    .get();
                snapshot.forEach(doc => {
                    db.collection('CompetitionsRecords').doc(doc.id).update({
                        accessCode: code,
                        codeGeneratedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        codeActive: true
                    });
                });
            } catch (e) { /* ignore */ }

            comp.accessCode = code;
            comp.codeActive = true;

            // Send WhatsApp with the new code
            const phone = comp.organizerPhone || '';
            if (phone) {
                const message = encodeURIComponent(
                    `🔑 *NEW ACCESS CODE GENERATED* 🔑\n\n` +
                    `Dear Organizer,\n\n` +
                    `A new access code has been generated for your competition:\n\n` +
                    `🏆 *${comp.competitionName || comp.id}*\n` +
                    `📅 Season: ${comp.seasonYear || 'N/A'}\n\n` +
                    `🔹 *Access Code:* ${code}\n\n` +
                    `You can now share this code with your team members to access the competition portal.\n\n` +
                    `Thank you for using Gombe Football.`
                );
                const waUrl = `https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${message}`;
                window.open(waUrl, '_blank');
            }

            showToast(`✅ Code generated: ${code} • WhatsApp opened`);
            loadCompetitionDetails();

        } catch (e) {
            console.error('Error generating code:', e);
            showToast('❌ Error generating code: ' + e.message, true);
        }
    }

    // ---------- RETIRE CODE ----------
    async function retireCode() {
        const compId = selectedCompId;
        if (!compId) {
            showToast('Please select a competition first.', true);
            return;
        }

        const comp = verifiedCompetitions.find(c => c.id === compId);
        if (!comp) {
            showToast('Competition not found.', true);
            return;
        }

        if (!comp.accessCode) {
            showToast('This competition has no active code to retire.', true);
            return;
        }

        if (!confirm(`Are you sure you want to retire the access code for "${comp.competitionName || compId}"?\n\nThis will delete the code and notify the organizer to pay for the next season.`)) {
            return;
        }

        try {
            // Remove code from OtherCompetitions
            await db.collection('OtherCompetitions').doc(compId).update({
                accessCode: firebase.firestore.FieldValue.delete(),
                codeActive: false,
                codeRetiredAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Remove from CompetitionsRecords
            try {
                const snapshot = await db.collection('CompetitionsRecords')
                    .where('name', '==', comp.competitionName)
                    .get();
                snapshot.forEach(doc => {
                    db.collection('CompetitionsRecords').doc(doc.id).update({
                        accessCode: firebase.firestore.FieldValue.delete(),
                        codeActive: false,
                        codeRetiredAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
            } catch (e) { /* ignore */ }

            comp.accessCode = null;
            comp.codeActive = false;

            // Send WhatsApp notification
            const phone = comp.organizerPhone || '';
            if (phone) {
                const message = encodeURIComponent(
                    `⏰ *ACCESS CODE EXPIRED* ⏰\n\n` +
                    `Dear Organizer,\n\n` +
                    `The access code for your competition has expired:\n\n` +
                    `🏆 *${comp.competitionName || comp.id}*\n` +
                    `📅 Season: ${comp.seasonYear || 'N/A'}\n\n` +
                    `🔹 *Your previous access code has been retired.*\n\n` +
                    `📌 To continue using the competition portal for the next season, you need to make a new payment.\n\n` +
                    `Please contact the Gombe Football administration for payment details.\n\n` +
                    `Thank you for using Gombe Football.`
                );
                const waUrl = `https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${message}`;
                window.open(waUrl, '_blank');
            }

            showToast(`✅ Code retired for "${comp.competitionName || compId}" • WhatsApp opened`);
            loadCompetitionDetails();

        } catch (e) {
            console.error('Error retiring code:', e);
            showToast('❌ Error retiring code: ' + e.message, true);
        }
    }

    // ---------- COPY CODE ----------
    function copyCode() {
        const comp = verifiedCompetitions.find(c => c.id === selectedCompId);
        if (!comp || !comp.accessCode) {
            showToast('No code to copy. Generate a code first.', true);
            return;
        }

        navigator.clipboard.writeText(comp.accessCode).then(() => {
            showToast('✅ Code copied to clipboard!');
        }).catch(() => {
            const textarea = document.createElement('textarea');
            textarea.value = comp.accessCode;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('✅ Code copied!');
        });
    }

    // ---------- INIT ----------
    document.addEventListener('DOMContentLoaded', () => {
        loadVerifiedCompetitions();
    });
</script>
</body>
</html>
