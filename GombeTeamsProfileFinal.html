<!DOCTYPE html>
<html lang="en">
<head>
  <!-- SEO Meta Tags -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="pageTitle">Gombe Football Team Profile</title>
  <meta name="description" id="metaDescription" content="View team profile, fixtures, squad, and standings for Gombe State Football teams." />
  <meta name="keywords" content="Gombe football, team profile, fixtures, squad, standings, Nigerian football" />
  <meta property="og:title" id="ogTitle" content="Gombe Football Team Profile" />
  <meta property="og:description" id="ogDescription" content="View team profile, fixtures, squad, and standings for Gombe State Football teams." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gombefootball.web.app/GombeTeamsProfileFinal.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://gombefootball.web.app/GombeTeamsProfileFinal.html" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #014421;
      --primary-light: #02743a;
      --secondary: #ffd700;
      --accent: #ff6b35;
      --light: #f8f9fa;
      --dark: #1a1a1a;
      --gray: #6c757d;
      --win: #27ae60;
      --draw: #f39c12;
      --loss: #e74c3c;
      --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      --card-hover-shadow: 0 20px 60px rgba(1, 68, 33, 0.15);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #f0f7f0, #e0ebe0);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    /* Header Banner with Team Colors */
    .header-banner {
      color: white;
      padding: 0;
      position: relative;
      overflow: hidden;
      border-bottom: 4px solid var(--secondary);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
    }
    
    .header-banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0 L100,100 L0,100 Z" fill="rgba(255,255,255,0.05)"/></svg>');
      background-size: cover;
      z-index: 0;
    }
    
    .header-banner .header-content {
      position: relative;
      z-index: 1;
      padding: 30px 0 25px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }
    
    /* Team Header */
    .team-header-wrapper {
      display: flex;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    
    .team-logo-container {
      position: relative;
      flex-shrink: 0;
    }
    
    .team-logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      border: 4px solid var(--secondary);
      overflow: hidden;
      transition: transform 0.3s ease;
    }
    
    .team-logo:hover {
      transform: scale(1.05) rotate(-3deg);
    }
    
    .team-logo img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }
    
    .team-logo .logo-placeholder {
      font-size: 3.5rem;
      color: var(--primary);
    }
    
    .team-info {
      flex: 1;
      min-width: 200px;
    }
    
    .team-info h1 {
      font-size: 2.8rem;
      font-weight: 800;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    
    .team-info .team-tagline {
      font-size: 1.1rem;
      opacity: 0.9;
      font-weight: 300;
      margin-bottom: 15px;
    }
    
    .team-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .meta-item {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    
    .meta-item:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    .meta-item i {
      font-size: 0.9rem;
    }
    
    /* Kit Strip */
    .kit-strip {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px 0;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(5px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 1;
    }
    
    .kit {
      text-align: center;
    }
    
    .kit-box {
      width: 70px;
      height: 90px;
      border-radius: 10px;
      margin: 0 auto 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease;
    }
    
    .kit-box:hover {
      transform: scale(1.08);
    }
    
    .kit-box::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    }
    
    .kit-label {
      font-weight: 600;
      color: white;
      font-size: 0.8rem;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    }
    
    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 25px 0 20px;
      flex-wrap: wrap;
      background: white;
      padding: 8px;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
    }
    
    .tab-button {
      padding: 12px 28px;
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.3s ease;
      border-radius: 12px;
      position: relative;
    }
    
    .tab-button:hover {
      color: var(--primary);
      background: rgba(1, 68, 33, 0.05);
    }
    
    .tab-button.active {
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      box-shadow: 0 4px 15px rgba(1, 68, 33, 0.3);
    }
    
    .tab-button i {
      margin-right: 8px;
    }
    
    /* Content Sections */
    .content-section {
      display: none;
      padding: 30px 0;
      animation: fadeIn 0.5s ease;
    }
    
    .content-section.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .section-title {
      position: relative;
      margin-bottom: 25px;
      padding-bottom: 12px;
      font-size: 1.8rem;
      color: var(--primary);
      font-weight: 700;
    }
    
    .section-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 2px;
    }
    
    /* Season Selector */
    .season-selector {
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
    }
    
    .season-selector label {
      font-weight: 600;
      color: var(--dark);
    }
    
    .season-selector select {
      padding: 10px 20px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      background: white;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 150px;
    }
    
    .season-selector select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 4px rgba(1, 68, 33, 0.1);
    }
    
    /* Fixtures */
    .fixtures-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .fixture-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: var(--card-shadow);
      transition: all 0.3s ease;
      border-left: 5px solid var(--primary);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    
    .fixture-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--card-hover-shadow);
    }
    
    .fixture-card.completed {
      border-left-color: var(--gray);
      opacity: 0.85;
    }
    
    .fixture-card.live {
      border-left-color: var(--win);
      animation: pulseGlow 2s infinite;
    }
    
    @keyframes pulseGlow {
      0%, 100% { box-shadow: var(--card-shadow); }
      50% { box-shadow: 0 4px 30px rgba(39, 174, 96, 0.25); }
    }
    
    .fixture-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .match-date {
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .competition-badge {
      background: var(--primary);
      color: white;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    .match-status {
      padding: 4px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .match-status.upcoming {
      background: #e3f2fd;
      color: #1976d2;
    }
    
    .match-status.completed {
      background: #f5f5f5;
      color: #757575;
    }
    
    .match-status.live {
      background: #e8f5e9;
      color: var(--win);
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .fixture-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    
    .team-container {
      flex: 1;
      text-align: center;
      min-width: 120px;
      padding: 10px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    
    .team-container:hover {
      background: rgba(1, 68, 33, 0.05);
    }
    
    .team-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--dark);
      cursor: pointer;
      transition: color 0.2s;
    }
    
    .team-name:hover {
      color: var(--primary);
      text-decoration: underline;
    }
    
    .team-meta {
      font-size: 0.8rem;
      color: var(--gray);
      margin-top: 5px;
    }
    
    .vs-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 100px;
    }
    
    .match-score {
      font-size: 1.8rem;
      font-weight: 800;
      padding: 8px 20px;
      border-radius: 12px;
      background: #f8f9fa;
      min-width: 80px;
      text-align: center;
      transition: all 0.3s ease;
    }
    
    .match-score.win {
      background: var(--win);
      color: white;
    }
    
    .match-score.draw {
      background: var(--draw);
      color: white;
    }
    
    .match-score.loss {
      background: var(--loss);
      color: white;
    }
    
    .vs-text {
      color: var(--gray);
      font-size: 0.8rem;
      margin-top: 5px;
    }
    
    .fixture-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      margin-top: 15px;
      border-top: 1px solid #eee;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .match-info {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    
    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--gray);
      font-size: 0.85rem;
    }
    
    .tracker-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tracker-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(1, 68, 33, 0.3);
    }
    
    .tracker-btn:disabled {
      background: var(--gray);
      cursor: not-allowed;
      transform: none;
      opacity: 0.6;
    }
    
    /* Squad Grid */
    .squad-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
    }
    
    .player-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: all 0.3s ease;
      position: relative;
      cursor: pointer;
      border: 2px solid transparent;
    }
    
    .player-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--card-hover-shadow);
      border-color: var(--secondary);
    }
    
    .player-photo {
      height: 200px;
      background: linear-gradient(135deg, #e9ecef, #dee2e6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    .player-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .player-photo .player-icon {
      font-size: 4rem;
      color: #adb5bd;
    }
    
    .jersey-number {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--primary);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
      border: 2px solid var(--secondary);
    }
    
    .player-details {
      padding: 15px 18px;
    }
    
    .player-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--dark);
      margin-bottom: 3px;
    }
    
    .player-position {
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 600;
    }
    
    /* Standings */
    .standings-container {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }
    
    .zone-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 18px 25px;
      font-size: 1.3rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .zone-header i {
      font-size: 1.5rem;
    }
    
    .qualification-legend {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 20px;
      flex-wrap: wrap;
      background: #f8f9fa;
      border-bottom: 1px solid #eee;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-weight: 500;
    }
    
    .legend-item:hover {
      background: rgba(1, 68, 33, 0.05);
      transform: translateY(-2px);
    }
    
    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    
    .champions-color { background: #27ae60; }
    .warriors-color { background: #f39c12; }
    .relegated-color { background: #e74c3c; }
    
    .table-container {
      overflow-x: auto;
      padding: 0 5px;
    }
    
    .league-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    
    .league-table th {
      background: #f8f9fa;
      padding: 15px;
      text-align: left;
      font-weight: 700;
      border-bottom: 2px solid #e9ecef;
      color: var(--dark);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    .league-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #f0f0f0;
      transition: all 0.2s ease;
    }
    
    .league-table tr:hover td {
      background: rgba(1, 68, 33, 0.03);
    }
    
    .league-table .champions-league {
      background: rgba(39, 174, 96, 0.08);
      border-left: 4px solid #27ae60;
    }
    
    .league-table .warriors-cup {
      background: rgba(243, 156, 18, 0.08);
      border-left: 4px solid #f39c12;
    }
    
    .league-table .relegated {
      background: rgba(231, 76, 60, 0.08);
      border-left: 4px solid #e74c3c;
    }
    
    .league-table .current-team {
      background: rgba(1, 68, 33, 0.1) !important;
      border-left: 4px solid var(--primary) !important;
      font-weight: 700;
    }
    
    .league-table .current-team td {
      color: var(--primary);
    }
    
    .position {
      font-weight: 700;
      text-align: center;
      width: 50px;
    }
    
    .stats {
      text-align: center;
      width: 45px;
      font-weight: 600;
    }
    
    /* Loading & Error States */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
      grid-column: 1 / -1;
    }
    
    .loading i {
      font-size: 3rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 25px;
      border-radius: 15px;
      margin: 20px 0;
      text-align: center;
      border-left: 5px solid #c62828;
    }
    
    .no-fixtures {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
    }
    
    .no-fixtures i {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #ddd;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .team-header-wrapper {
        flex-direction: column;
        text-align: center;
      }
      
      .team-info h1 {
        font-size: 2rem;
      }
      
      .team-meta {
        justify-content: center;
      }
      
      .kit-strip {
        gap: 15px;
      }
      
      .kit-box {
        width: 50px;
        height: 70px;
      }
      
      .nav-tabs {
        gap: 5px;
        padding: 5px;
        border-radius: 12px;
      }
      
      .tab-button {
        padding: 10px 16px;
        font-size: 0.85rem;
        border-radius: 8px;
      }
      
      .fixture-content {
        flex-direction: column;
        gap: 15px;
      }
      
      .vs-container {
        min-width: unset;
      }
      
      .match-score {
        font-size: 1.4rem;
        padding: 6px 16px;
      }
      
      .fixture-header {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .fixture-footer {
        flex-direction: column;
        align-items: stretch;
      }
      
      .match-info {
        justify-content: center;
      }
      
      .squad-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }
      
      .qualification-legend {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      
      .league-table {
        font-size: 0.8rem;
      }
      
      .league-table th,
      .league-table td {
        padding: 8px 6px;
      }
      
      .section-title {
        font-size: 1.4rem;
      }
      
      .zone-header {
        font-size: 1.1rem;
        padding: 15px;
      }
    }
    
    @media (max-width: 480px) {
      .team-info h1 {
        font-size: 1.6rem;
      }
      
      .team-logo {
        width: 90px;
        height: 90px;
      }
      
      .squad-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
      
      .player-photo {
        height: 150px;
      }
      
      .tab-button {
        padding: 8px 12px;
        font-size: 0.75rem;
      }
      
      .tab-button i {
        margin-right: 4px;
      }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="header-banner" id="headerBanner">
    <div class="container">
      <div class="header-content">
        <div class="team-header-wrapper">
          <div class="team-logo-container">
            <div class="team-logo" id="teamLogoContainer">
              <img id="teamLogo" src="" alt="Team Logo" style="display:none;">
              <i class="fas fa-shield-alt logo-placeholder" id="logoPlaceholder"></i>
            </div>
          </div>
          <div class="team-info">
            <h1 id="teamName">Team Name</h1>
            <div class="team-tagline" id="teamTagline">Gombe State Football Association</div>
            <div class="team-meta" id="teamMeta">
              <!-- Dynamic content -->

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
      authDomain: "gombefootball.firebaseapp.com",
      databaseURL: "https://gombefootball-default-rtdb.firebaseio.com",
      projectId: "gombefootball",
      storageBucket: "gombefootball.firebasestorage.app",
      messagingSenderId: "120731655706",
      appId: "1:120731655706:web:9c99d6831aca3df563bba3",
      measurementId: "G-8SCVPBSKPG"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // Get teamId from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const teamId = urlParams.get('teamId');
    
    // Team cache to resolve IDs to names and vice versa
    const teamNameCache = {};
    const teamIdCache = {};
    let currentTeamName = '';
    let currentSeason = '';
    let currentTeamTier = '';
    let currentTeamZone = '';
    let teamColors = {
      home: '#014421',
      away: '#ffffff',
      third: '#ffd700'
    };
    
    // Tab navigation functionality
    function setupTabNavigation() {
      const tabButtons = document.querySelectorAll('.tab-button');
      const contentSections = document.querySelectorAll('.content-section');
      
      tabButtons.forEach(button => {
        button.addEventListener('click', () => {
          const tabId = button.getAttribute('data-tab');
          
          tabButtons.forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          
          contentSections.forEach(section => {
            section.classList.remove('active');
          });
          
          document.getElementById(tabId + 'Section').classList.add('active');
          
          if (tabId === 'standings') {
            loadStandings();
          }
        });
      });
    }
    
    // Initialize page
    async function initPage() {
      if (!teamId) {
        showError("No team specified in URL");
        return;
      }
      
      try {
        setupTabNavigation();
        await loadAllTeams();
        await loadTeamInfo();
        await populateSeasonSelector();
        await Promise.all([loadSquad(), loadFixtures()]);
        updateSEO();
        
        // Event listeners for qualification zone buttons
        document.getElementById('champions-league-btn').addEventListener('click', () => {
          highlightQualificationZone('champions-league');
        });
        document.getElementById('warriors-cup-btn').addEventListener('click', () => {
          highlightQualificationZone('warriors-cup');
        });
        document.getElementById('relegation-btn').addEventListener('click', () => {
          highlightQualificationZone('relegated');
        });
      } catch (error) {
        console.error("Initialization error:", error);
        showError("Failed to load team data. Please try again later.");
      }
    }
    
    // Load all teams for name-to-ID mapping
    async function loadAllTeams() {
      try {
        const teamsSnapshot = await db.collection("GombeTeams").get();
        teamsSnapshot.forEach(doc => {
          const teamData = doc.data();
          const teamName = teamData.name;
          teamNameCache[doc.id] = teamName;
          teamIdCache[teamName] = doc.id;
        });
      } catch (error) {
        console.error("Error loading all teams:", error);
      }
    }
    
    // Load Team Details
    async function loadTeamInfo() {
      try {
        const teamDoc = await db.collection("GombeTeams").doc(teamId).get();
        
        if (!teamDoc.exists) {
          showError("Team not found in database");
          return;
        }
        
        const team = teamDoc.data();
        currentTeamName = team.name || 'Unknown FC';
        teamNameCache[teamId] = currentTeamName;
        
        // Store colors
        teamColors.home = team.kitColorHome || '#014421';
        teamColors.away = team.kitColorAway || '#ffffff';
        teamColors.third = team.kitColorThird || '#ffd700';
        
        // Update header background with team colors
        const headerBanner = document.getElementById('headerBanner');
        headerBanner.style.background = `linear-gradient(135deg, ${teamColors.home}, ${adjustColor(teamColors.home, -30)})`;
        
        // Team Logo
        const logoImg = document.getElementById('teamLogo');
        const logoPlaceholder = document.getElementById('logoPlaceholder');
        if (team.logoUrl) {
          logoImg.src = team.logoUrl;
          logoImg.style.display = 'block';
          logoPlaceholder.style.display = 'none';
        } else {
          logoImg.style.display = 'none';
          logoPlaceholder.style.display = 'block';
          logoPlaceholder.style.color = teamColors.home;
        }
        
        // Team Name
        document.getElementById('teamName').textContent = currentTeamName;
        document.getElementById('teamTagline').textContent = team.tagline || 'Gombe State Football Association';
        
        // Build metadata
        const metaItems = [];
        if (team.zone) metaItems.push(`<div class="meta-item"><i class="fas fa-map-pin"></i> ${team.zone}</div>`);
        if (team.lga) metaItems.push(`<div class="meta-item"><i class="fas fa-map-marker-alt"></i> ${team.lga}</div>`);
        if (team.ward) metaItems.push(`<div class="meta-item"><i class="fas fa-location-dot"></i> ${team.ward}</div>`);
        if (team.tier) {
          const tierLabel = team.tier === 'championship' ? '🏆 Championship' : '📊 League';
          metaItems.push(`<div class="meta-item"><i class="fas fa-layer-group"></i> ${tierLabel}</div>`);
          currentTeamTier = team.tier;
        }
        if (team.founded) metaItems.push(`<div class="meta-item"><i class="fas fa-calendar"></i> Founded ${team.founded}</div>`);
        if (team.StateWideCompetition) metaItems.push(`<div class="meta-item"><i class="fas fa-trophy"></i> ${team.StateWideCompetition}</div>`);
        if (team.stadium) metaItems.push(`<div class="meta-item"><i class="fas fa-stadium"></i> ${team.stadium}</div>`);
        
        document.getElementById('teamMeta').innerHTML = metaItems.join('');
        
        // Kit Colors
        document.getElementById('homeKit').style.background = teamColors.home;
        document.getElementById('awayKit').style.background = teamColors.away;
        document.getElementById('awayKit').style.border = teamColors.away === '#ffffff' ? '1px solid #ddd' : 'none';
        document.getElementById('thirdKit').style.background = teamColors.third;
        
        // Update CSS variables for team colors
        document.documentElement.style.setProperty('--primary', teamColors.home);
        document.documentElement.style.setProperty('--primary-light', adjustColor(teamColors.home, 40));
        
      } catch (error) {
        console.error("Error loading team info:", error);
        showError("Failed to load team information");
      }
    }
    
    // Helper: Adjust color brightness
    function adjustColor(hex, percent) {
      const num = parseInt(hex.replace('#', ''), 16);
      const amt = Math.round(2.55 * percent);
      const R = Math.min(255, Math.max(0, (num >> 16) + amt));
      const G = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
      const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
      return `#${(1 << 24 | R << 16 | G << 8 | B).toString(16).slice(1)}`;
    }
    
    // Populate season selector
    async function populateSeasonSelector() {
      try {
        const seasonSelect = document.getElementById('seasonSelect');
        const currentYear = new Date().getFullYear();
        const nextYear = (currentYear + 1).toString().slice(-2);
        currentSeason = `Season${currentYear}-${nextYear}`;
        
        seasonSelect.addEventListener('change', function() {
          currentSeason = this.value;
          loadFixtures();
        });
        
        const teamDoc = await db.collection("GombeTeams").doc(teamId).get();
        if (teamDoc.exists) {
          const teamData = teamDoc.data();
          seasonSelect.innerHTML = `<option value="${currentSeason}" selected>${currentSeason}</option>`;
          if (teamData.seasons && Array.isArray(teamData.seasons)) {
            teamData.seasons.forEach(season => {
              if (season !== currentSeason) {
                seasonSelect.innerHTML += `<option value="${season}">${season}</option>`;
              }
            });
          }
        }
      } catch (error) {
        console.error("Error populating season selector:", error);
      }
    }
    
    // Load Squad
    async function loadSquad() {
      try {
        const squadGrid = document.getElementById('squadGrid');
        squadGrid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading squad...</p></div>';

        const allPlayersSnapshot = await db.collection("playerRegistry").get();
        
        if (allPlayersSnapshot.empty) {
          squadGrid.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> No players found</div>';
          return;
        }

        const teamPlayers = [];
        allPlayersSnapshot.forEach(doc => {
          const player = doc.data();
          if ((player.teamId && player.teamId === currentTeamName) || 
              (player.teamName && player.teamName === currentTeamName)) {
            teamPlayers.push({...player, id: doc.id});
          }
        });

        if (teamPlayers.length === 0) {
          squadGrid.innerHTML = '<div class="error"><i class="fas fa-user-slash"></i> No squad information available</div>';
          return;
        }

        teamPlayers.sort((a, b) => (a.jerseyNumber || 999) - (b.jerseyNumber || 999));

        squadGrid.innerHTML = '';
        teamPlayers.forEach(player => {
          const playerCard = document.createElement('div');
          playerCard.className = 'player-card';
          
          const hasImage = player.imageUrl && player.imageUrl !== 'https://via.placeholder.com/150?text=Player';
          
          playerCard.innerHTML = `
            <div class="player-photo" style="background: linear-gradient(135deg, ${teamColors.home}22, ${teamColors.home}11)">
              ${hasImage ? `<img src="${player.imageUrl}" alt="${player.name}">` : `<i class="fas fa-user player-icon"></i>`}
              <div class="jersey-number" style="background: ${teamColors.home}; border-color: ${teamColors.third}">${player.jerseyNumber || '?'}</div>
            </div>
            <div class="player-details">
              <div class="player-name">${player.name || 'Unknown'}</div>
              <div class="player-position">${player.position || 'N/A'}</div>
            </div>
          `;
          
          playerCard.addEventListener('click', () => {
            alert(`👤 Player: ${player.name || 'Unknown'}\n📋 Position: ${player.position || 'N/A'}\n🔢 Jersey: ${player.jerseyNumber || 'N/A'}\n📍 LGA: ${player.LGAs || 'N/A'}`);
          });
          
          squadGrid.appendChild(playerCard);
        });

      } catch (error) {
        console.error("Error loading squad:", error);
        document.getElementById('squadGrid').innerHTML = '<div class="error">Failed to load squad data</div>';
      }
    }
    
    // Load Fixtures
    async function loadFixtures() {
      try {
        const fixturesList = document.getElementById('fixturesList');
        fixturesList.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading fixtures...</p></div>';
        
        const competitions = [
          "GombeSeason", 
          "GombeChampionsCupMatches", 
          "GombeFAcupsMatch", 
          "GombeWorriorsCupMatches"
        ];
        
        const allFixtures = [];
        
        for (const competition of competitions) {
          try {
            const competitionRef = db.collection(competition).doc(currentTeamName);
            const seasonRef = competitionRef.collection(currentSeason);
            const snapshot = await seasonRef.get();
            
            snapshot.forEach(doc => {
              if (!doc.id.startsWith("_")) {
                const fixture = doc.data();
                fixture.competition = competition;
                fixture.id = doc.id;
                fixture.docPath = doc.ref.path;
                allFixtures.push(fixture);
              }
            });
          } catch (error) {
            // Skip if no fixtures
          }
        }
        
        if (allFixtures.length === 0) {
          fixturesList.innerHTML = `
            <div class="no-fixtures">
              <i class="fas fa-calendar-times"></i>
              <p>No fixtures found for ${currentSeason}</p>
              <p style="font-size:0.9rem; margin-top:10px;">Try selecting a different season</p>
            </div>`;
          return;
        }
        
        // Sort by date
        allFixtures.sort((a, b) => {
          const dateA = a.date ? new Date(a.date) : new Date(0);
          const dateB = b.date ? new Date(b.date) : new Date(0);
          return dateA - dateB;
        });
        
        fixturesList.innerHTML = '';
        allFixtures.forEach(fixture => {
          createFixtureCard(fixture);
        });
        
      } catch (error) {
        console.error("Error loading fixtures:", error);
        document.getElementById('fixturesList').innerHTML = '<div class="error">Failed to load fixtures</div>';
      }
    }
    
    // Create fixture card
    function createFixtureCard(fixture) {
      const isHomeGame = fixture.venue === 'home';
      const opponent = fixture.opponent || 'Unknown';
      const homeTeam = isHomeGame ? currentTeamName : opponent;
      const awayTeam = isHomeGame ? opponent : currentTeamName;
      
      const fixtureDate = fixture.date ? new Date(fixture.date) : null;
      const formattedDate = fixtureDate ? fixtureDate.toLocaleDateString('en-NG', { 
        weekday: 'short', 
        day: 'numeric', 
        month: 'short', 
        year: 'numeric' 
      }) : 'TBD';
      const formattedTime = fixtureDate ? fixtureDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'TBD';
      
      const isCompleted = fixture.matchCompleted === true;
      const isLive = fixture.status === 'live';
      const status = isLive ? 'live' : isCompleted ? 'completed' : 'upcoming';
      const statusText = isLive ? '🔴 Live' : isCompleted ? '✅ Completed' : '📅 Upcoming';
      
      const homeTeamId = teamIdCache[homeTeam] || null;
      const awayTeamId = teamIdCache[awayTeam] || null;
      
      // Determine score
      let score = 'VS';
      let scoreClass = '';
      let homeScore = 0;
      let awayScore = 0;
      
      if (isCompleted) {
        if (isHomeGame) {
          homeScore = fixture.goalScored !== undefined ? fixture.goalScored : 0;
          awayScore = fixture.goalConceded !== undefined ? fixture.goalConceded : 0;
        } else {
          awayScore = fixture.goalScored !== undefined ? fixture.goalScored : 0;
          homeScore = fixture.goalConceded !== undefined ? fixture.goalConceded : 0;
        }
        score = `${homeScore} - ${awayScore}`;
        
        if (homeTeam === currentTeamName) {
          scoreClass = homeScore > awayScore ? 'win' : homeScore < awayScore ? 'loss' : 'draw';
        } else {
          scoreClass = awayScore > homeScore ? 'win' : awayScore < homeScore ? 'loss' : 'draw';
        }
      }
      
      const competitionName = fixture.competition.replace('Gombe', '').replace(/Matches?/g, '').trim() || 'League';
      
      const fixtureCard = document.createElement('div');
      fixtureCard.className = `fixture-card ${status}`;
      
      fixtureCard.innerHTML = `
        <div class="fixture-header">
          <div class="match-date">
            <i class="far fa-calendar-alt"></i>
            ${formattedDate}
            <span class="competition-badge">${competitionName}</span>
          </div>
          <div class="match-status ${status}">${statusText}</div>
        </div>
        
        <div class="fixture-content">
          <div class="team-container">
            <div class="team-name" onclick="event.stopPropagation(); viewTeamProfile('${homeTeamId || ''}', '${homeTeam}')">
              ${homeTeam}
              ${homeTeam === currentTeamName ? ' ⭐' : ''}
            </div>
            <div class="team-meta">
              <i class="fas fa-home"></i> ${isHomeGame ? 'Home' : 'Away'}
            </div>
          </div>
          
          <div class="vs-container">
            <div class="match-score ${scoreClass}">${score}</div>
            <div class="vs-text"><i class="far fa-clock"></i> ${formattedTime}</div>
          </div>
          
          <div class="team-container">
            <div class="team-name" onclick="event.stopPropagation(); viewTeamProfile('${awayTeamId || ''}', '${awayTeam}')">
              ${awayTeam}
              ${awayTeam === currentTeamName ? ' ⭐' : ''}
            </div>
            <div class="team-meta">
              <i class="fas fa-route"></i> ${isHomeGame ? 'Away' : 'Home'}
            </div>
          </div>
        </div>
        
        <div class="fixture-footer">
          <div class="match-info">
            <div class="info-item">
              <i class="fas fa-map-marker-alt"></i>
              ${fixture.venue ? fixture.venue.charAt(0).toUpperCase() + fixture.venue.slice(1) : 'Venue TBD'}
            </div>
            <div class="info-item">
              <i class="fas fa-whistle"></i>
              ${fixture.referee || 'Referee TBD'}
            </div>
          </div>
          
          <button class="tracker-btn" ${isCompleted ? 'disabled' : ''} 
            onclick="event.stopPropagation(); ${isCompleted ? '' : `openMatchTracker('${fixture.id}', '${homeTeam}', '${awayTeam}', '${fixture.competition}', '${fixture.docPath}')`}">
            <i class="fas ${isCompleted ? 'fa-check-circle' : isLive ? 'fa-running' : 'fa-play-circle'}"></i>
            ${isCompleted ? 'Completed' : isLive ? 'Live Tracker' : 'Open Tracker'}
          </button>
        </div>
      `;
      
      // Make card clickable
      fixtureCard.addEventListener('click', () => {
        if (isCompleted) {
          const resultText = scoreClass === 'win' ? '🏆 Win' : scoreClass === 'loss' ? '❌ Loss' : '⚖️ Draw';
          alert(`📋 Match Summary\n\n${homeTeam} ${score} ${awayTeam}\n\n📊 Result: ${resultText}\n🏟️ Competition: ${competitionName}\n📅 Date: ${formattedDate}\n📍 Venue: ${fixture.venue || 'TBD'}\n👨‍⚖️ Referee: ${fixture.referee || 'TBD'}`);
        } else {
          alert(`📋 Match Details\n\n${homeTeam} vs ${awayTeam}\n\n🏟️ Competition: ${competitionName}\n📅 Date: ${formattedDate}\n⏰ Time: ${formattedTime}\n📍 Venue: ${fixture.venue || 'TBD'}\n👨‍⚖️ Referee: ${fixture.referee || 'TBD'}`);
        }
      });
      
      document.getElementById('fixturesList').appendChild(fixtureCard);
    }
    
    // View team profile
    function viewTeamProfile(teamId, teamName) {
      if (teamId) {
        window.location.href = `GombeTeamsProfileFinal.html?teamId=${teamId}`;
      } else if (teamName && teamIdCache[teamName]) {
        window.location.href = `GombeTeamsProfileFinal.html?teamId=${teamIdCache[teamName]}`;
      } else {
        alert(`Team profile for ${teamName} is not available.`);
      }
    }
    
    // Open match tracker
    function openMatchTracker(matchId, homeTeam, awayTeam, competition, docPath) {
      localStorage.setItem('matchTrackerData', JSON.stringify({
        matchId: matchId,
        homeTeam: homeTeam,
        awayTeam: awayTeam,
        competition: competition,
        docPath: docPath,
        timestamp: new Date().toISOString()
      }));
      window.open('MatchTracker.html', '_blank');
    }
    
    // Load Standings
    async function loadStandings() {
      try {
        const standingsTableBody = document.getElementById('standingsTableBody');
        const standingsZoneHeader = document.getElementById('standingsZoneHeader');
        
        standingsTableBody.innerHTML = '<tr><td colspan="10" class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading standings...</p></td></tr>';
        
        let collectionName;
        if (currentTeamTier === "championship") {
          collectionName = "Championship_division";
        } else if (currentTeamTier === "league_phase") {
          collectionName = "league_division";
        } else {
          standingsTableBody.innerHTML = '<tr><td colspan="10"><div class="error">Unknown team tier: ' + currentTeamTier + '</div></td></tr>';
          return;
        }
        
        const divisionDoc = await db.collection(collectionName).doc(currentTeamZone).get();
        
        if (!divisionDoc.exists) {
          standingsTableBody.innerHTML = '<tr><td colspan="10"><div class="error">No standings data available</div></td></tr>';
          return;
        }
        
        const divisionData = divisionDoc.data();
        
        if (!divisionData.teams || !Array.isArray(divisionData.teams) || divisionData.teams.length === 0) {
          standingsTableBody.innerHTML = '<tr><td colspan="10"><div class="error">No teams found in this division</div></td></tr>';
          return;
        }
        
        const tierLabel = currentTeamTier === "championship" ? "🏆 Championship" : "📊 League";
        standingsZoneHeader.innerHTML = `<i class="fas fa-list-ol"></i> ${currentTeamZone} - ${tierLabel} Table`;
        
        const sortedTeams = [...divisionData.teams].sort((a, b) => {
          if (b.points !== a.points) return b.points - a.points;
          return b.GD - a.GD;
        });
        
        standingsTableBody.innerHTML = '';
        
        sortedTeams.forEach((team, index) => {
          const position = index + 1;
          let rowClass = '';
          
          if (position <= 8) rowClass = 'champions-league';
          else if (position <= 16) rowClass = 'warriors-cup';
          else if (position > sortedTeams.length - 3) rowClass = 'relegated';
          
          if (team.name === currentTeamName) rowClass += ' current-team';
          
          const teamId = teamIdCache[team.name] || '';
          
          const row = document.createElement('tr');
          row.className = rowClass;
          
          row.innerHTML = `
            <td class="position">${position}</td>
            <td class="team-name" onclick="viewTeamProfile('${teamId}', '${team.name}')">${team.name}</td>
            <td class="stats">${team.M || 0}</td>
            <td class="stats">${team.W || 0}</td>
            <td class="stats">${team.D || 0}</td>
            <td class="stats">${team.L || 0}</td>
            <td class="stats">${team.GS || 0}</td>
            <td class="stats">${team.GA || 0}</td>
            <td class="stats">${team.GD || 0}</td>
            <td class="stats">${team.points || 0}</td>
          `;
          standingsTableBody.appendChild(row);
        });
        
      } catch (error) {
        console.error("Error loading standings:", error);
        document.getElementById('standingsTableBody').innerHTML = '<tr><td colspan="10" class="error">Failed to load standings</td></tr>';
      }
    }
    
    // Highlight qualification zone
    function highlightQualificationZone(zoneClass) {
      const rows = document.querySelectorAll('#standingsTableBody tr');
      rows.forEach(row => {
        row.style.opacity = '1';
        row.style.transform = 'scale(1)';
      });
      
      rows.forEach(row => {
        if (row.classList.contains(zoneClass)) {
          row.style.opacity = '1';
          row.style.transform = 'scale(1.03)';
          row.style.transition = 'all 0.3s ease';
          row.style.boxShadow = '0 4px 20px rgba(0,0,0,0.1)';
        } else {
          row.style.opacity = '0.5';
        }
      });
      
      setTimeout(() => {
        rows.forEach(row => {
          row.style.opacity = '1';
          row.style.transform = 'scale(1)';
          row.style.boxShadow = 'none';
        });
      }, 3000);
    }
    
    // Update SEO meta tags
    function updateSEO() {
      const teamName = document.getElementById('teamName').textContent;
      const title = `${teamName} - Gombe State Football Team Profile`;
      const description = `View ${teamName}'s complete profile including fixtures, squad, and league standings. ${teamName} is a football team from Gombe State, Nigeria.`;
      
      document.title = title;
      document.getElementById('metaDescription').content = description;
      document.getElementById('ogTitle').content = title;
      document.getElementById('ogDescription').content = description;
      
      // Update canonical URL with team ID
      const canonical = document.querySelector('link[rel="canonical"]');
      if (canonical) {
        canonical.href = `https://gombefootball.web.app/GombeTeamsProfileFinal.html?teamId=${teamId}`;
      }
    }
    
    // Show error message
    function showError(message) {
      const container = document.querySelector('.container');
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error';
      errorDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
      container.prepend(errorDiv);
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
