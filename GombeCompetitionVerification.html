<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gombe · Competition Verification</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,system-ui,sans-serif; }
    body {
      background: linear-gradient(145deg, #edf3ed 0%, #dce8dc 100%);
      min-height: 100vh;
      padding: 30px 20px;
    }
    .wrapper {
      max-width: 1300px;
      margin: 0 auto;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(6px);
      border-radius: 48px;
      padding: 2rem 2.2rem 2.5rem;
      box-shadow: 0 25px 50px rgba(0,30,10,0.2);
      border:1px solid rgba(255,255,255,0.4);
    }
    h1 {
      font-weight:700; font-size:2.2rem; color:#014421;
      display:flex; align-items:center; gap:14px;
      border-bottom:3px solid #ffd700; padding-bottom:16px; margin-bottom:28px;
    }
    h1 i { color:#ffd700; }
    .subhead {
      display:flex; flex-wrap:wrap; gap:12px 20px;
      background:#e9f3e9; padding:1.2rem 1.8rem; border-radius:60px;
      margin-bottom:28px; align-items:center; border:1px solid #bcd0bc;
    }
    .subhead .badge-count {
      background:#014421; color:white; padding:4px 20px; border-radius:40px;
      font-weight:600; font-size:0.9rem;
    }
    .controls {
      display:flex; flex-wrap:wrap; gap:16px;
      background:white; padding:1.2rem 1.8rem; border-radius:40px;
      margin-bottom:30px; border:1px solid #cfe0cf; align-items:center;
    }
    .controls .filter-group {
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    }
    .controls select, .controls input {
      background:#f5faf5; border:1px solid #b8d0b8; border-radius:60px;
      padding:10px 20px; font-size:0.95rem; outline:none;
    }
    .controls select:focus, .controls input:focus {
      border-color:#014421; box-shadow:0 0 0 3px rgba(1,68,33,0.2);
    }
    .btn-refresh {
      background:#014421; border:none; border-radius:60px;
      padding:10px 28px; font-weight:700; color:white;
      cursor:pointer; transition:0.15s; display:inline-flex; align-items:center; gap:8px;
    }
    .btn-refresh:hover { background:#00351a; }
    .competition-grid {
      display:grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap:24px; margin-top:10px;
    }
    .comp-card {
      background:white; border-radius:32px; padding:1.5rem 1.5rem 1.8rem;
      border:1px solid #cadeca; box-shadow:0 6px 16px rgba(0,20,0,0.04);
      transition:0.2s; position:relative;
    }
    .comp-card:hover { box-shadow:0 8px 24px rgba(0,20,0,0.08); transform:translateY(-2px); }
    .comp-card .status-badge {
      position:absolute; top:16px; right:16px;
      padding:4px 16px; border-radius:40px; font-size:0.75rem; font-weight:700;
      text-transform:uppercase;
    }
    .status-badge.pending { background:#fef3c7; color:#92400e; }
    .status-badge.verified { background:#d1fae5; color:#065f46; }
    .status-badge.rejected { background:#fee2e2; color:#991b1b; }
    .comp-card h3 {
      font-size:1.3rem; color:#014421; margin-bottom:6px;
      padding-right:80px;
    }
    .comp-card .meta {
      display:flex; flex-wrap:wrap; gap:8px 16px;
      font-size:0.85rem; color:#2d5a2d; margin:8px 0 12px;
      border-bottom:1px solid #ecf3ec; padding-bottom:12px;
    }
    .comp-card .meta span { background:#ecf6ec; padding:2px 14px; border-radius:40px; }
    .comp-card .teams-list {
      display:flex; flex-wrap:wrap; gap:4px 8px; margin:10px 0 14px;
    }
    .comp-card .teams-list .team-tag {
      background:#e9f3e9; padding:2px 12px; border-radius:30px;
      font-size:0.8rem; border:1px solid #d0e5d0;
    }
    .comp-card .actions {
      display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;
    }
    .comp-card .actions button {
      border:none; border-radius:40px; padding:8px 20px;
      font-weight:600; cursor:pointer; transition:0.15s;
      display:inline-flex; align-items:center; gap:6px;
    }
    .btn-verify { background:#014421; color:white; }
    .btn-verify:hover { background:#00351a; }
    .btn-reject { background:#b91c1c; color:white; }
    .btn-reject:hover { background:#991b1b; }
    .btn-reset { background:#e5e7eb; color:#1f2937; }
    .btn-reset:hover { background:#d1d5db; }
    .btn-whatsapp { background:#25D366; color:white; }
    .btn-whatsapp:hover { background:#1da851; }
    .btn-disabled { opacity:0.6; cursor:not-allowed; pointer-events:none; }
    .empty-note {
      color:#3f663f; opacity:0.6; font-style:italic;
      padding:40px 0; text-align:center; grid-column:1/-1;
    }
    /* Modal */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.4);
      backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center;
      z-index:1000;
    }
    .modal-overlay.show { display:flex; }
    .modal {
      background:white; border-radius:40px; padding:2rem 2.2rem; max-width:480px; width:90%;
      box-shadow:0 30px 60px rgba(0,0,0,0.3);
    }
    .modal h3 { color:#014421; margin-bottom:8px; }
    .modal p { color:#2d5a2d; margin-bottom:16px; }
    .modal .field-group { margin-bottom:14px; }
    .modal .field-group label { display:block; font-weight:600; font-size:0.85rem; color:#1f4a1f; margin-bottom:4px; }
    .modal .field-group input, .modal .field-group textarea {
      width:100%; padding:10px 16px; border-radius:60px;
      border:1px solid #b8d0b8; background:#f5faf5; font-size:0.95rem;
      outline:none; transition:0.15s;
    }
    .modal .field-group textarea { border-radius:20px; resize:vertical; min-height:70px; }
    .modal .field-group input:focus, .modal .field-group textarea:focus {
      border-color:#014421; box-shadow:0 0 0 3px rgba(1,68,33,0.2);
    }
    .modal .actions { display:flex; gap:12px; margin-top:18px; justify-content:flex-end; }
    .modal .actions button { padding:10px 28px; border:none; border-radius:60px; font-weight:700; cursor:pointer; }
    .modal .actions .btn-cancel { background:#e5e7eb; color:#1f2937; }
    .modal .actions .btn-cancel:hover { background:#d1d5db; }
    .modal .actions .btn-confirm { background:#014421; color:white; }
    .modal .actions .btn-confirm:hover { background:#00351a; }
    .toast {
      position:fixed; bottom:30px; right:30px;
      background:#014421; color:white; padding:16px 28px;
      border-radius:60px; box-shadow:0 10px 30px rgba(0,0,0,0.2);
      font-weight:600; z-index:999; border-left:5px solid #ffd700;
      transform:translateY(100px); opacity:0; transition:0.4s ease;
    }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.error { background:#a13030; border-left-color:#ff6b6b; }
    @media (max-width:600px) {
      .wrapper { padding:1.2rem; }
      .competition-grid { grid-template-columns:1fr; }
      .controls { flex-direction:column; align-items:stretch; }
      .modal { padding:1.5rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <h1><i class="fas fa-check-double"></i> Competition Verification</h1>
  <div class="subhead">
    <span><i class="fas fa-database"></i> OtherCompetitions</span>
    <span class="badge-count" id="compCountBadge">0 competitions</span>
    <span style="margin-left:auto; font-size:0.9rem; opacity:0.7;"><i class="fas fa-sync-alt fa-fw"></i> live</span>
  </div>

  <div class="controls">
    <div class="filter-group">
      <label><i class="fas fa-filter"></i> Status:</label>
      <select id="statusFilter" onchange="loadCompetitions()">
        <option value="all">All</option>
        <option value="pending">Pending</option>
        <option value="verified">Verified</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>
    <div style="flex:1;"></div>
    <button class="btn-refresh" onclick="loadCompetitions()"><i class="fas fa-sync-alt"></i> Refresh</button>
  </div>

  <div id="competitionContainer" class="competition-grid">
    <div class="empty-note">Loading competitions...</div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent">
    <h3 id="modalTitle">Action</h3>
    <p id="modalDesc">Please provide details</p>
    <div id="modalFields"></div>
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" id="modalConfirmBtn">Confirm</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
  // ---------- FIREBASE ----------
  const firebaseConfig = {
    apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
    authDomain: "gombefootball.firebaseapp.com",
    databaseURL: "https://gombefootball-default-rtdb.firebaseio.com",
    projectId: "gombefootball",
    storageBucket: "gombefootball.firebasestorage.app",
    messagingSenderId: "120731655706",
    appId: "1:120731655706:web:9c99d6831aca3df563bba3",
    measurementId: "G-8SCVPBSKPG"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ---------- GLOBAL ----------
  let allCompetitions = [];
  let pendingAction = null; // { compId, action, comp }

  // ---------- TOAST ----------
  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), 4000);
  }

  // ---------- MODAL ----------
  function openModal(title, desc, fieldsHtml, confirmText, onConfirm) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalDesc').textContent = desc;
    document.getElementById('modalFields').innerHTML = fieldsHtml;
    document.getElementById('modalConfirmBtn').textContent = confirmText || 'Confirm';
    document.getElementById('modalOverlay').classList.add('show');
    // Store confirm callback
    document.getElementById('modalConfirmBtn').onclick = onConfirm;
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    pendingAction = null;
  }

  // Close on overlay click
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });

  // ---------- LOAD COMPETITIONS ----------
  async function loadCompetitions() {
    const container = document.getElementById('competitionContainer');
    const statusFilter = document.getElementById('statusFilter').value;

    try {
      const snapshot = await db.collection('OtherCompetitions').get();
      allCompetitions = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        allCompetitions.push({
          id: doc.id,
          ...data,
          verificationStatus: data.verificationStatus || 'pending'
        });
      });

      let filtered = allCompetitions;
      if (statusFilter !== 'all') {
        filtered = allCompetitions.filter(c => c.verificationStatus === statusFilter);
      }

      document.getElementById('compCountBadge').textContent = filtered.length + ' competitions';

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-note">${allCompetitions.length === 0 ? 'No competitions found in OtherCompetitions.' : 'No competitions with this status.'}</div>`;
        return;
      }

      container.innerHTML = '';
      filtered.forEach(comp => {
        const card = document.createElement('div');
        card.className = 'comp-card';

        const statusClass = comp.verificationStatus === 'verified' ? 'verified' :
                           comp.verificationStatus === 'rejected' ? 'rejected' : 'pending';
        const statusLabel = comp.verificationStatus.toUpperCase();

        let teamsHtml = '';
        if (comp.teams && Array.isArray(comp.teams)) {
          comp.teams.forEach(t => {
            teamsHtml += `<span class="team-tag">${t.name || t.id || 'Unknown'}</span>`;
          });
        }

        // Build action buttons based on status
        let actionsHtml = '';
        const phone = comp.organizerPhone || '';
        const compName = comp.competitionName || comp.id || 'Competition';

        if (comp.verificationStatus === 'pending') {
          actionsHtml = `
            <button class="btn-verify" onclick="openVerifyModal('${comp.id}')">
              <i class="fas fa-check"></i> Verify
            </button>
            <button class="btn-reject" onclick="openRejectModal('${comp.id}')">
              <i class="fas fa-times"></i> Reject
            </button>
          `;
        } else if (comp.verificationStatus === 'rejected') {
          actionsHtml = `
            <button class="btn-verify" onclick="openVerifyModal('${comp.id}')">
              <i class="fas fa-check"></i> Verify
            </button>
            <button class="btn-reset" onclick="updateStatus('${comp.id}', 'pending')">
              <i class="fas fa-undo"></i> Reset
            </button>
          `;
        } else if (comp.verificationStatus === 'verified') {
          // Show only WhatsApp button if phone exists
          if (phone) {
            actionsHtml = `
              <button class="btn-whatsapp" onclick="sendWhatsApp('${comp.id}')">
                <i class="fab fa-whatsapp"></i> WhatsApp
              </button>
            `;
          } else {
            actionsHtml = `<span style="font-size:0.8rem;opacity:0.6;">No phone number</span>`;
          }
        }

        card.innerHTML = `
          <div class="status-badge ${statusClass}">${statusLabel}</div>
          <h3>${comp.competitionName || comp.id || 'Unnamed'}</h3>
          <div class="meta">
            <span><i class="fas fa-calendar"></i> ${comp.seasonYear || 'N/A'}</span>
            <span><i class="fas fa-list-ul"></i> ${comp.format || 'N/A'}</span>
            <span><i class="fas fa-clock"></i> ${comp.periodWeeks || 'N/A'} weeks</span>
            <span><i class="fas fa-phone"></i> ${phone || 'N/A'}</span>
            <span><i class="fas fa-users"></i> ${comp.teams ? comp.teams.length : 0} teams</span>
          </div>
          <div class="teams-list">${teamsHtml || '<span style="opacity:0.5;">No teams listed</span>'}</div>
          <div class="actions">${actionsHtml}</div>
        `;
        container.appendChild(card);
      });

    } catch (e) {
      console.error('Error loading competitions:', e);
      container.innerHTML = `<div class="empty-note">⚠️ Error loading: ${e.message}</div>`;
      showToast('Error loading competitions: ' + e.message, true);
    }
  }

  // ---------- VERIFY MODAL ----------
  function openVerifyModal(compId) {
    const comp = allCompetitions.find(c => c.id === compId);
    if (!comp) return;
    const phone = comp.organizerPhone || '';
    if (!phone) {
      showToast('No phone number available for this competition.', true);
      return;
    }

    const fieldsHtml = `
      <div class="field-group">
        <label>Account Name</label>
        <input type="text" id="accountName" placeholder="e.g. Gombe Football Association" value="Gombe Football Association" />
      </div>
      <div class="field-group">
        <label>Account Number</label>
        <input type="text" id="accountNumber" placeholder="e.g. 0123456789" value="0123456789" />
      </div>
      <div class="field-group">
        <label>Bank Name</label>
        <input type="text" id="bankName" placeholder="e.g. GTBank" value="GTBank" />
      </div>
    `;

    openModal(
      'Verify Competition',
      `Send WhatsApp verification message to ${phone} with payment details.`,
      fieldsHtml,
      'Send & Verify',
      async () => {
        const accountName = document.getElementById('accountName').value.trim() || 'Gombe FA';
        const accountNumber = document.getElementById('accountNumber').value.trim() || '0123456789';
        const bankName = document.getElementById('bankName').value.trim() || 'GTBank';
        await performVerify(compId, phone, accountName, accountNumber, bankName);
        closeModal();
      }
    );
  }

  // ---------- REJECT MODAL ----------
  function openRejectModal(compId) {
    const comp = allCompetitions.find(c => c.id === compId);
    if (!comp) return;
    const phone = comp.organizerPhone || '';
    if (!phone) {
      showToast('No phone number available for this competition.', true);
      return;
    }

    const fieldsHtml = `
      <div class="field-group">
        <label>Rejection Reason</label>
        <textarea id="rejectReason" placeholder="Explain why this competition is rejected...">Incomplete documentation. Please submit the required paperwork.</textarea>
      </div>
    `;

    openModal(
      'Reject Competition',
      `Send WhatsApp rejection message to ${phone}`,
      fieldsHtml,
      'Send & Reject',
      async () => {
        const reason = document.getElementById('rejectReason').value.trim() || 'No reason provided.';
        await performReject(compId, phone, reason);
        closeModal();
      }
    );
  }

  // ---------- PERFORM VERIFY ----------
  async function performVerify(compId, phone, accountName, accountNumber, bankName) {
    try {
      // Update status to verified
      await db.collection('OtherCompetitions').doc(compId).update({
        verificationStatus: 'verified',
        verifiedAt: firebase.firestore.FieldValue.serverTimestamp(),
        accountName: accountName,
        accountNumber: accountNumber,
        bankName: bankName
      });

      // Also update CompetitionsRecords if exists
      const comp = allCompetitions.find(c => c.id === compId);
      if (comp && comp.competitionName) {
        try {
          const snapshot = await db.collection('CompetitionsRecords')
            .where('name', '==', comp.competitionName)
            .get();
          snapshot.forEach(doc => {
            db.collection('CompetitionsRecords').doc(doc.id).update({
              verificationStatus: 'verified',
              verifiedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          });
        } catch (e) { /* ignore */ }
      }

      // Send WhatsApp message
      const message = encodeURIComponent(
        `✅ *COMPETITION VERIFIED* ✅\n\n` +
        `Dear Organizer,\n\n` +
        `Your competition "${comp?.competitionName || compId}" has been successfully verified.\n\n` +
        `🔹 *Payment Details to Access Dashboard:*\n` +
        `Account Name: ${accountName}\n` +
        `Account Number: ${accountNumber}\n` +
        `Bank: ${bankName}\n\n` +
        `📌 Please make the payment to activate your competition handle.\n\n` +
        `Thank you for using Gombe Football.`
      );

      const waUrl = `https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${message}`;
      window.open(waUrl, '_blank');

      showToast(`✅ Competition "${compId}" verified! WhatsApp opened.`);
      loadCompetitions();

    } catch (e) {
      console.error('Error verifying:', e);
      showToast('❌ Error: ' + e.message, true);
    }
  }

  // ---------- PERFORM REJECT ----------
  async function performReject(compId, phone, reason) {
    try {
      await db.collection('OtherCompetitions').doc(compId).update({
        verificationStatus: 'rejected',
        rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
        rejectionReason: reason
      });

      const comp = allCompetitions.find(c => c.id === compId);
      if (comp && comp.competitionName) {
        try {
          const snapshot = await db.collection('CompetitionsRecords')
            .where('name', '==', comp.competitionName)
            .get();
          snapshot.forEach(doc => {
            db.collection('CompetitionsRecords').doc(doc.id).update({
              verificationStatus: 'rejected',
              rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
              rejectionReason: reason
            });
          });
        } catch (e) { /* ignore */ }
      }

      const message = encodeURIComponent(
        `❌ *COMPETITION REJECTED* ❌\n\n` +
        `Dear Organizer,\n\n` +
        `Your competition "${comp?.competitionName || compId}" has been rejected.\n\n` +
        `📌 *Reason:*\n${reason}\n\n` +
        `Please address the issues and resubmit.\n\n` +
        `Thank you for using Gombe Football.`
      );

      const waUrl = `https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${message}`;
      window.open(waUrl, '_blank');

      showToast(`❌ Competition "${compId}" rejected. WhatsApp opened.`);
      loadCompetitions();

    } catch (e) {
      console.error('Error rejecting:', e);
      showToast('❌ Error: ' + e.message, true);
    }
  }

  // ---------- UPDATE STATUS (reset) ----------
  async function updateStatus(compId, newStatus) {
    try {
      await db.collection('OtherCompetitions').doc(compId).update({
        verificationStatus: newStatus
      });

      const comp = allCompetitions.find(c => c.id === compId);
      if (comp && comp.competitionName) {
        try {
          const snapshot = await db.collection('CompetitionsRecords')
            .where('name', '==', comp.competitionName)
            .get();
          snapshot.forEach(doc => {
            db.collection('CompetitionsRecords').doc(doc.id).update({
              verificationStatus: newStatus
            });
          });
        } catch (e) { /* ignore */ }
      }

      showToast(`✅ Competition "${compId}" reset to ${newStatus}`);
      loadCompetitions();

    } catch (e) {
      console.error('Error updating status:', e);
      showToast('❌ Error updating status: ' + e.message, true);
    }
  }

  // ---------- WHATSAPP (for verified) ----------
  function sendWhatsApp(compId) {
    const comp = allCompetitions.find(c => c.id === compId);
    if (!comp) return;
    const phone = comp.organizerPhone || '';
    if (!phone) {
      showToast('No phone number available.', true);
      return;
    }

    const message = encodeURIComponent(
      `🏆 *COMPETITION DASHBOARD ACCESS* 🏆\n\n` +
      `Dear Organizer,\n\n` +
      `Your competition "${comp.competitionName || compId}" is verified.\n\n` +
      `🔹 You can now access your dashboard using the credentials provided.\n\n` +
      `Thank you for using Gombe Football.`
    );

    const waUrl = `https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${message}`;
    window.open(waUrl, '_blank');
  }

  // ---------- AUTO LOAD ----------
  document.addEventListener('DOMContentLoaded', () => {
    loadCompetitions();
  });
</script>
</body>
</html>
