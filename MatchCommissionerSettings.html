<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Gombe Football</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #014421, #3a7d44);
      min-height: 100vh;
      color: #333;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    header {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .profile-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .profile-pic {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #014421;
      overflow: hidden;
      position: relative;
    }
    
    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .profile-text h1 {
      color: #014421;
      margin-bottom: 5px;
    }
    
    .profile-text p {
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logout-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logout-btn:hover {
      background: #c0392b;
    }
    
    .main-content {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 25px;
    }
    
    @media (max-width: 768px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }
    
    /* Sidebar */
    .sidebar {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .sidebar-menu {
      list-style: none;
    }
    
    .sidebar-menu li {
      margin-bottom: 15px;
    }
    
    .sidebar-menu a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 15px;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    
    .sidebar-menu a:hover, .sidebar-menu a.active {
      background: #e3f2fd;
      color: #014421;
    }
    
    .sidebar-menu i {
      width: 20px;
      text-align: center;
    }
    
    /* Settings Content */
    .settings {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .section-title {
      color: #014421;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* Form Styles */
    .settings-form {
      max-width: 700px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    
    .form-control:focus {
      outline: none;
      border-color: #014421;
      box-shadow: 0 0 0 2px rgba(1, 68, 33, 0.2);
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    
    @media (max-width: 576px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
    
    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }
    
    .btn {
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #014421;
      color: white;
    }
    
    .btn-primary:hover {
      background: #01311a;
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    /* Profile Picture Upload */
    .profile-pic-upload {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .upload-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .upload-btn {
      padding: 8px 15px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .upload-btn:hover {
      background: #e0e0e0;
    }
    
    /* Alert Messages */
    .alert {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }
    
    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header with Profile Info -->
    <header>
      <div class="profile-info">
        <div class="profile-pic" id="profile-pic">
          <i class="fas fa-user"></i>
        </div>
        <div class="profile-text">
          <h1 id="commissioner-name">Loading...</h1>
          <p><i class="fas fa-id-card"></i> <span id="commissioner-psn">PSN: -</span></p>
          <p><i class="fas fa-map-marker-alt"></i> <span id="commissioner-zone">Zone: -</span></p>
        </div>
      </div>
      <button class="logout-btn" id="logout-btn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </header>
    
    <div class="main-content">
      <!-- Sidebar -->
      <div class="sidebar">
        <ul class="sidebar-menu">
          <li><a href="MatchCommissionerProfile.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li><a href="MatchCommissionerAssignedMatches.html"><i class="fas fa-calendar-alt"></i> Matches Assigned</a></li>
          <li><a href="MatchCommissionerReports.html"><i class="fas fa-file-alt"></i> Reports</a></li>
          <li><a href="#" class="active"><i class="fas fa-cog"></i> Settings</a></li>
          <li><a href="MatchCommissionerAssignedMatchesCups.html"><i class="fas fa-trophy"></i> Cups Matches</a></li>
        </ul>
      </div>
      
      <!-- Settings Content -->
      <div class="settings">
        <h2 class="section-title"><i class="fas fa-cog"></i> Profile Settings</h2>
        
        <!-- Alert Messages -->
        <div class="alert alert-success" id="success-alert">
          <i class="fas fa-check-circle"></i> Profile updated successfully!
        </div>
        
        <div class="alert alert-error" id="error-alert">
          <i class="fas fa-exclamation-circle"></i> <span id="error-message">Error updating profile</span>
        </div>
        
        <!-- Profile Picture Upload -->
        <div class="profile-pic-upload">
          <div class="profile-pic" id="profile-pic-preview">
            <i class="fas fa-user"></i>
          </div>
          <div class="upload-controls">
            <input type="file" id="profile-image-upload" accept="image/*" style="display: none;">
            <button class="upload-btn" id="upload-trigger">
              <i class="fas fa-upload"></i> Upload Photo
            </button>
            <small>Max file size: 2MB (JPG, PNG)</small>
          </div>
        </div>
        
        <!-- Settings Form -->
        <form class="settings-form" id="profile-form">
          <div class="form-row">
            <div class="form-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" class="form-control" required>
            </div>
            
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" class="form-control" required>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="zone">Zone</label>
              <select id="zone" class="form-control" required>
                <option value="">Select Zone</option>
                <option value="Central Zone">Central Zone</option>
                <option value="Northern Zone">Northern Zone</option>
                <option value="Southern Zone">Southern Zone</option>
                <option value="Eastern Zone">Eastern Zone</option>
                <option value="Western Zone">Western Zone</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="lga">LGA</label>
              <select id="lga" class="form-control" required>
                <option value="">Select LGA</option>
                <option value="Akko">Akko</option>
                <option value="Balanga">Balanga</option>
                <option value="Billiri">Billiri</option>
                <option value="Dukku">Dukku</option>
                <option value="Funakaye">Funakaye</option>
                <option value="Gombe">Gombe</option>
                <option value="Kaltungo">Kaltungo</option>
                <option value="Kwami">Kwami</option>
                <option value="Nafada">Nafada</option>
                <option value="Shongom">Shongom</option>
                <option value="Yamaltu Deba">Yamaltu Deba</option>
              </select>
            </div>
          </div>
          
          <div class="form-group">
            <label for="league">League</label>
            <select id="league" class="form-control" required>
              <option value="">Select League</option>
              <option value="Gombe State League">Gombe State League</option>
              <option value="Gombe FA Cup">Gombe FA Cup</option>
              <option value="Gombe Youth League">Gombe Youth League</option>
              <option value="Gombe Women League">Gombe Women League</option>
            </select>
          </div>
          
          <div class="btn-group">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Save Changes
            </button>
            <button type="button" class="btn btn-secondary" id="cancel-btn">
              <i class="fas fa-times"></i> Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-storage-compat.js"></script>
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
      authDomain: "gombefootball.firebaseapp.com",
      projectId: "gombefootball"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
    
    // DOM Elements
    const commissionerNameElement = document.getElementById('commissioner-name');
    const commissionerPsnElement = document.getElementById('commissioner-psn');
    const commissionerZoneElement = document.getElementById('commissioner-zone');
    const profilePicElement = document.getElementById('profile-pic');
    const profilePicPreviewElement = document.getElementById('profile-pic-preview');
    const logoutButton = document.getElementById('logout-btn');
    const profileForm = document.getElementById('profile-form');
    const cancelButton = document.getElementById('cancel-btn');
    const uploadTrigger = document.getElementById('upload-trigger');
    const imageUpload = document.getElementById('profile-image-upload');
    const successAlert = document.getElementById('success-alert');
    const errorAlert = document.getElementById('error-alert');
    const errorMessage = document.getElementById('error-message');
    
    // Form fields
    const nameField = document.getElementById('name');
    const phoneField = document.getElementById('phone');
    const zoneField = document.getElementById('zone');
    const lgaField = document.getElementById('lga');
    const leagueField = document.getElementById('league');
    
    // Get commissioner data from localStorage
    const commissionerPsn = localStorage.getItem("commissionerPSN");
    const commissionerName = localStorage.getItem("commissionerName");
    const commissionerZone = localStorage.getItem("commissionerZone");
    
    // Load commissioner profile
    function loadProfile() {
      if (!commissionerPsn) {
        window.location.href = "MatchCommissionerLogin.html";
        return;
      }
      
      // Display basic info
      commissionerNameElement.textContent = commissionerName || "Commissioner";
      commissionerPsnElement.textContent = `PSN: ${commissionerPsn}`;
      commissionerZoneElement.textContent = `Zone: ${commissionerZone}`;
      
      // Load commissioner details from Firestore
      db.collection("MatchCommissioners").doc(commissionerPsn).get()
        .then((doc) => {
          if (doc.exists) {
            const data = doc.data();
            
            // Populate form fields
            nameField.value = data.name || "";
            phoneField.value = data.phone || "";
            zoneField.value = data.zone || "";
            lgaField.value = data.lga || "";
            leagueField.value = data.league || "";
            
            // Update profile picture if available
            if (data.imageUrl) {
              profilePicElement.innerHTML = `<img src="${data.imageUrl}" alt="Profile Picture">`;
              profilePicPreviewElement.innerHTML = `<img src="${data.imageUrl}" alt="Profile Picture">`;
            }
          }
        })
        .catch((error) => {
          console.error("Error loading commissioner data:", error);
          showError("Error loading profile data. Please try again.");
        });
    }
    
    // Handle form submission
    profileForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Get form values
      const updatedData = {
        name: nameField.value,
        phone: phoneField.value,
        zone: zoneField.value,
        lga: lgaField.value,
        league: leagueField.value,
        lastUpdated: new Date()
      };
      
      // Update Firestore document
      db.collection("MatchCommissioners").doc(commissionerPsn).update(updatedData)
        .then(() => {
          // Update localStorage
          localStorage.setItem("commissionerName", updatedData.name);
          localStorage.setItem("commissionerZone", updatedData.zone);
          
          // Update header
          commissionerNameElement.textContent = updatedData.name;
          commissionerZoneElement.textContent = `Zone: ${updatedData.zone}`;
          
          showSuccess("Profile updated successfully!");
        })
        .catch((error) => {
          console.error("Error updating profile:", error);
          showError("Error updating profile. Please try again.");
        });
    });
    
    // Handle image upload
    uploadTrigger.addEventListener('click', function() {
      imageUpload.click();
    });
    
    imageUpload.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      // Check file size (max 2MB)
      if (file.size > 2 * 1024 * 1024) {
        showError("File size must be less than 2MB");
        return;
      }
      
      // Check file type
      if (!file.type.match('image/jpeg') && !file.type.match('image/png')) {
        showError("Only JPG and PNG files are allowed");
        return;
      }
      
      // Upload to Firebase Storage
      const storageRef = storage.ref().child(`commissioner-profiles/${commissionerPsn}/${file.name}`);
      const uploadTask = storageRef.put(file);
      
      uploadTask.on('state_changed', 
        (snapshot) => {
          // Progress monitoring can be added here
        }, 
        (error) => {
          console.error("Upload error:", error);
          showError("Error uploading image. Please try again.");
        }, 
        () => {
          // Upload completed successfully
          uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
            // Update Firestore with new image URL
            db.collection("MatchCommissioners").doc(commissionerPsn).update({
              imageUrl: downloadURL
            })
            .then(() => {
              // Update profile pictures
              profilePicElement.innerHTML = `<img src="${downloadURL}" alt="Profile Picture">`;
              profilePicPreviewElement.innerHTML = `<img src="${downloadURL}" alt="Profile Picture">`;
              showSuccess("Profile picture updated successfully!");
            })
            .catch((error) => {
              console.error("Error updating image URL:", error);
              showError("Error updating profile. Please try again.");
            });
          });
        }
      );
    });
    
    // Cancel button
    cancelButton.addEventListener('click', function() {
      // Reload original data
      loadProfile();
    });
    
    // Logout function
    function logout() {
      localStorage.removeItem("commissionerPSN");
      localStorage.removeItem("commissionerName");
      localStorage.removeItem("commissionerZone");
      window.location.href = "MatchCommissionerLogin.html";
    }
    
    // Show success message
    function showSuccess(message) {
      successAlert.style.display = 'block';
      errorAlert.style.display = 'none';
      
      // Hide after 3 seconds
      setTimeout(() => {
        successAlert.style.display = 'none';
      }, 3000);
    }
    
    // Show error message
    function showError(message) {
      errorMessage.textContent = message;
      errorAlert.style.display = 'block';
      successAlert.style.display = 'none';
      
      // Hide after 5 seconds
      setTimeout(() => {
        errorAlert.style.display = 'none';
      }, 5000);
    }
    
    // Event listeners
    logoutButton.addEventListener('click', logout);
    
    // Initialize the page
    loadProfile();
  </script>
</body>
</html>
