<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Profile | Gombe Football Association</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #1a2a6c;
            --secondary: #3494e6;
            --accent: #fdbb2d;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --info: #17a2b8;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --card-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        body {
            background: linear-gradient(135deg, #f0f5ff, #e6f0ff);
            color: #333;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
        }
        
        .header-info h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .header-info p {
            color: var(--gray);
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-secondary {
            background-color: var(--secondary);
            color: white;
        }
        
        .btn-success {
            background-color: var(--success);
            color: white;
        }
        
        .btn-danger {
            background-color: var(--danger);
            color: white;
        }
        
        .btn-warning {
            background-color: var(--warning);
            color: white;
        }
        
        .btn-info {
            background-color: var(--info);
            color: white;
        }
        
        .btn-block {
            display: block;
            width: 100%;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .agent-details {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .agent-detail-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
        }
        
        .agent-detail-label {
            font-size: 0.8rem;
            color: var(--gray);
            margin-bottom: 5px;
        }
        
        .agent-detail-value {
            font-weight: 600;
            color: var(--primary);
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }
        
        .tab {
            padding: 15px 25px;
            cursor: pointer;
            font-weight: 600;
            color: var(--gray);
            transition: all 0.3s ease;
            text-align: center;
            flex: 1;
        }
        
        .tab.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            background: rgba(52, 148, 230, 0.1);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .card-header {
            background: linear-gradient(to right, var(--secondary), var(--primary));
            color: white;
            padding: 20px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-body {
            padding: 30px;
        }
        
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .player-card {
            border: 1px solid var(--light-gray);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .player-image {
            height: 200px;
            background-color: var(--light-gray);
            background-size: cover;
            background-position: center;
        }
        
        .player-info {
            padding: 15px;
        }
        
        .player-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary);
        }
        
        .player-details {
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        .contract-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .contract-permanent {
            background-color: rgba(39, 174, 96, 0.1);
            color: var(--success);
        }
        
        .contract-loan {
            background-color: rgba(52, 148, 230, 0.1);
            color: var(--secondary);
        }
        
        .sold-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--danger);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .player-actions {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        
        .player-action-btn {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            border: none;
            cursor: pointer;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .modal-content {
            background: white;
            margin: 50px auto;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            animation: modalFade 0.3s;
        }
        
        @keyframes modalFade {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-header {
            background: linear-gradient(to right, var(--secondary), var(--primary));
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            font-size: 1.5rem;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .modal-body {
            padding: 30px;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-item {
            background: var(--light);
            padding: 15px;
            border-radius: 8px;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: var(--gray);
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-weight: 600;
            color: var(--primary);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--light-gray);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(52, 148, 230, 0.2);
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-success {
            background-color: rgba(39, 174, 96, 0.1);
            color: var(--success);
            border: 1px solid rgba(39, 174, 96, 0.2);
        }
        
        .alert-danger {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--danger);
            border: 1px solid rgba(231, 76, 60, 0.2);
        }
        
        .teams-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .team-card {
            border: 1px solid var(--light-gray);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .team-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .team-name {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
        }
        
        .team-details {
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        .selling-form {
            background: var(--light);
            padding: 20px;
            border-radius: 10px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-input {
            flex: 1;
        }
        
        .search-button {
            padding: 12px 20px;
        }
        
        .clear-search {
            margin-top: 10px;
            text-align: center;
        }
        
        .clear-search button {
            background: none;
            border: none;
            color: var(--secondary);
            cursor: pointer;
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .players-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .header-actions {
                flex-direction: column;
                width: 100%;
            }
            
            .header-actions .btn {
                width: 100%;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            .search-button {
                width: 100%;
            }
            
            .agent-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
    
    <!-- Firebase App is always required and must be first -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-info">
                <h1>Agent Dashboard</h1>
                <p>Manage your players and teams</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-info" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <button class="btn btn-secondary" id="settingsBtn">
                    <i class="fas fa-cog"></i> Settings
                </button>
                <button class="btn btn-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
        
        <div id="agentDetailsContainer" class="agent-details">
            <!-- Agent details will be populated here -->
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="players">My Players</div>
            <div class="tab" data-tab="teams">Teams</div>
            <div class="tab" data-tab="selling">Sell Player</div>
        </div>
        
        <div class="tab-content active" id="players-tab">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-users"></i> My Players
                </div>
                <div class="card-body">
                    <div id="playersContainer" class="players-grid">
                        <div class="loading">
                            <div class="spinner"></div> Loading players...
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="tab-content" id="teams-tab">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-shield-alt"></i> Teams
                </div>
                <div class="card-body">
                    <div class="search-container">
                        <div class="form-group search-input">
                            <label for="teamSearch" class="form-label">Search Teams</label>
                            <input type="text" id="teamSearch" class="form-control" placeholder="Enter team name, LGA, or tier">
                        </div>
                        <div class="form-group">
                            <label class="form-label" style="opacity: 0;">Search</label>
                            <button id="searchBtn" class="btn btn-secondary search-button">
                                <i class="fas fa-search"></i> Search
                            </button>
                        </div>
                    </div>
                    <div id="teamsContainer" class="teams-list">
                        <div class="loading">
                            <div class="spinner"></div> Loading teams...
                        </div>
                    </div>
                    <div id="clearSearch" class="clear-search" style="display: none;">
                        <button id="clearSearchBtn">
                            <i class="fas fa-times"></i> Clear search and show all teams
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="tab-content" id="selling-tab">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-handshake"></i> Sell Player
                </div>
                <div class="card-body">
                    <div class="selling-form">
                        <div class="form-group">
                            <label for="playerSelect" class="form-label">Select Player</label>
                            <select id="playerSelect" class="form-control">
                                <option value="">Choose a player</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="teamSelect" class="form-label">Select Team</label>
                            <select id="teamSelect" class="form-control">
                                <option value="">Choose a team</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="contractType" class="form-label">Contract Type</label>
                            <select id="contractType" class="form-control">
                                <option value="Permanent">Permanent Transfer</option>
                                <option value="Loan">Loan</option>
                            </select>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="contractStartDate" class="form-label">Contract Start Date</label>
                                <input type="date" id="contractStartDate" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="contractEndDate" class="form-label">Contract End Date</label>
                                <input type="date" id="contractEndDate" class="form-control" required>
                            </div>
                        </div>
                        
                        <button id="sellBtn" class="btn btn-primary btn-block">
                            <i class="fas fa-check-circle"></i> Complete Transfer
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Player Details Modal -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalPlayerName">Player Name</h2>
                <button class="close-btn" id="closePlayerModal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="playerModalContent"></div>
            </div>
        </div>
    </div>
    
    <!-- Team Details Modal -->
    <div id="teamModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTeamName">Team Name</h2>
                <button class="close-btn" id="closeTeamModal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="teamModalContent"></div>
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
            authDomain: "gombefootball.firebaseapp.com",
            projectId: "gombefootball"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // Global variables
        let currentAgentId = null;
        let currentUserId = null;
        let players = [];
        let teams = [];
        let filteredTeams = [];
        let isSearching = false;
        let agentData = {};
        
        // Security: Check if user is authenticated and has agent role
        function checkAuth() {
            return new Promise((resolve, reject) => {
                auth.onAuthStateChanged(user => {
                    if (user) {
                        // User is signed in, check if they're an agent
                        db.collection("GombeAgents").doc(user.uid).get()
                            .then(doc => {
                                if (doc.exists) {
                                    currentUserId = user.uid;
                                    agentData = doc.data();
                                    currentAgentId = agentData.licenseNumber;
                                    displayAgentDetails(agentData);
                                    resolve(true);
                                } else {
                                    // User is not registered as an agent
                                    alert('Access denied. You are not registered as an agent.');
                                    auth.signOut();
                                    window.location.href = 'AgentsLogin.html';
                                    resolve(false);
                                }
                            })
                            .catch(error => {
                                console.error("Auth check error:", error);
                                alert('Authentication error. Please login again.');
                                auth.signOut();
                                window.location.href = 'AgentsLogin.html';
                                reject(error);
                            });
                    } else {
                        // No user is signed in
                        alert('Please login to access the agent dashboard');
                        window.location.href = 'AgentsLogin.html';
                        resolve(false);
                    }
                });
            });
        }
        
        // Display agent details
        function displayAgentDetails(agent) {
            const agentDetailsContainer = document.getElementById('agentDetailsContainer');
            
            const fields = [
                { label: 'Name', value: agent.name || 'N/A' },
                { label: 'Phone', value: agent.phone || 'N/A' },
                { label: 'Specialization', value: agent.specialization || 'N/A' },
                { label: 'Validity Years', value: agent.validityYears || 'N/A' },
                { label: 'License Number', value: agent.licenseNumber || 'N/A' },
                { label: 'License Type', value: agent.licenseType || 'N/A' },
                { label: 'Expiry Date', value: agent.expiryDate ? formatDate(agent.expiryDate) : 'N/A' },
                { label: 'Address', value: agent.address || 'N/A' },
                { label: 'Local Government', value: agent.localGovernment || 'N/A' }
            ];
            
            agentDetailsContainer.innerHTML = '';
            
            fields.forEach(field => {
                const detailItem = document.createElement('div');
                detailItem.className = 'agent-detail-item';
                detailItem.innerHTML = `
                    <div class="agent-detail-label">${field.label}</div>
                    <div class="agent-detail-value">${field.value}</div>
                `;
                agentDetailsContainer.appendChild(detailItem);
            });
        }
        
        // Helper function to format date
        function formatDate(dateString) {
            if (!dateString) return "N/A";
            
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }
        
        // Helper function to calculate days remaining
        function getDaysRemaining(endDate) {
            if (!endDate) return null;
            
            const today = new Date();
            const end = new Date(endDate);
            const diffTime = end - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            return diffDays;
        }
        
        // Tab functionality
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and content
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked tab and corresponding content
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
                
                // Load data if needed
                if (tab.dataset.tab === 'teams' && teams.length === 0) {
                    loadTeams();
                }
            });
        });
        
        // Load agent's players from the playerIds field in agent document
        async function loadPlayers() {
            try {
                const playersContainer = document.getElementById('playersContainer');
                playersContainer.innerHTML = '<div class="loading"><div class="spinner"></div> Loading players...</div>';
                
                // First get the agent document to access playerIds
                const agentDoc = await db.collection("GombeAgents").doc(currentUserId).get();
                
                if (!agentDoc.exists) {
                    playersContainer.innerHTML = '<div class="alert alert-danger">Agent profile not found.</div>';
                    return;
                }
                
                const agentData = agentDoc.data();
                const playerIds = agentData.playerIds || [];
                
                // If no player IDs, show empty state
                if (playerIds.length === 0) {
                    playersContainer.innerHTML = '<div class="alert alert-info">No players found for your agency.</div>';
                    return;
                }
                
                // Fetch all players with IDs in the playerIds array
                players = [];
                playersContainer.innerHTML = '';
                
                // Use Promise.all to fetch all players in parallel
                const playerPromises = playerIds.map(playerId => 
                    db.collection("playerRegistry").doc(playerId).get()
                );
                
                const playerSnapshots = await Promise.all(playerPromises);
                
                playerSnapshots.forEach(doc => {
                    if (doc.exists) {
                        const player = { id: doc.id, ...doc.data() };
                        players.push(player);
                        
                        // Calculate contract info
                        const contractInfo = player.contractEnd ? 
                            `Ends: ${formatDate(player.contractEnd)}` : 
                            "No contract";
                        
                        const daysRemaining = player.contractEnd ? getDaysRemaining(player.contractEnd) : null;
                        
                        const isSold = player.contractStart && player.contractEnd && player.AgentTeamAproval;
                        
                        const playerCard = document.createElement('div');
                        playerCard.className = 'player-card';
                        playerCard.innerHTML = `
                            ${isSold ? '<div class="sold-badge">SOLD</div>' : ''}
                            <div class="player-image" style="background-image: url('${player.imageUrl || 'https://via.placeholder.com/250x200?text=No+Image'}')"></div>
                            <div class="player-info">
                                <div class="player-name">${player.name}</div>
                                <div class="player-details">
                                    ${player.position || 'N/A'} | #${player.jerseyNumber || 'N/A'}<br>
                                    Value: $${player.playerValue ? player.playerValue.toLocaleString() : 'N/A'}<br>
                                    ${contractInfo}
                                    ${daysRemaining !== null ? `<br>${daysRemaining} days remaining` : ''}
                                    ${player.contractType ? `<div class="contract-badge contract-${player.contractType.toLowerCase()}">${player.contractType}</div>` : ''}
                                </div>
                                ${isSold ? `
                                <div class="player-actions">
                                    <button class="player-action-btn btn-warning force-move-btn" data-player-id="${player.id}">
                                        <i class="fas fa-exchange-alt"></i> Force Move
                                    </button>
                                </div>
                                ` : ''}
                            </div>
                        `;
                        
                        playerCard.addEventListener('click', (e) => {
                            // Don't open modal if clicking on action buttons
                            if (!e.target.closest('.player-action-btn')) {
                                showPlayerDetails(player);
                            }
                        });
                        
                        playersContainer.appendChild(playerCard);
                    }
                });
                
                // Add event listeners for force move buttons
                document.querySelectorAll('.force-move-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const playerId = btn.getAttribute('data-player-id');
                        forceMovePlayer(playerId);
                    });
                });
                
                // If no players were found (all documents might not exist)
                if (players.length === 0) {
                    playersContainer.innerHTML = '<div class="alert alert-info">No players found for your agency.</div>';
                    return;
                }
                
                // Populate player dropdown in selling tab with only unsold players
                const playerSelect = document.getElementById('playerSelect');
                playerSelect.innerHTML = '<option value="">Choose a player</option>';
                
                players.forEach(player => {
                    // Only include players without contract details
                    if (!player.contractStart && !player.contractEnd && !player.AgentTeamAproval) {
                        const option = document.createElement('option');
                        option.value = player.id;
                        option.textContent = player.name;
                        playerSelect.appendChild(option);
                    }
                });
                
            } catch (error) {
                console.error("Error loading players:", error);
                document.getElementById('playersContainer').innerHTML = 
                    '<div class="alert alert-danger">Failed to load players. Please try again later.</div>';
            }
        }
        
        // Force move player (clear contract details)
        async function forceMovePlayer(playerId) {
            if (!confirm('Are you sure you want to force move this player? This will clear their contract details and make them available for transfer again.')) {
                return;
            }
            
            try {
                // Clear contract details in player document
                await db.collection("playerRegistry").doc(playerId).update({
                    AgentTeamAproval: firebase.firestore.FieldValue.delete(),
                    contractEnd: firebase.firestore.FieldValue.delete(),
                    contractStart: firebase.firestore.FieldValue.delete(),
                    contractType: firebase.firestore.FieldValue.delete(),
                    teamName: firebase.firestore.FieldValue.delete(),
					teamId: "",
                    lastUpdated: new Date().toISOString()
                });
                
                alert('Player force moved successfully. Contract details cleared.');
                loadPlayers(); // Refresh the players list
            } catch (error) {
                console.error("Error force moving player:", error);
                alert('Failed to force move player. Please try again.');
            }
        }
        
        // Function to clean up invalid player IDs from agent's list
        async function cleanupInvalidPlayerIds() {
            try {
                const agentDoc = await db.collection("GombeAgents").doc(currentUserId).get();
                
                if (!agentDoc.exists) return;
                
                const agentData = agentDoc.data();
                const playerIds = agentData.playerIds || [];
                
                if (playerIds.length === 0) return;
                
                // Check each player ID to see if the document exists
                const checkPromises = playerIds.map(playerId => 
                    db.collection("playerRegistry").doc(playerId).get()
                );
                
                const playerSnapshots = await Promise.all(checkPromises);
                const validPlayerIds = [];
                
                playerSnapshots.forEach((doc, index) => {
                    if (doc.exists) {
                        validPlayerIds.push(playerIds[index]);
                    }
                });
                
                // Update agent document if there are invalid IDs
                if (validPlayerIds.length !== playerIds.length) {
                    await db.collection("GombeAgents").doc(currentUserId).update({
                        playerIds: validPlayerIds
                    });
                    
                    console.log(`Cleaned up ${playerIds.length - validPlayerIds.length} invalid player IDs`);
                }
                
            } catch (error) {
                console.error("Error cleaning up player IDs:", error);
            }
        }
        
        // Load teams
        async function loadTeams() {
            try {
                const teamsContainer = document.getElementById('teamsContainer');
                teamsContainer.innerHTML = '<div class="loading"><div class="spinner"></div> Loading teams...</div>';
                
                const teamsSnapshot = await db.collection("GombeTeams").get();
                
                teams = [];
                filteredTeams = [];
                teamsContainer.innerHTML = '';
                
                if (teamsSnapshot.empty) {
                    teamsContainer.innerHTML = '<div class="alert alert-info">No teams found.</div>';
                    return;
                }
                
                teamsSnapshot.forEach(doc => {
                    const team = { id: doc.id, ...doc.data() };
                    teams.push(team);
                    filteredTeams.push(team);
                    
                    const teamCard = document.createElement('div');
                    teamCard.className = 'team-card';
                    teamCard.innerHTML = `
                        <div class="team-name">${team.name}</div>
                        <div class="team-details">
                            ${team.tier ? `Tier: ${team.tier} | ` : ''}
                            ${team.lga ? `LGA: ${team.lga}` : ''}
                        </div>
                    `;
                    
                    teamCard.addEventListener('click', () => showTeamDetails(team));
                    teamsContainer.appendChild(teamCard);
                });
                
                // Populate team dropdown in selling tab
                const teamSelect = document.getElementById('teamSelect');
                teamSelect.innerHTML = '<option value="">Choose a team</option>';
                
                teams.forEach(team => {
                    const option = document.createElement('option');
                    option.value = team.id;
                    option.textContent = team.name;
                    teamSelect.appendChild(option);
                });
                
                // Add search functionality
                document.getElementById('searchBtn').addEventListener('click', filterTeams);
                
                // Allow pressing Enter to search
                document.getElementById('teamSearch').addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        filterTeams();
                    }
                });
                
            } catch (error) {
                console.error("Error loading teams:", error);
                document.getElementById('teamsContainer').innerHTML = 
                    '<div class="alert alert-danger">Failed to load teams. Please try again later.</div>';
            }
        }
        
        // Filter teams based on search input
        function filterTeams() {
            const searchTerm = document.getElementById('teamName').value.toLowerCase();
            const teamsContainer = document.getElementById('teamsContainer');
            
            if (!searchTerm) {
                // Show all teams if search is empty
                filteredTeams = [...teams];
                isSearching = false;
                document.getElementById('clearSearch').style.display = 'none';
            } else {
                // Filter teams based on search term
                filteredTeams = teams.filter(team => 
                    team.name.toLowerCase().includes(searchTerm) ||
                    (team.lga && team.lga.toLowerCase().includes(searchTerm)) ||
                    (team.tier && team.tier.toLowerCase().includes(searchTerm))
                );
                isSearching = true;
                document.getElementById('clearSearch').style.display = 'block';
            }
            
            // Update the teams display
            teamsContainer.innerHTML = '';
            
            if (filteredTeams.length === 0) {
                teamsContainer.innerHTML = '<div class="alert alert-info">No teams match your search.</div>';
                return;
            }
            
            filteredTeams.forEach(team => {
                const teamCard = document.createElement('div');
                teamCard.className = 'team-card';
                teamCard.innerHTML = `
                    <div class="team-name">${team.name}</div>
                    <div class="team-details">
                        ${team.tier ? `Tier: ${team.tier} | ` : ''}
                        ${team.lga ? `LGA: ${team.lga}` : ''}
                    </div>
                `;
                
                teamCard.addEventListener('click', () => showTeamDetails(team));
                teamsContainer.appendChild(teamCard);
            });
        }
        
        // Clear search and show all teams
        function clearSearch() {
            document.getElementById('teamSearch').value = '';
            filteredTeams = [...teams];
            isSearching = false;
            document.getElementById('clearSearch').style.display = 'none';
            
            const teamsContainer = document.getElementById('teamsContainer');
            teamsContainer.innerHTML = '';
            
            teams.forEach(team => {
                const teamCard = document.createElement('div');
                teamCard.className = 'team-card';
                teamCard.innerHTML = `
                    <div class="team-name">${team.name}</div>
                    <div class="team-details">
                        ${team.tier ? `Tier: ${team.tier} | ` : ''}
                        ${team.lga ? `LGA: ${team.lga}` : ''}
                    </div>
                `;
                
                teamCard.addEventListener('click', () => showTeamDetails(team));
                teamsContainer.appendChild(teamCard);
            });
        }
        
        // Show player details in modal
        function showPlayerDetails(player) {

            const modalContent = document.getElementById('playerModalContent');

            modalContent.innerHTML = `
                <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <div style="height: 250px; background-color: #f0f0f0; background-image: url('${player.imageUrl || 'https://via.placeholder.com/250x250?text=No+Image'}'); background-size: cover; background-position: center; border-radius: 10px;"></div>
                    </div>
                    <div style="flex: 2; min-width: 250px;">
                        <h3 style="margin-bottom: 15px; color: var(--primary);">Player Information</h3>
                        <div class="stats-grid">

                                <div class="stat-label">Position</div>
                                <div class="stat-value">${player.position || 'N/A'}</div>

                                <div class="stat-value">${player.jerseyNumber || 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Value</div>
                                <div class="stat-value">$${player.playerValue ? player.playerValue.toLocaleString() : 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Date of Birth</div>
                                <div class="stat-value">${player.dateOfBirth ? formatDate(player.dateOfBirth) : 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Nationality</div>
                                <div class="stat-value">${player.nationality || 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Height</div>
                                <div class="stat-value">${player.height || 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Weight</div>
                                <div class="stat-value">${player.weight || 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Preferred Foot</div>
                                <div class="stat-value">${player.preferredFoot || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                ${player.contractStart && player.contractEnd ? `
                <div style="background-color: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                    <h3 style="margin-bottom: 15px; color: var(--primary);">Contract Information</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">Contract Type</div>
                            <div class="stat-value">${player.contractType || 'N/A'}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Team</div>
                            <div class="stat-value">${player.teamName || 'N/A'}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Contract Start</div>
                            <div class="stat-value">${formatDate(player.contractStart)}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Contract End</div>
                            <div class="stat-value">${formatDate(player.contractEnd)}</div>
                        </div>
                        ${daysRemaining !== null ? `
                        <div class="stat-item">
                            <div class="stat-label">Days Remaining</div>
                            <div class="stat-value">${daysRemaining}</div>
                        </div>
                        ` : ''}
                    </div>
                </div>
                ` : ''}
                
                <div style="background-color: #f8f9fa; padding: 15px; border-radius: 10px;">
                    <h3 style="margin-bottom: 15px; color: var(--primary);">Performance Stats</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">Goals</div>
                            <div class="stat-value">${player.goals || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Assists</div>
                            <div class="stat-value">${player.assists || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Yellow Cards</div>
                            <div class="stat-value">${player.yellowCards || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Red Cards</div>
                            <div class="stat-value">${player.redCards || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Appearances</div>
                            <div class="stat-value">${player.appearances || 0}</div>
                        </div>
                    </div>
                </div>
            `;
            
            modal.style.display = 'block';
        }
        
        // Show team details in modal
        function showTeamDetails(team) {
            const modal = document.getElementById('teamModal');
            const modalTeamName = document.getElementById('modalTeamName');
            const modalContent = document.getElementById('teamModalContent');
            
            modalTeamName.textContent = team.name;
            
            modalContent.innerHTML = `
                <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <div style="height: 200px; background-color: #f0f0f0; background-image: url('${team.logoUrl || 'https://via.placeholder.com/200x200?text=No+Logo'}'); background-size: contain; background-position: center; background-repeat: no-repeat; border-radius: 10px;"></div>
                    </div>
                    <div style="flex: 2; min-width: 250px;">
                        <h3 style="margin-bottom: 15px; color: var(--primary);">Team Information</h3>
                        <div class="stats-grid">

                                <div class="stat-label">Tier</div>

                            </div>
                            <div class="stat-item">
                                <div class="stat-label">LGA</div>
                                <div class="stat-value">${team.lga || 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Stadium</div>
                                <div class="stat-value">${team.stadium || 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Year Founded</div>
                                <div class="stat-value">${team.yearFounded || 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Manager</div>
                                <div class="stat-value">${team.manager || 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Phone</div>
                                <div class="stat-value">${team.phone || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div style="background-color: #f8f9fa; padding: 15px; border-radius: 10px;">
                    <h3 style="margin-bottom: 15px; color: var(--primary);">Team Performance</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">Wins</div>
                            <div class="stat-value">${team.wins || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Losses</div>
                            <div class="stat-value">${team.losses || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Draws</div>
                            <div class="stat-value">${team.draws || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Goals Scored</div>
                            <div class="stat-value">${team.goalsScored || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Goals Conceded</div>
                            <div class="stat-value">${team.goalsConceded || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Points</div>
                            <div class="stat-value">${team.points || 0}</div>

            modal.style.display = 'block';
        }
        
        // Close modals
        document.getElementById('closePlayerModal').addEventListener('click', () => {
            document.getElementById('playerModal').style.display = 'none';
        });
        
        document.getElementById('closeTeamModal').addEventListener('click', () => {
            document.getElementById('teamModal').style.display = 'none';
        });
        
        // Close modals when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('playerModal')) {
                document.getElementById('playerModal').style.display = 'none';
            }
            if (e.target === document.getElementById('teamModal')) {
                document.getElementById('teamModal').style.display = 'none';
            }
        });
        
        // Sell player functionality
        document.getElementById('sellBtn').addEventListener('click', async () => {
            const playerId = document.getElementById('playerSelect').value;
            const teamId = document.getElementById('teamSelect').value;
            const contractType = document.getElementById('contractType').value;
            const contractStartDate = document.getElementById('contractStartDate').value;
            const contractEndDate = document.getElementById('contractEndDate').value;
            
            // Validate inputs
            if (!playerId || !teamId || !contractStartDate || !contractEndDate) {
                alert('Please fill in all required fields.');
                return;
            }
            
            const startDate = new Date(contractStartDate);
            const endDate = new Date(contractEndDate);
            
            if (endDate <= startDate) {
                alert('Contract end date must be after start date.');
                return;
            }
            
            try {
                // Get player and team data
                const playerDoc = await db.collection("playerRegistry").doc(playerId).get();
                const teamDoc = await db.collection("GombeTeams").doc(teamId).get();
                
                if (!playerDoc.exists || !teamDoc.exists) {
                    alert('Player or team not found.');
                    return;
                }
                
                const player = playerDoc.data();
                const team = teamDoc.data();
                
                // Update player document with contract details
                await db.collection("playerRegistry").doc(playerId).update({
                    AgentTeamAproval: team.name,
                    contractStart: contractStartDate,
                    contractEnd: contractEndDate,
                    contractType: contractType,
                    teamName: team.name,
                    lastUpdated: new Date().toISOString()
                });
                
                
                alert(`Successfully transferred ${player.name} to ${team.name}!`);
                
                // Reset form
                document.getElementById('playerSelect').value = '';
                document.getElementById('teamSelect').value = '';
                document.getElementById('contractType').value = 'Permanent';
                document.getElementById('contractStartDate').value = '';
                document.getElementById('contractEndDate').value = '';
                
                // Refresh players list
                loadPlayers();
                
            } catch (error) {
                console.error("Error transferring player:", error);
                alert('Failed to complete transfer. Please try again.');
            }
        });
        
        // Refresh button
        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadPlayers();
            if (document.getElementById('teams-tab').classList.contains('active')) {
                loadTeams();
            }
        });
        
        // Settings button
        document.getElementById('settingsBtn').addEventListener('click', () => {
            // Navigate to settings page with agentId
            window.location.href = `AgentsSettings.html?agentId=${currentAgentId}`;
        });
        
        // Logout button
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut().then(() => {
                window.location.href = 'AgentsLogin.html';
            });
        });
        
        // Clear search button
        document.getElementById('clearSearchBtn').addEventListener('click', clearSearch);
        
        // Initialize the application
        async function initApp() {
            try {
                await checkAuth();
                await cleanupInvalidPlayerIds();
                await loadPlayers();
                
                // Set up event listeners for tabs
                document.querySelectorAll('.tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        if (tab.dataset.tab === 'teams' && teams.length === 0) {
                            loadTeams();
                        }
                    });
                });
                
            } catch (error) {
                console.error("Error initializing app:", error);
            }
        }
        
        // Start the application
        initApp();
    </script>
</body>
</html>
