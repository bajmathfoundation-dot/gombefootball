<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Division Winner Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #f5f9f5;
            color: #2e7d32;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 25px 0;
            margin-bottom: 20px;
            background: #2e7d32;
            border-radius: 10px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        header p {
            max-width: 700px;
            margin: 0 auto;
            font-size: 1.05rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #e0f2e1;
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1b5e20;
            padding-bottom: 15px;
            border-bottom: 2px solid #c8e6c9;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 1rem;
            color: #2e7d32;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #c8e6c9;
            background: white;
            font-size: 1rem;
            font-weight: 400;
            transition: all 0.3s ease;
            color: #2e7d32;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        .teams-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #f1f8e9;
            border-radius: 8px;
            border: 1px solid #e8f5e9;
        }

        .team-item {
            padding: 10px;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #e8f5e9;
            font-size: 0.95rem;
        }

        .team-item:hover {
            background: #e8f5e9;
        }

        .team-item.selected {
            background: #c8e6c9;
            border-color: #4caf50;
        }

        .team-item input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #4caf50;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 25px;
            gap: 12px;
        }

        button {
            padding: 12px 28px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .primary-btn {
            background: #4caf50;
            color: white;
        }

        .primary-btn:hover:not(:disabled) {
            background: #388e3c;
        }

        .secondary-btn {
            background: #f5f5f5;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .secondary-btn:hover:not(:disabled) {
            background: #e8f5e9;
        }

        .status-container {
            margin-top: 25px;
            text-align: center;
            padding: 18px;
            border-radius: 8px;
            background: #e8f5e9;
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(46, 125, 50, 0.3);
            border-radius: 50%;
            border-top-color: #2e7d32;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            margin-top: 35px;
            padding: 20px;
            color: #388e3c;
            font-size: 0.9rem;
        }

        .error {
            color: #d32f2f;
            font-weight: 500;
            padding: 10px;
            border-radius: 6px;
            margin: 8px 0;
            background: #ffebee;
            border: 1px solid #ffcdd2;
            font-size: 0.95rem;
        }

        .year-input {
            margin-top: 15px;
        }

        .year-input label {
            margin-bottom: 5px;
        }

        .year-input input {
            width: 200px;
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .card {
                padding: 20px;
            }
            
            .year-input input {
                width: 100%;
                margin-bottom: 10px;
            }
        }
 </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>League Division Winner Selection</h1>
            <p>Select a zone and choose the winning team from League Phase</p>
        </header>
        
        <main>
            <div class="card">
                <h2>Winner Selection</h2>
                <div class="form-group">
                    <label for="zoneSelect">Select Football Zone:</label>
                    <select id="zoneSelect">
                        <option value="">-- Choose a zone --</option>
                          <!--<option value="central-zone">Central Zone</option>-->
                       <option value="northern-zone">Northern Zone</option> 
                        <!-- <option value="southern-zone">Southern Zone</option> -->
                        <!-- <option value="eastern-zone">Eastern Zone</option> -->
                    </select>
                </div>
                
                <div class="form-group">
                    <h3>League Phase Teams</h3>
                    <p>Select the winning team for this zone</p>
                    <div class="teams-container" id="leaguePhaseTeams">
                        <p>Select a zone to load teams</p>
                    </div>
                </div>
                
                <div class="form-group year-input" id="yearInputContainer" style="display: none;">
                    <label for="yearInput">Season Year (e.g., 2025/26):</label>
                    <input type="text" id="yearInput" placeholder="2025/26">
                </div>
                
                <div class="button-container">
                    <button id="saveBtn" class="primary-btn" disabled>
                        <span id="saveText">Save Winner</span>
                        <span id="saveLoader" class="loader" style="display: none;"></span>
                    </button>
                    <button id="resetBtn" class="secondary-btn">Reset</button>
                </div>
            </div>
            
            <div class="status-container" id="statusMessage" style="display: none;"></div>
        </main>
        
        
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
            authDomain: "gombefootball.firebaseapp.com",
            projectId: "gombefootball"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // DOM elements
        const zoneSelect = document.getElementById('zoneSelect');
        const leaguePhaseTeams = document.getElementById('leaguePhaseTeams');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMessage = document.getElementById('statusMessage');
        const saveText = document.getElementById('saveText');
        const saveLoader = document.getElementById('saveLoader');
        const yearInput = document.getElementById('yearInput');
        const yearInputContainer = document.getElementById('yearInputContainer');
        
        // App state
        let selectedZone = '';
        let leaguePhaseTeamsList = [];
        let selectedWinnerId = '';
        
        // Event listeners
        zoneSelect.addEventListener('change', loadTeamsForZone);
        saveBtn.addEventListener('click', saveWinner);
        resetBtn.addEventListener('click', resetSelection);
        yearInput.addEventListener('input', validateForm);
        
        // Validate form and enable/disable save button
        function validateForm() {
            const isTeamSelected = selectedWinnerId !== '';
            const isYearEntered = yearInput.value.trim() !== '';
            saveBtn.disabled = !(isTeamSelected && isYearEntered);
        }
        
        // Load teams for selected zone
        async function loadTeamsForZone() {
            selectedZone = zoneSelect.value;
            selectedWinnerId = '';
            
            if (!selectedZone) {
                resetSelection();
                return;
            }
            
            // Show loading state
            leaguePhaseTeams.innerHTML = '<p>Loading teams... <span class="loader"></span></p>';
            saveBtn.disabled = true;
            yearInputContainer.style.display = 'none';
            yearInput.value = '';
            
            try {
                // Get zone document from leaguezones
                const zoneDoc = await db.collection('leaguezones').doc(selectedZone).get();
                
                if (!zoneDoc.exists) {
                    throw new Error('Zone data not found!');
                }
                
                const zoneData = zoneDoc.data();
                const zoneTeams = zoneData.teams || [];
                
                // Normalize zone team names (case-insensitive)
                const normalizedZoneTeams = zoneTeams.map(name => name.trim().toLowerCase());
                
                // Get all teams from GombeTeams collection
                const teamsSnapshot = await db.collection('GombeTeams').get();
                
                if (teamsSnapshot.empty) {
                    throw new Error('No teams found in GombeTeams collection!');
                }
                
                // Reset team list
                leaguePhaseTeamsList = [];
                
                // Process teams
                teamsSnapshot.forEach(doc => {
                    const team = doc.data();
                    const teamName = team.name || '';
                    const normalizedTeamName = teamName.trim().toLowerCase();
                    
                    // Only include teams from the selected zone that are in leaguezones
                    if (normalizedZoneTeams.includes(normalizedTeamName)) {
                        // Normalize tier value for case-insensitive comparison
                        const tierValue = (team.tier || '').toString().toLowerCase().trim();
                        
                        if (tierValue === 'league_phase') {
                            leaguePhaseTeamsList.push({
                                id: doc.id,
                                name: teamName
                            });
                        }
                    }
                });
                
                // Render teams
                renderTeams();
                
            } catch (error) {
                console.error('Error loading teams:', error);
                leaguePhaseTeams.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        }
        
        // Render teams in the UI
        function renderTeams() {
            // Render league phase teams
            if (leaguePhaseTeamsList.length === 0) {
                leaguePhaseTeams.innerHTML = '<p class="error">No League Phase teams found for this zone</p>';
            } else {
                leaguePhaseTeams.innerHTML = '';
                leaguePhaseTeamsList.forEach(team => {
                    const isSelected = selectedWinnerId === team.id;
                    const teamEl = document.createElement('div');
                    teamEl.className = `team-item ${isSelected ? 'selected' : ''}`;
                    teamEl.innerHTML = `
                        <input type="radio" name="winner" id="team-${team.id}" ${isSelected ? 'checked' : ''}>
                        <label for="team-${team.id}">${team.name}</label>
                    `;
                    teamEl.querySelector('input').addEventListener('change', () => {
                        selectedWinnerId = team.id;
                        yearInputContainer.style.display = 'block';
                        yearInput.focus();
                        validateForm();
                        renderTeams();
                    });
                    leaguePhaseTeams.appendChild(teamEl);
                });
            }
        }
        
      async function saveWinner() {
    if (!selectedWinnerId) {
        alert('Please select a winning team');
        return;
    }

    const seasonYear = yearInput.value.trim();
    if (!seasonYear) {
        alert('Please enter the season year (e.g., 2025/26)');
        return;
    }

    try {
        // Show loading state
        saveText.innerHTML = 'Saving...';
        saveLoader.style.display = 'inline-block';
        saveBtn.disabled = true;

        // Get the selected team
        const selectedTeam = leaguePhaseTeamsList.find(team => team.id === selectedWinnerId);
        
        if (!selectedTeam) {
            throw new Error('Selected team not found');
        }

        // Format zone ID for display
        const formattedZoneId = selectedZone.charAt(0).toUpperCase() + 
                              selectedZone.slice(1).replace('-zone', ' Zone');

        // Create references for the new structure
        const zoneRef = db.collection('GombeLeagueWinners').doc(selectedZone);
        const teamRef = zoneRef.collection('Teams').doc(selectedTeam.name);

        // First, get the current team data to check if it exists
        const teamDoc = await teamRef.get();

        if (teamDoc.exists) {
            // Team exists - update existing record
            await teamRef.update({
                years: firebase.firestore.FieldValue.arrayUnion(seasonYear),
                trophyCount: firebase.firestore.FieldValue.increment(1),
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            });
        } else {
            // New team - create initial record
            await teamRef.set({
                teamName: selectedTeam.name,
                zone: formattedZoneId,
                years: [seasonYear],
                trophyCount: 1,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        // Create a safe document ID by replacing slashes with another character
        const safeSeasonId = seasonYear.replace(/\//g, '-');
        
        // Add to the Wins subcollection for detailed records
        const winRef = teamRef.collection('Wins').doc(safeSeasonId);
        await winRef.set({
            season: seasonYear,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Update the zone document with summary info
        await zoneRef.set({
            zoneName: formattedZoneId,
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        // Show success message
        statusMessage.style.display = 'block';
        statusMessage.innerHTML = `
            <div style="color: #1b5e20; font-weight: 600; margin-bottom: 10px;">
                ✅ Winner saved successfully!
            </div>
            <p><strong>Zone:</strong> ${formattedZoneId}</p>
            <p><strong>Winner:</strong> ${selectedTeam.name}</p>
            <p><strong>Season:</strong> ${seasonYear}</p>
            <p><strong>Total Trophies:</strong> ${teamDoc.exists ? (teamDoc.data().trophyCount || 0) + 1 : 1}</p>
            <p style="margin-top: 10px; font-size: 0.9rem;">Saved under: GombeLeagueWinners/${selectedZone}/Teams/${selectedTeam.name}/Wins/${safeSeasonId}</p>
        `;

        // Reset form
        yearInput.value = '';
        yearInputContainer.style.display = 'none';
        selectedWinnerId = '';
        renderTeams();

    } catch (error) {
        console.error('Error saving winner:', error);
        statusMessage.style.display = 'block';
        statusMessage.innerHTML = `
            <div style="color: #d32f2f; font-weight: 600; margin-bottom: 10px;">
                ❌ Error saving winner
            </div>
            <p class="error">${error.message}</p>
        `;
    } finally {
        // Reset button state
        saveText.innerHTML = 'Save Winner';
        saveLoader.style.display = 'none';
        validateForm();
    }
}
        
        // Reset selection
        function resetSelection() {
            selectedZone = '';
            leaguePhaseTeamsList = [];
            selectedWinnerId = '';
            
            leaguePhaseTeams.innerHTML = '<p>Select a zone to load teams</p>';
            zoneSelect.value = '';
            yearInput.value = '';
            yearInputContainer.style.display = 'none';
            
            saveBtn.disabled = true;
            statusMessage.style.display = 'none';
        }
    </script>
</body>
</html>
