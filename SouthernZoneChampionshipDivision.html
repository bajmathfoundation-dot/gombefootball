<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southern Zone - Championship Division</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #2c3e50;
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .description {
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .table-container {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease;
        }
        
        .zone-header {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .league-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .league-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e9ecef;
        }
        
        .league-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .league-table tr:last-child td {
            border-bottom: none;
        }
        
        .league-table tr:hover {
            background: #f8f9fa;
        }
        
        .fa-cup {
            background: rgba(255, 165, 0, 0.1);
            border-left: 4px solid #f39c12;
        }
        
        .position {
            font-weight: bold;
            text-align: center;
            width: 50px;
        }
        
        .team-name {
            font-weight: 600;
            cursor: pointer;
            color: #3498db;
            transition: color 0.2s;
        }
        
        .team-name:hover {
            color: #e74c3c;
            text-decoration: underline;
        }
        
        .stats {
            text-align: center;
            width: 60px;
        }
        
        .qualification-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .legend-item:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        
        .fa-color {
            background: #f39c12;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #7f8c8d;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #7f8c8d;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            .league-table {
                font-size: 0.9rem;
            }
            
            .league-table th, 
            .league-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Southern Zone - Championship Division</h1>
            <p class="description">View Championship standings for Southern Zone. Top 3 teams qualify for League Division.</p>
        </header>
        
        <!-- <div class="qualification-legend"> -->
            <!-- <div class="legend-item" id="fa-cup-btn"> -->
                <!-- <div class="legend-color fa-color"></div> -->
                <!-- <span><a href="CompetitionsChampionship.html" class="dropdown-link" style="text-decoration: none; list-style: none;">FA Cup Matches</span> -->
            <!-- </div> -->
        <!-- </div> -->
        
        <div id="tables-container">
            <!-- League table will be generated here -->
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
            authDomain: "gombefootball.firebaseapp.com",
            databaseURL: "https://gombefootball-default-rtdb.firebaseio.com",
            projectId: "gombefootball",
            storageBucket: "gombefootball.firebasestorage.app",
            messagingSenderId: "120731655706",
            appId: "1:120731655706:web:9c99d6831aca3df563bba3",
            measurementId: "G-8SCVPBSKPG"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Global variables
        let teamIdCache = {};
        let teamNameCache = {};
        
        // DOM elements
        const tablesContainer = document.getElementById('tables-container');
        const faCupBtn = document.getElementById('fa-cup-btn');
        
        // Load all teams from Firestore for ID mapping
        async function loadAllTeams() {
            try {
                const snapshot = await db.collection('GombeTeams').get();
                
                snapshot.forEach(doc => {
                    const teamData = doc.data();
                    teamIdCache[teamData.name] = doc.id;
                    teamNameCache[doc.id] = teamData.name;
                });
                
                console.log("Loaded team ID mapping:", teamIdCache);
            } catch (err) {
                console.error('Error loading teams:', err);
            }
        }
        
        // Load and display table for Southern Zone
        async function loadSouthernZoneTable() {
            // Show loading state
            tablesContainer.innerHTML = `
                <div class="table-container">
                    <div class="zone-header">Southern Zone</div>
                    <div class="loading">Loading data for Southern Zone...</div>
                </div>
            `;
            
            try {
                const doc = await db.collection('Championship_division').doc('Southern Zone').get();
                
                if (!doc.exists) {
                    tablesContainer.innerHTML = `
                        <div class="table-container">
                            <div class="zone-header">Southern Zone</div>
                            <div class="no-data">No data available for Southern Zone</div>
                        </div>
                    `;
                    return;
                }
                
                const data = doc.data();
                
                if (!data.teams || !Array.isArray(data.teams) || data.teams.length === 0) {
                    tablesContainer.innerHTML = `
                        <div class="table-container">
                            <div class="zone-header">Southern Zone</div>
                            <div class="no-data">No teams found in Southern Zone</div>
                        </div>
                    `;
                    return;
                }
                
                // Sort teams by points, then goal difference, then goals scored
                const sortedTeams = [...data.teams].sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    if (b.GD !== a.GD) return b.GD - a.GD;
                    return b.GS - a.GS;
                });
                
                // Render the table
                renderLeagueTable(sortedTeams);
            } catch (err) {
                console.error('Error loading data for Southern Zone:', err);
                tablesContainer.innerHTML = `
                    <div class="table-container">
                        <div class="zone-header">Southern Zone</div>
                        <div class="no-data">Error loading data for Southern Zone. Please check the console.</div>
                    </div>
                `;
            }
        }
        
        // Render league table for Southern Zone
        function renderLeagueTable(teams) {
            let tableHTML = `
                <div class="table-container">
                    <div class="zone-header">Southern Zone - League Table</div>
                    <table class="league-table">
                        <thead>
                            <tr>
                                <th class="position">Pos</th>
                                <th class="team-name">Team</th>
                                <th class="stats">P</th>
                                <th class="stats">W</th>
                                <th class="stats">D</th>
                                <th class="stats">L</th>
                                <th class="stats">GS</th>
                                <th class="stats">GA</th>
                                <th class="stats">GD</th>
                                <th class="stats">Pts</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            teams.forEach((team, index) => {
                const position = index + 1;
                let rowClass = '';
                
                // Only highlight the top 3 teams for FA Cup qualification
                if (position <= 3) {
                    rowClass = 'fa-cup';
                }
                
                // Get team ID for linking to profile
                const teamId = teamIdCache[team.name] || '';
                
                tableHTML += `
                    <tr class="${rowClass}">
                        <td class="position">${position}</td>
                        <td class="team-name" onclick="viewTeamProfile('${teamId}', '${team.name}')">${team.name}</td>
                        <td class="stats">${team.M || 0}</td>
                        <td class="stats">${team.W || 0}</td>
                        <td class="stats">${team.D || 0}</td>
                        <td class="stats">${team.L || 0}</td>
                        <td class="stats">${team.GS || 0}</td>
                        <td class="stats">${team.GA || 0}</td>
                        <td class="stats">${team.GD || 0}</td>
                        <td class="stats">${team.points || 0}</td>
                    </tr>
                `;
            });
            
            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;
            
            tablesContainer.innerHTML = tableHTML;
        }
        
        // View team profile
        function viewTeamProfile(teamId, teamName) {
            if (teamId) {
                // Redirect to team profile page with teamId parameter
                window.location.href = `GombeTeamsProfileFinal.html?teamId=${teamId}`;
            } else if (teamName) {
                // Try to find the team ID by name
                const foundId = Object.keys(teamNameCache).find(id => teamNameCache[id] === teamName);
                if (foundId) {
                    window.location.href = `GombeTeamsProfileFinal.html?teamId=${foundId}`;
                } else {
                    alert(`Team profile for ${teamName} is not available. The team may not exist in the database.`);
                }
            }
        }
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', async () => {
            await loadAllTeams();
            await loadSouthernZoneTable();
            
            // Add event listener for FA Cup qualification button
            faCupBtn.addEventListener('click', () => {
                highlightQualificationZone('fa-cup');
            });
        });
        
        // Highlight a specific qualification zone
        function highlightQualificationZone(zoneClass) {
            const rows = document.querySelectorAll('.league-table tr');
            
            // Remove any existing highlights
            rows.forEach(row => {
                row.style.opacity = '1';
                row.style.transform = 'scale(1)';
            });
            
            // Highlight the selected zone
            rows.forEach(row => {
                if (row.classList.contains(zoneClass)) {
                    row.style.opacity = '1';
                    row.style.transform = 'scale(1.02)';
                    row.style.transition = 'all 0.3s ease';
                } else {
                    row.style.opacity = '0.6';
                }
            });
            
            // Reset after 3 seconds
            setTimeout(() => {
                rows.forEach(row => {
                    row.style.opacity = '1';
                    row.style.transform = 'scale(1)';
                });
            }, 3000);
        }
    </script>
</body>
</html>
