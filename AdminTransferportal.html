<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gombe Football | Player Transfer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 0;
    }
    header {
      background: #014421;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.8em;
      font-weight: bold;
    }
    form {
      background: white;
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    form label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }
    form input, form select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #014421;
      color: white;
      padding: 12px 18px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #02743a;
    }
    .readonly {
      background: #eee;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>Transfer Player to New Team</header>
  <form id="transferForm">
    <label for="psn">Player PSN</label>
    <input type="text" id="psn" required placeholder="e.g. 000123" />

    <button type="button" onclick="loadPlayer()">Load Player</button>

    <label for="name">Player Name</label>
    <input type="text" id="name" readonly class="readonly" />

    <label for="oldTeam">Current Team</label>
    <input type="text" id="oldTeam" readonly class="readonly" />

    <label for="oldJersey">Current Jersey Number</label>
    <input type="text" id="oldJersey" readonly class="readonly" />

    <label for="newTeam">New Team</label>
    <select id="newTeam" required>
      <option value="">-- Loading Teams... --</option>
    </select>

    <label for="newJersey">New Jersey Number</label>
    <select id="newJersey" required>
      <option value="">-- Select team first --</option>
    </select>

    <button type="submit">Confirm Transfer</button>
  </form>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
      authDomain: "gombefootball.firebaseapp.com",
      projectId: "gombefootball"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const psnInput = document.getElementById("psn");
    const nameInput = document.getElementById("name");
    const oldTeamInput = document.getElementById("oldTeam");
    const oldJerseyInput = document.getElementById("oldJersey");
    const newTeamDropdown = document.getElementById("newTeam");
    const newJerseyDropdown = document.getElementById("newJersey");

    // Load all teams from leaguezones
    db.collection("leaguezones").get().then(snapshot => {
      let allTeams = [];
      snapshot.forEach(doc => {
        const arr = doc.data().teams;
        if (Array.isArray(arr)) allTeams.push(...arr);
      });
      allTeams.sort();
      newTeamDropdown.innerHTML = '<option value="">-- Select New Team --</option>';
      allTeams.forEach(team => {
        const opt = document.createElement("option");
        opt.value = team;
        opt.textContent = team;
        newTeamDropdown.appendChild(opt);
      });
    });

    async function loadPlayer() {
      const psn = psnInput.value.trim();
      if (!psn) return alert("Please enter a PSN");
      const doc = await db.collection("playerRegistry").doc(psn).get();
      if (!doc.exists) return alert("No player found with that PSN");

      const data = doc.data();
      nameInput.value = data.name;
      oldTeamInput.value = data.teamName;
      oldJerseyInput.value = data.jerseyNumber;
    }

    newTeamDropdown.addEventListener("change", async function () {
      const team = this.value;
      newJerseyDropdown.innerHTML = '<option>Loading...</option>';
      const taken = new Set();
      const snapshot = await db.collection("playerRegistry").where("teamName", "==", team).get();
      snapshot.forEach(doc => {
        const num = doc.data().jerseyNumber;
        if (typeof num === "number") taken.add(num);
      });

      newJerseyDropdown.innerHTML = '<option value="">-- Select Jersey Number --</option>';
      for (let i = 1; i <= 99; i++) {
        if (!taken.has(i)) {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = i;
          newJerseyDropdown.appendChild(opt);
        }
      }

      if (taken.size >= 99) {
        newJerseyDropdown.innerHTML = '<option value="">All jerseys taken</option>';
      }
    });

    document.getElementById("transferForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const psn = psnInput.value.trim();
      const newTeam = newTeamDropdown.value;
      const newJersey = parseInt(newJerseyDropdown.value);

      if (!psn || !newTeam || !newJersey) {
  return alert("Please complete all fields before submitting.");
}

// 🔒 Check if destination team already has 33 players
const newTeamSnap = await db.collection("playerRegistry")
  .where("teamName", "==", newTeam).get();

if (newTeamSnap.size >= 33) {
  alert(`❌ ${newTeam} already has 33 registered players. Transfer cannot proceed.`);
  return;
}

      const playerRef = db.collection("playerRegistry").doc(psn);

      try {
        const playerDoc = await playerRef.get();
        if (!playerDoc.exists) return alert("Player not found.");

        const currentData = playerDoc.data();
        const updatedData = {
          ...currentData,
          teamName: newTeam,
          jerseyNumber: newJersey,
          teamID: psn + "_" + newTeam
        };

        await playerRef.set(updatedData);
        alert(`✅ Player ${currentData.name} has been transferred to ${newTeam}!`);
        document.getElementById("transferForm").reset();
        newJerseyDropdown.innerHTML = '<option value="">-- Select team first --</option>';
      } catch (err) {
        console.error("❌ Transfer failed:", err);
        alert("Something went wrong during transfer.");
      }
    });
  </script>
</body>
</html>
