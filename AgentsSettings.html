<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Settings | Gombe Football Association</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #1a2a6c;
            --secondary: #3494e6;
            --accent: #fdbb2d;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --info: #17a2b8;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --card-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        body {
            background: linear-gradient(135deg, #f0f5ff, #e6f0ff);
            color: #333;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
        }
        
        .header-info h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .header-info p {
            color: var(--gray);
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-secondary {
            background-color: var(--secondary);
            color: white;
        }
        
        .btn-success {
            background-color: var(--success);
            color: white;
        }
        
        .btn-danger {
            background-color: var(--danger);
            color: white;
        }
        
        .btn-warning {
            background-color: var(--warning);
            color: white;
        }
        
        .btn-info {
            background-color: var(--info);
            color: white;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .card-header {
            background: linear-gradient(to right, var(--secondary), var(--primary));
            color: white;
            padding: 20px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-body {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--light-gray);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(52, 148, 230, 0.2);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-success {
            background-color: rgba(39, 174, 96, 0.1);
            color: var(--success);
            border: 1px solid rgba(39, 174, 96, 0.2);
        }
        
        .alert-danger {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--danger);
            border: 1px solid rgba(231, 76, 60, 0.2);
        }
        
        .loading {
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .password-toggle {
            position: relative;
        }
        
        .password-toggle-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--gray);
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .header-actions {
                flex-direction: column;
                width: 100%;
            }
            
            .header-actions .btn {
                width: 100%;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
    
    <!-- Firebase App is always required and must be first -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-info">
                <h1>Agent Settings</h1>
                <p>Manage your account details and security</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" id="backBtn">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </button>
                <button class="btn btn-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
        
        <div id="alertContainer"></div>
        
        <div class="card">
            <div class="card-header">
                <i class="fas fa-user"></i> Profile Information
            </div>
            <div class="card-body">
                <form id="profileForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" id="phone" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="specialization" class="form-label">Specialization</label>
                            <input type="text" id="specialization" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="localGovernment" class="form-label">Local Government</label>
                            <input type="text" id="localGovernment" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="address" class="form-label">Address</label>
                        <textarea id="address" class="form-control" rows="3" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update Profile
                    </button>
                </form>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <i class="fas fa-lock"></i> Change Password
            </div>
            <div class="card-body">
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="currentPassword" class="form-label">Current Password</label>
                        <div class="password-toggle">
                            <input type="password" id="currentPassword" class="form-control" required>
                            <span class="password-toggle-icon" id="toggleCurrentPassword">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="newPassword" class="form-label">New Password</label>
                        <div class="password-toggle">
                            <input type="password" id="newPassword" class="form-control" required minlength="6">
                            <span class="password-toggle-icon" id="toggleNewPassword">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                        <div class="password-toggle">
                            <input type="password" id="confirmPassword" class="form-control" required minlength="6">
                            <span class="password-toggle-icon" id="toggleConfirmPassword">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-key"></i> Change Password
                    </button>
                </form>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <i class="fas fa-id-card"></i> License Information
            </div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">License Number</label>
                        <input type="text" class="form-control" id="licenseNumber" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">License Type</label>
                        <input type="text" class="form-control" id="licenseType" disabled>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Validity Years</label>
                        <input type="text" class="form-control" id="validityYears" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Expiry Date</label>
                        <input type="text" class="form-control" id="expiryDate" disabled>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
            authDomain: "gombefootball.firebaseapp.com",
            projectId: "gombefootball"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // Global variables
        let currentAgentId = null;
        let currentUserId = null;
        let agentData = {};
        
        // Security: Check if user is authenticated and has agent role
        function checkAuth() {
            return new Promise((resolve, reject) => {
                auth.onAuthStateChanged(user => {
                    if (user) {
                        // User is signed in, check if they're an agent
                        db.collection("GombeAgents").doc(user.uid).get()
                            .then(doc => {
                                if (doc.exists) {
                                    currentUserId = user.uid;
                                    agentData = doc.data();
                                    currentAgentId = agentData.licenseNumber;
                                    loadAgentData();
                                    resolve(true);
                                } else {
                                    // User is not registered as an agent
                                    alert('Access denied. You are not registered as an agent.');
                                    auth.signOut();
                                    window.location.href = 'AgentsLogin.html';
                                    resolve(false);
                                }
                            })
                            .catch(error => {
                                console.error("Auth check error:", error);
                                alert('Authentication error. Please login again.');
                                auth.signOut();
                                window.location.href = 'AgentsLogin.html';
                                reject(error);
                            });
                    } else {
                        // No user is signed in
                        alert('Please login to access the agent settings');
                        window.location.href = 'AgentsLogin.html';
                        resolve(false);
                    }
                });
            });
        }
        
        // Load agent data into form
        function loadAgentData() {
            document.getElementById('name').value = agentData.name || '';
            document.getElementById('phone').value = agentData.phone || '';
            document.getElementById('specialization').value = agentData.specialization || '';
            document.getElementById('localGovernment').value = agentData.localGovernment || '';
            document.getElementById('address').value = agentData.address || '';
            document.getElementById('licenseNumber').value = agentData.licenseNumber || '';
            document.getElementById('licenseType').value = agentData.licenseType || '';
            document.getElementById('validityYears').value = agentData.validityYears || '';
            document.getElementById('expiryDate').value = agentData.expiryDate ? formatDate(agentData.expiryDate) : '';
        }
        
        // Helper function to format date
        function formatDate(dateString) {
            if (!dateString) return "N/A";
            
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }
        
        // Show alert message
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            
            alertContainer.appendChild(alert);
            
            // Remove alert after 5 seconds
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }
        
        // Toggle password visibility
        function setupPasswordToggle() {
            const toggleCurrentPassword = document.getElementById('toggleCurrentPassword');
            const toggleNewPassword = document.getElementById('toggleNewPassword');
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
            
            toggleCurrentPassword.addEventListener('click', () => {
                const passwordInput = document.getElementById('currentPassword');
                const icon = toggleCurrentPassword.querySelector('i');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
            
            toggleNewPassword.addEventListener('click', () => {
                const passwordInput = document.getElementById('newPassword');
                const icon = toggleNewPassword.querySelector('i');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
            
            toggleConfirmPassword.addEventListener('click', () => {
                const passwordInput = document.getElementById('confirmPassword');
                const icon = toggleConfirmPassword.querySelector('i');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
        }
        
        // Update profile information
        async function updateProfile(profileData) {
            try {
                await db.collection("GombeAgents").doc(currentUserId).update(profileData);
                showAlert('Profile updated successfully!', 'success');
                return true;
            } catch (error) {
                console.error("Error updating profile:", error);
                showAlert('Failed to update profile. Please try again.', 'danger');
                return false;
            }
        }
        
        // Change password
        async function changePassword(currentPassword, newPassword) {
            try {
                const user = auth.currentUser;
                const credential = firebase.auth.EmailAuthProvider.credential(
                    user.email, 
                    currentPassword
                );
                
                // Reauthenticate user
                await user.reauthenticateWithCredential(credential);
                
                // Update password
                await user.updatePassword(newPassword);
                showAlert('Password changed successfully!', 'success');
                return true;
            } catch (error) {
                console.error("Error changing password:", error);
                
                let errorMessage = 'Failed to change password. ';
                switch (error.code) {
                    case 'auth/wrong-password':
                        errorMessage += 'Current password is incorrect.';
                        break;
                    case 'auth/weak-password':
                        errorMessage += 'New password is too weak.';
                        break;
                    default:
                        errorMessage += 'Please try again.';
                }
                
                showAlert(errorMessage, 'danger');
                return false;
            }
        }
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', async () => {
            // Check authentication
            const isAuthenticated = await checkAuth();
            
            if (isAuthenticated) {
                // Setup password toggle
                setupPasswordToggle();
                
                // Profile form submission
                document.getElementById('profileForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const profileData = {
                        name: document.getElementById('name').value,
                        phone: document.getElementById('phone').value,
                        specialization: document.getElementById('specialization').value,
                        localGovernment: document.getElementById('localGovernment').value,
                        address: document.getElementById('address').value,
                        lastUpdated: new Date().toISOString()
                    };
                    
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;
                    
                    submitBtn.innerHTML = '<div class="spinner"></div> Updating...';
                    submitBtn.disabled = true;
                    
                    const success = await updateProfile(profileData);
                    
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    
                    if (success) {
                        // Update agentData with new values
                        agentData = { ...agentData, ...profileData };
                    }
                });
                
                // Password form submission
                document.getElementById('passwordForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const currentPassword = document.getElementById('currentPassword').value;
                    const newPassword = document.getElementById('newPassword').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    
                    if (newPassword !== confirmPassword) {
                        showAlert('New passwords do not match.', 'danger');
                        return;
                    }
                    
                    if (newPassword.length < 6) {
                        showAlert('New password must be at least 6 characters long.', 'danger');
                        return;
                    }
                    
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;
                    
                    submitBtn.innerHTML = '<div class="spinner"></div> Changing...';
                    submitBtn.disabled = true;
                    
                    const success = await changePassword(currentPassword, newPassword);
                    
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    
                    if (success) {
                        // Clear password fields
                        document.getElementById('currentPassword').value = '';
                        document.getElementById('newPassword').value = '';
                        document.getElementById('confirmPassword').value = '';
                    }
                });
                
                // Back button
                document.getElementById('backBtn').addEventListener('click', () => {
                    window.location.href = 'Agentsprofile.html';
                });
                
                // Logout button
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    if (confirm('Are you sure you want to logout?')) {
                        auth.signOut().then(() => {
                            alert('Logout successful. Redirecting to login page...');
                            window.location.href = 'AgentsLogin.html';
                        }).catch(error => {
                            console.error("Logout error:", error);
                            alert('Error during logout. Please try again.');
                        });
                    }
                });
            }
        });
    </script>
</body>
</html>
