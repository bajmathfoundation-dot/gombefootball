<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Manager Login | Gombe Football</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #1a2a6c;
            --secondary: #3494e6;
            --accent: #fdbb2d;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            position: relative;
        }
        
        .login-header {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
        }
        
        .login-header-content {
            position: relative;
            z-index: 1;
        }
        
        .login-header h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .login-header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 350px;
            margin: 0 auto;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .form-group {
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-control {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            background: var(--light);
        }
        
        .form-control:focus {
            border-color: var(--secondary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(52, 148, 230, 0.15);
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 42px;
            cursor: pointer;
            color: var(--dark);
            opacity: 0.7;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: -10px;
            margin-bottom: 10px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .remember-me input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        .remember-me label {
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--dark);
        }
        
        .forgot-password {
            color: var(--secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .forgot-password:hover {
            color: var(--primary);
            text-decoration: underline;
        }
        
        .btn {
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--secondary);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .login-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .status {
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.5s ease-in;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid var(--success);
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid var(--danger);
        }
        
        .status.info {
            background: #cce5ff;
            color: #004085;
            border-left: 4px solid var(--secondary);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--accent);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        
        .option-link {
            color: var(--secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .option-link:hover {
            color: var(--primary);
            transform: translateX(5px);
        }
        
        @media (max-width: 480px) {
            .login-container {
                border-radius: 15px;
            }
            
            .login-header {
                padding: 30px 20px;
            }
            
            .login-body {
                padding: 30px 20px;
            }
            
            .login-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            
            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-header-content">
                <div class="logo-container">
                    <div class="logo">
                        <i class="fas fa-futbol"></i>
                    </div>
                </div>
                <h1><i class="fas fa-user-shield"></i> Manager Login</h1>
                <p>Access your team management dashboard</p>
            </div>
        </div>
        
        <div class="login-body">
            <div id="status" class="status"></div>
            
            <form class="login-form" id="loginForm">
                <!-- CSRF Token -->
                <input type="hidden" id="csrfToken" value="">
                
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your.email@example.com" autocomplete="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                    <span class="password-toggle" id="passwordToggle">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                
                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="ManagerForgotPassword.html" class="forgot-password">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="options-container">
                <a href="teamManagerAccess.html" class="option-link">
                    <i class="fas fa-user-plus"></i> Register as Manager
                </a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-check-compat.js"></script>
    
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-kTLOzJqhZp_5uzxYSgeX54LvO1DuwVw",
            authDomain: "gombefootball.firebaseapp.com",
            projectId: "gombefootball"
        };
        
        // Initialize Firebase with App Check
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appCheck = firebase.appCheck();
        appCheck.activate('6LcJXpMpAAAAAKoN7wKz7v9y6Q7Z6Q7Z6Q7Z6Q7Z', {
            isTokenAutoRefreshEnabled: true
        });
        
        // Generate CSRF Token
        function generateCSRFToken() {
            const token = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            document.getElementById('csrfToken').value = token;
            sessionStorage.setItem('csrfToken', token);
            return token;
        }
        
        // Verify CSRF Token
        function verifyCSRFToken(token) {
            const storedToken = sessionStorage.getItem('csrfToken');
            return token && storedToken && token === storedToken;
        }
        
        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const loginBtn = document.getElementById('loginBtn');
        const statusBox = document.getElementById('status');
        const csrfTokenInput = document.getElementById('csrfToken');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        
        // Rate limiting variables
        let loginAttempts = 0;
        let lastLoginAttempt = 0;
        const MAX_LOGIN_ATTEMPTS = 5;
        const LOGIN_TIMEOUT = 300000; // 5 minutes
        
        // Check for saved credentials on page load
        window.addEventListener('DOMContentLoaded', function() {
            const savedEmail = localStorage.getItem('rememberedEmail');
            const savedRememberMe = localStorage.getItem('rememberMe') === 'true';
            
            if (savedEmail) {
                emailInput.value = savedEmail;
            }
            
            if (savedRememberMe) {
                rememberMeCheckbox.checked = true;
            }
            
            generateCSRFToken();
        });
        
        // Check rate limiting for login
        function checkLoginRateLimit() {
            const now = Date.now();
            if (now - lastLoginAttempt < LOGIN_TIMEOUT && loginAttempts >= MAX_LOGIN_ATTEMPTS) {
                showStatus('⛔ Too many login attempts. Please try again later.', 'error');
                return false;
            }
            
            // Reset counter if timeout has passed
            if (now - lastLoginAttempt > LOGIN_TIMEOUT) {
                loginAttempts = 0;
            }
            
            loginAttempts++;
            lastLoginAttempt = now;
            return true;
        }
        
        // Toggle password visibility
        passwordToggle.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });
        
        // Handle login
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const csrfToken = csrfTokenInput.value;
            const rememberMe = rememberMeCheckbox.checked;
            
            // Verify CSRF token
            if (!verifyCSRFToken(csrfToken)) {
                showStatus('⛔ Security validation failed. Please refresh the page and try again.', 'error');
                return;
            }
            
            if (!email || !password) {
                showStatus('⛔ Please fill in all fields', 'error');
                return;
            }
            
            // Check rate limiting
            if (!checkLoginRateLimit()) {
                return;
            }
            
            // Save remember me preference
            if (rememberMe) {
                localStorage.setItem('rememberedEmail', email);
                localStorage.setItem('rememberMe', 'true');
            } else {
                localStorage.removeItem('rememberedEmail');
                localStorage.removeItem('rememberMe');
            }
            
            // Show loading state
            showStatus('<i class="fas fa-spinner fa-spin"></i> Authenticating...', 'info');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            
            try {
                // Set auth persistence based on remember me selection
                const persistence = rememberMe ? 
                    firebase.auth.Auth.Persistence.LOCAL : 
                    firebase.auth.Auth.Persistence.SESSION;
                
                await auth.setPersistence(persistence);
                
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                
                if (!userCredential.user.emailVerified) {
                    await userCredential.user.sendEmailVerification();
                    showStatus('⚠️ Please verify your email. A new verification link has been sent.', 'info');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                    
                    // Regenerate CSRF token
                    generateCSRFToken();
                    return;
                }
                
                // Get manager data from Firestore
                const teamSnapshot = await db.collection("GombeTeams")
                    .where("email", "==", email)
                    .limit(1)
                    .get();
                
                if (teamSnapshot.empty) {
                    throw new Error("Authentication failed");
                }
                
                const teamData = teamSnapshot.docs[0].data();
                const teamId = teamSnapshot.docs[0].id;
                
                // Use sessionStorage instead of localStorage
                sessionStorage.setItem("teamId", teamId);
                sessionStorage.setItem("managerPhone", teamData.phone || "");
                sessionStorage.setItem("teamName", teamData.teamName || teamData.name || "");
                sessionStorage.setItem("managerName", teamData.managerName || "");
                
                // Clear CSRF token after successful login
                sessionStorage.removeItem('csrfToken');
                
                // Successful login
                showStatus('✅ Login successful! Redirecting to dashboard...', 'success');
                
                // Reset login attempts on success
                loginAttempts = 0;
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = "ManagerProfile.html?teamId=" + teamId;
                }, 2000);
                
            } catch (error) {
                console.error("Login error:", error);
                
                let errorMessage = "Authentication failed. Please try again.";
                if (error.code === "auth/too-many-requests") {
                    errorMessage = "Too many login attempts. Please try again later.";
                } else if (error.code === "auth/user-disabled") {
                    errorMessage = "This account has been disabled";
                } else if (error.code === "auth/wrong-password") {
                    errorMessage = "Incorrect password. Please try again.";
                } else if (error.code === "auth/user-not-found") {
                    errorMessage = "No account found with this email.";
                }
                
                showStatus(`❌ ${errorMessage}`, 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                
                // Regenerate CSRF token on error
                generateCSRFToken();
            }
        });
        
        // Helper function to show status messages
        function showStatus(message, type) {
            if (!message) {
                statusBox.style.display = 'none';
                return;
            }
            
            statusBox.style.display = 'flex';
            statusBox.innerHTML = message;
            statusBox.className = 'status';
            
            if (type) {
                statusBox.classList.add(type);
            }
        }
        
        // Auto-focus email field
        emailInput.focus();
    </script>
</body>
</html>
